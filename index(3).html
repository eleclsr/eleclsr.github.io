\n            });\n\n            add3DTag('PB-START / STOP', '기동·정지 조작부', new THREE.Vector3(x, y + 1.75, z + 1.0), 'border-emerald-500/60 text-emerald-300');\n            scene.add(g);\n        }\n\n        // 4.8 3-Phase Squirrel-Cage Induction Motor & Open 6-Lead Terminal Box (U1, V1, W1 / W2, U2, V2)\n        function buildThreePhaseMotorAnd6TerminalBox(x, y, z) {\n            const g = new THREE.Group();\n            g.position.set(x, y, z);\n\n            const castIronMat = new THREE.MeshStandardMaterial({ color: 0x1e3a5f, roughness: 0.45, metalness: 0.55 });\n\n            // Stator Frame Cylinder\n            const stator = new THREE.Mesh(new THREE.CylinderGeometry(2.1, 2.1, 4.2, 32), castIronMat);\n            stator.rotation.z = Math.PI / 2;\n            stator.castShadow = true;\n            g.add(stator);\n\n            // Radial Cooling Fins along Stator Body\n            for (let i = 0; i < 16; i++) {\n                const angle = (i / 16) * Math.PI * 2;\n                const fin = new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.12, 0.35), castIronMat);\n                fin.position.set(0, Math.cos(angle) * 2.15, Math.sin(angle) * 2.15);\n                fin.rotation.x = angle;\n                g.add(fin);\n            }\n\n            // End Bell Shields\n            const endBellL = new THREE.Mesh(new THREE.CylinderGeometry(1.9, 2.08, 0.5, 32), castIronMat);\n            endBellL.rotation.z = Math.PI / 2;\n            endBellL.position.x = -2.25;\n            g.add(endBellL);\n\n            const endBellR = endBellL.clone();\n            endBellR.position.x = 2.25;\n            g.add(endBellR);\n\n            // Rotating Shaft + Cooling Fan Blades + Load Flywheel Disk\n            const shaftGroup = new THREE.Group();\n            const shaftMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, metalness: 0.9, roughness: 0.15 });\n            const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.38, 0.38, 6.4, 24), shaftMat);\n            shaft.rotation.z = Math.PI / 2;\n            shaft.position.x = 0.6;\n            shaftGroup.add(shaft);\n\n            // Keyway & Coupling Disc with visual high-contrast stripes so rotation RPM is unmistakable\n            const disc = new THREE.Mesh(\n                new THREE.CylinderGeometry(1.35, 1.35, 0.35, 24),\n                new THREE.MeshStandardMaterial({ color: 0x0f172a, metalness: 0.5 })\n            );\n            disc.rotation.z = Math.PI / 2;\n            disc.position.x = 3.45;\n            shaftGroup.add(disc);\n\n            for (let b = 0; b < 6; b++) {\n                const vane = new THREE.Mesh(\n                    new THREE.BoxGeometry(0.4, 1.15, 0.18),\n                    new THREE.MeshStandardMaterial({ color: b % 2 === 0 ? 0xf59e0b : 0x38bdf8 })\n                );\n                vane.rotation.x = (b / 6) * Math.PI * 2;\n                vane.position.x = 3.5;\n                shaftGroup.add(vane);\n            }\n            g.add(shaftGroup);\n            meshes.motorShaftGroup = shaftGroup;\n\n            // ================= OPEN 6-TERMINAL BLOCK BOX ON TOP OF MOTOR =================\n            const tBox = new THREE.Group();\n            tBox.position.set(-0.3, 2.55, 0.5);\n\n            const boxHousing = new THREE.Mesh(\n                new THREE.BoxGeometry(2.8, 1.85, 1.1),\n                new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.5 })\n            );\n            tBox.add(boxHousing);\n\n            // Ceramic Insulator Terminal Block\n            const ceramic = new THREE.Mesh(\n                new THREE.BoxGeometry(2.3, 1.35, 0.35),\n                new THREE.MeshStandardMaterial({ color: 0x7c2d12, roughness: 0.35 })\n            );\n            ceramic.position.z = 0.45;\n            tBox.add(ceramic);\n\n            // Faceplate Label for U1, V1, W1 (Top Row) and W2, U2, V2 (Bottom Row)\n            const termTex = createLabelTexture((ctx, w, h) => {\n                ctx.fillStyle = '#1e293b';\n                ctx.fillRect(0, 0, w, h);\n                ctx.fillStyle = '#f8fafc';\n                ctx.font = 'bold 24px monospace';\n                ctx.fillText('U1     V1     W1', 26, 52);\n                ctx.fillText('W2     U2     V2', 26, 225);\n                ctx.strokeStyle = '#475569';\n                ctx.lineWidth = 2;\n                ctx.strokeRect(8, 8, w - 16, h - 16);\n            });\n            const termFace = new THREE.Mesh(\n                new THREE.PlaneGeometry(2.25, 1.3),\n                new THREE.MeshBasicMaterial({ map: termTex })\n            );\n            termFace.position.z = 0.64;\n            tBox.add(termFace);\n\n            // 6 Brass Terminal Studs: Top [U1, V1, W1], Bottom [W2, U2, V2]\n            // Notice standard IEC motor block order: W2 is directly below U1, U2 below V1, V2 below W1!\n            const studMat = new THREE.MeshStandardMaterial({ color: 0xfacc15, metalness: 0.85, roughness: 0.2 });\n            const topNames = ['U1', 'V1', 'W1'];\n            const botNames = ['W2', 'U2', 'V2'];\n\n            [-0.7, 0, 0.7].forEach((sx, idx) => {\n                // Top Row Stud (U1, V1, W1)\n                const studTop = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, 0.28, 16), studMat);\n                studTop.rotation.x = Math.PI / 2;\n                studTop.position.set(sx, 0.32, 0.72);\n                tBox.add(studTop);\n\n                registerInteractable(studTop, {\n                    title: `전동기 고정자 시작단자 ${topNames[idx]}`,\n                    badge: 'MC-M 연결',\n                    desc: `3상 고정자 권선의 시작단(${topNames[idx]})입니다. 주 접촉기(MC-M) 출력단에서 전원을 공급받습니다.`,\n                    terminalId: topNames[idx],\n                    onClick: () => handleTerminalClick(topNames[idx])\n                });\n\n                // Bottom Row Stud (W2, U2, V2)\n                const studBot = studTop.clone();\n                studBot.position.set(sx, -0.32, 0.72);\n                tBox.add(studBot);\n\n                registerInteractable(studBot, {\n                    title: `전동기 고정자 끝단자 ${botNames[idx]}`,\n                    badge: 'Y단락 / Δ루프',\n                    desc: `3상 고정자 권선의 끝단(${botNames[idx]})입니다. Y기동 시에는 MC-Y에서 3상 단락(중성점 형성)되고, Δ운전 시에는 ${topNames[idx]}-${botNames[idx]} 쌍으로 380V 환상 루프를 형성합니다.`,\n                    terminalId: botNames[idx],\n                    onClick: () => handleTerminalClick(botNames[idx])\n                });\n\n                // Glowing internal winding indicator bar between U1-U2, V1-V2, W1-W2\n                const barMat = new THREE.MeshStandardMaterial({\n                    color: 0x334155,\n                    emissive: 0x38bdf8,\n                    emissiveIntensity: 0\n                });\n                const windingBar = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.42, 0.08), barMat);\n                windingBar.position.set(sx, 0, 0.68);\n                tBox.add(windingBar);\n                meshes.windingBarsU1V1W1.push(windingBar);\n            });\n\n            g.add(tBox);\n\n            registerInteractable(stator, {\n                title: '3상 농형 유도전동기 (380V 30kW 4극 6리드형)',\n                badge: '6단자 인출형',\n                desc: '고정자 3상 권선의 양 끝단(U1·V1·W1, W2·U2·V2) 6개 리드가 단자함으로 인출되어 외부 MC 조합에 의해 Y기동(220V) 및 Δ운전(380V)으로 전환됩니다.',\n                onClick: () => setCameraPreset('MOTOR_TERM')\n            });\n\n            add3DTag('3Φ INDUCTION MOTOR', 'U1·V1·W1 / W2·U2·V2 6단자함', new THREE.Vector3(x - 0.3, y + 4.1, z + 0.8), 'border-emerald-500/60 text-emerald-300');\n            scene.add(g);\n        }\n\n        // 4.9 3D Power Cables & Animated Current Flow Particles\n        function create3DCable(points, radius, colorHex, wireKey = null) {\n            const curve = new THREE.CatmullRomCurve3(points);\n            const geo = new THREE.TubeGeometry(curve, 36, radius, 10, false);\n            const mat = new THREE.MeshStandardMaterial({\n                color: colorHex,\n                roughness: 0.4,\n                metalness: 0.2\n            });\n            const mesh = new THREE.Mesh(geo, mat);\n            scene.add(mesh);\n            if (wireKey) {\n                practiceWireMeshes[wireKey] = mesh;\n            }\n            return { mesh, curve };\n        }\n\n        const wireCurves = {\n            feeder: [],\n            u1v1w1: [],\n            deltaLoop: [],\n            starBridge: []\n        };\n\n        function buildPowerBusbarsAnd3DWiring() {\n            const phaseColors = [0xef4444, 0x1e293b, 0x3b82f6]; // R(Red), S(Black), T(Blue)\n            const u1v1w1Keys = ['U1', 'V1', 'W1'];\n            const deltaKeys  = ['W2_D', 'U2_D', 'V2_D'];\n            const starKeys   = ['W2_Y', 'U2_Y', 'V2_Y'];\n\n            [-0.75, 0, 0.75].forEach((offset, idx) => {\n                const col = phaseColors[idx];\n                const zOff = 0.95 + idx * 0.08;\n\n                // 1. MCCB bottom -> EOCR -> MC-M top & MC-D top\n                const cFeeder = create3DCable([\n                    new THREE.Vector3(-5.5 + offset, 2.25, 0.95),\n                    new THREE.Vector3(-5.5 + offset, 1.45, zOff),\n                    new THREE.Vector3(-1.5 + offset, 1.45, zOff),\n                    new THREE.Vector3(-1.5 + offset, 4.7, 0.55),\n                    new THREE.Vector3(-1.5 + offset, 1.4, zOff),\n                    new THREE.Vector3(-5.6 + offset, 1.4, zOff),\n                    new THREE.Vector3(-5.6 + offset, 0.38, 1.08)\n                ], 0.065, col);\n                wireCurves.feeder.push(cFeeder.curve);\n\n                // Branch to MC-D top\n                create3DCable([\n                    new THREE.Vector3(-3.6 + offset, 1.4, zOff),\n                    new THREE.Vector3(-1.8 + offset, 1.4, zOff),\n                    new THREE.Vector3(-1.8 + offset, 0.38, 1.08)\n                ], 0.06, col);\n\n                // 2. MC-M bottom -> Motor U1, V1, W1 (Top Row of 6-Terminal Box)\n                const cMotorTop = create3DCable([\n                    new THREE.Vector3(-5.6 + offset, -2.38, 1.08),\n                    new THREE.Vector3(-5.6 + offset, -3.45 - idx * 0.12, zOff),\n                    new THREE.Vector3(7.2, -3.45 - idx * 0.12, zOff),\n                    new THREE.Vector3(7.6, 0.65, 1.1),\n                    new THREE.Vector3(9.3 + offset * 0.93, 0.67, 1.22)\n                ], 0.065, col, u1v1w1Keys[idx]);\n                wireCurves.u1v1w1.push({ curve: cMotorTop.curve, key: u1v1w1Keys[idx] });\n\n                // 3. MC-D bottom -> Motor W2, U2, V2 (Bottom Row of 6-Terminal Box)\n                const cDelta = create3DCable([\n                    new THREE.Vector3(-1.8 + offset, -2.38, 1.08),\n                    new THREE.Vector3(-1.8 + offset, -3.85 - idx * 0.12, zOff + 0.12),\n                    new THREE.Vector3(7.5, -3.85 - idx * 0.12, zOff + 0.12),\n                    new THREE.Vector3(7.9, 0.02, 1.15),\n                    new THREE.Vector3(9.3 + offset * 0.93, 0.03, 1.22)\n                ], 0.06, col, deltaKeys[idx]);\n                wireCurves.deltaLoop.push({ curve: cDelta.curve, key: deltaKeys[idx] });\n\n                // 4. MC-Y bottom -> Jumper to W2, U2, V2 for Star Shorting\n                const cStar = create3DCable([\n                    new THREE.Vector3(2.0 + offset, -2.38, 1.08),\n                    new THREE.Vector3(2.0 + offset, -3.85 - idx * 0.12, zOff + 0.15),\n                    new THREE.Vector3(-1.8 + offset, -3.85 - idx * 0.12, zOff + 0.15)\n                ], 0.055, 0xeab308, starKeys[idx]);\n                wireCurves.starBridge.push({ curve: cStar.curve, key: starKeys[idx] });\n            });\n        }\n\n        function buildCurrentFlowParticles() {\n            const sphereGeo = new THREE.SphereGeometry(0.13, 10, 10);\n\n            const addParticlesForCurves = (list, groupType, colorHex) => {\n                list.forEach(item => {\n                    const curve = item.curve || item;\n                    const key = item.key || null;\n                    for (let i = 0; i < 4; i++) {\n                        const mat = new THREE.MeshBasicMaterial({ color: colorHex });\n                        const p = new THREE.Mesh(sphereGeo, mat);\n                        p.visible = false;\n                        scene.add(p);\n                        currentParticles.push({\n                            mesh: p,\n                            curve,\n                            groupType,\n                            wireKey: key,\n                            t: i / 4\n                        });\n                    }\n                });\n            };\n\n            addParticlesForCurves(wireCurves.feeder, 'FEEDER', 0x38bdf8);\n            addParticlesForCurves(wireCurves.u1v1w1, 'U1V1W1', 0x10b981);\n            addParticlesForCurves(wireCurves.deltaLoop, 'DELTA', 0xef4444);\n            addParticlesForCurves(wireCurves.starBridge, 'STAR', 0xfacc15);\n        }\n\n        /***********************************************************************\n         * 5. STAR-DELTA (Y-Δ) ELECTRICAL CONTROL LOGIC & INTERACTIONS\n         ***********************************************************************/\n        function showToast(msg, iconClass = 'fa-circle-info text-amber-400') {\n            const banner = document.getElementById('toast-banner');\n            const icon = document.getElementById('toast-icon');\n            const text = document.getElementById('toast-text');\n            icon.className = `fa-solid ${iconClass} text-sm`;\n            text.textContent = msg;\n            banner.classList.remove('opacity-0', '-translate-y-2');\n            banner.classList.add('opacity-100', 'translate-y-0');\n            clearTimeout(banner._timer);\n            banner._timer = setTimeout(() => {\n                banner.classList.remove('opacity-100', 'translate-y-0');\n                banner.classList.add('opacity-0', '-translate-y-2');\n            }, 3400);\n        }\n\n        function toggleMCCB() {\n            SIM.mccbOn = !SIM.mccbOn;\n            playContactorClack(SIM.mccbOn ? 'CLOSE' : 'OPEN');\n            if (!SIM.mccbOn) {\n                stopAllContactors();\n                SIM.state = 'OFF';\n                showToast('MCCB 배선용 차단기가 OFF(차단) 되었습니다.', 'fa-power-off text-slate-400');\n            } else {\n                SIM.state = SIM.eocrTripped ? 'TRIP' : 'READY';\n                showToast('MCCB 주전원(3상 380V)이 투입되었습니다. PB-START를 눌러 기동하세요.', 'fa-bolt text-emerald-400');\n            }\n            updateUIAndSchematic();\n        }\n\n        function pressStartButton() {\n            SIM.pbStartPressed = 0.25;\n            if (!SIM.mccbOn) {\n                showToast('먼저 MCCB 차단기를 ON(투입) 해주세요!', 'fa-triangle-exclamation text-amber-400');\n                return;\n            }\n            if (SIM.eocrTripped) {\n                showToast('EOCR 과부하 트립 상태입니다! [EOCR 리셋] 버튼을 먼저 눌러주세요.', 'fa-triangle-exclamation text-rose-400');\n                return;\n            }\n            if (SIM.completedWires.size < SIM.totalRequiredWires) {\n                showToast(`미완성된 주회로 결선이 있습니다 (${SIM.completedWires.size}/${SIM.totalRequiredWires}). 결선을 먼저 완료하세요!`, 'fa-bezier-curve text-amber-400');\n                return;\n            }\n            if (SIM.state === 'STAR' || SIM.state === 'DELTA') {\n                showToast('이미 전동기가 운전 중입니다.', 'fa-circle-check text-emerald-400');\n                return;\n            }\n\n            // Energize MC-M (Main), Timer T, and MC-Y (Star)\n            SIM.state = 'STAR';\n            SIM.mcM = true;\n            SIM.mcY = true;\n            SIM.mcD = false;\n            SIM.timerEnergized = true;\n            SIM.timerElapsed = 0.0;\n            playContactorClack('CLOSE');\n            showToast(`Y(스타) 기동 개시! 상전압 Vp = 220V (380V/√3), 기동전류·토크 1/3로 제한 (${SIM.timerTarget.toFixed(1)}초 후 Δ 전환)`, 'fa-play text-amber-400');\n            updateUIAndSchematic();\n        }\n\n        function pressStopButton() {\n            SIM.pbStopPressed = 0.25;\n            playContactorClack('OPEN');\n            stopAllContactors();\n            if (SIM.mccbOn && !SIM.eocrTripped) {\n                SIM.state = 'READY';\n                showToast('PB-STOP 입력: 자기유지 회로가 해제되어 전동기가 감속 정지합니다.', 'fa-stop text-rose-400');\n            }\n            updateUIAndSchematic();\n        }\n\n        function stopAllContactors() {\n            SIM.mcM = false;\n            SIM.mcY = false;\n            SIM.mcD = false;\n            SIM.timerEnergized = false;\n            SIM.timerElapsed = 0.0;\n        }\n\n        function triggerEOCRTripTest() {\n            if (!SIM.mccbOn) {\n                showToast('MCCB 전원이 투입된 상태에서 EOCR 테스트가 가능합니다.', 'fa-circle-info text-sky-400');\n                return;\n            }\n            SIM.eocrTripped = true;\n            stopAllContactors();\n            SIM.state = 'TRIP';\n            SIM.thermalAccumulator = 0;\n            playContactorClack('TRIP');\n            showToast('⚡ EOCR 과전류 트립 동작! 95-96(b접점) 개방으로 전동기 비상 차단 및 97-98(OL) 경보 점멸', 'fa-triangle-exclamation text-rose-400');\n            updateUIAndSchematic();\n        }\n\n        function resetEOCR() {\n            if (!SIM.eocrTripped) {\n                showToast('현재 EOCR은 정상(복귀) 상태입니다.', 'fa-check text-emerald-400');\n                return;\n            }\n            SIM.eocrTripped = false;\n            SIM.thermalAccumulator = 0;\n            SIM.state = SIM.mccbOn ? 'READY' : 'OFF';\n            playContactorClack('CLOSE');\n            showToast('EOCR 트립이 정상 복귀(RESET) 되었습니다. 재기동이 가능합니다.', 'fa-rotate-right text-sky-400');\n            updateUIAndSchematic();\n        }\n\n        function testInterlockSafety() {\n            if (SIM.state === 'STAR') {\n                showToast('🛡️ [인터록 정상 작동] 현재 MC-Y(스타)가 여자되어 있어 MC-Y(b접점) 개방 및 기계적 인터록 레버가 MC-D 강제 투입을 차단했습니다!', 'fa-shield-halved text-emerald-400');\n            } else if (SIM.state === 'DELTA') {\n                showToast('🛡️ [인터록 정상 작동] 현재 MC-D(델타)가 여자되어 있어 MC-D(b접점) 개방 및 기계적 인터록 레버가 MC-Y 강제 투입을 차단했습니다!', 'fa-shield-halved text-emerald-400');\n            } else {\n                showToast('기동(Y 또는 Δ) 중에 이 버튼을 누르거나 전자접촉기를 클릭하면 동시투입 방지 인터록을 검증할 수 있습니다.', 'fa-shield-halved text-amber-400');\n            }\n        }\n\n        function inspectContactorAction(id) {\n            if (id === 'MC-D' && SIM.mcY) {\n                testInterlockSafety();\n            } else if (id === 'MC-Y' && SIM.mcD) {\n                testInterlockSafety();\n            } else if (id === 'MC-M') {\n                if (SIM.state === 'READY') pressStartButton();\n                else if (SIM.mcM) pressStopButton();\n            } else {\n                showToast(`${id}: 제어회로 시퀀스 및 인터록 조건에 의해 제어됩니다.`, 'fa-circle-info text-sky-400');\n            }\n        }\n\n        function updateTimerSetting(val) {\n            SIM.timerTarget = parseFloat(val);\n            document.getElementById('label-timer-set').textContent = `${SIM.timerTarget.toFixed(1)} 초`;\n        }\n\n        function updateLoadSetting(val) {\n            SIM.loadTorque = parseFloat(val);\n            document.getElementById('label-load-set').textContent = `${SIM.loadTorque.toFixed(0)} %`;\n        }\n\n        /***********************************************************************\n         * 6. 3D INTERACTIVE WIRING PRACTICE MODE\n         ***********************************************************************/\n        function setWorkMode(mode) {\n            SIM.workMode = mode;\n            const simBtn = document.getElementById('mode-sim-btn');\n            const wireBtn = document.getElementById('mode-wire-btn');\n            const wireBar = document.getElementById('wiring-practice-bar');\n\n            if (mode === 'WIRE') {\n                wireBtn.className = 'hud-btn px-2.5 py-1 rounded-md text-[11px] font-semibold bg-amber-500 text-slate-950';\n                simBtn.className = 'hud-btn px-2.5 py-1 rounded-md text-[11px] font-semibold text-slate-300 hover:text-white';\n                wireBar.classList.remove('hidden');\n                showToast('3D 결선 실습 모드입니다. [결선 초기화]를 눌러 직접 단자를 연결해보세요.', 'fa-bezier-curve text-amber-400');\n            } else {\n                simBtn.className = 'hud-btn px-2.5 py-1 rounded-md text-[11px] font-semibold bg-amber-500 text-slate-950';\n                wireBtn.className = 'hud-btn px-2.5 py-1 rounded-md text-[11px] font-semibold text-slate-300 hover:text-white';\n                wireBar.classList.add('hidden');\n            }\n        }\n\n        function clearPracticeWires() {\n            if (SIM.mcM) pressStopButton();\n            SIM.completedWires.clear();\n            SIM.selectedTerminal = null;\n            Object.values(practiceWireMeshes).forEach(m => m.visible = false);\n            updateWiringProgressUI();\n            showToast('주회로 결선이 초기화되었습니다. MC-M / MC-D / MC-Y 하부 단자와 전동기 6단자(U1~V2)를 클릭해 연결하세요.', 'fa-plug text-amber-400');\n        }\n\n        function autoCompleteWires() {\n            ['U1', 'V1', 'W1', 'W2_D', 'U2_D', 'V2_D', 'W2_Y', 'U2_Y', 'V2_Y'].forEach(k => {\n                SIM.completedWires.add(k);\n                if (practiceWireMeshes[k]) practiceWireMeshes[k].visible = true;\n            });\n            SIM.selectedTerminal = null;\n            updateWiringProgressUI();\n            playContactorClack('CLOSE');\n            showToast('표준 Y-Δ 6리드 주회로 결선 9가닥이 모두 완성되었습니다!', 'fa-check-double text-emerald-400');\n        }\n\n        function handleTerminalClick(termId) {\n            if (SIM.workMode !== 'WIRE') {\n                showToast(`단자 [${termId}] 점검 완료. 직접 결선 실습을 하려면 상단 [3D 결선 실습] 탭을 선택하세요.`, 'fa-screwdriver-wrench text-sky-400');\n                return;\n            }\n            if (!SIM.selectedTerminal) {\n                SIM.selectedTerminal = termId;\n                document.getElementById('wire-guide-text').textContent = `선택된 시작 단자: [${termId}] → 연결할 상대 단자를 클릭하세요.`;\n                return;\n            }\n            const a = SIM.selectedTerminal;\n            const b = termId;\n            SIM.selectedTerminal = null;\n\n            const pairMap = {\n                'MC-M_BOT_0:U1': 'U1', 'U1:MC-M_BOT_0': 'U1',\n                'MC-M_BOT_1:V1': 'V1', 'V1:MC-M_BOT_1': 'V1',\n                'MC-M_BOT_2:W1': 'W1', 'W1:MC-M_BOT_2': 'W1',\n                'MC-D_BOT_0:W2': 'W2_D', 'W2:MC-D_BOT_0': 'W2_D',\n                'MC-D_BOT_1:U2': 'U2_D', 'U2:MC-D_BOT_1': 'U2_D',\n                'MC-D_BOT_2:V2': 'V2_D', 'V2:MC-D_BOT_2': 'V2_D',\n                'MC-Y_BOT_0:W2': 'W2_Y', 'W2:MC-Y_BOT_0': 'W2_Y',\n                'MC-Y_BOT_1:U2': 'U2_Y', 'U2:MC-Y_BOT_1': 'U2_Y',\n                'MC-Y_BOT_2:V2': 'V2_Y', 'V2:MC-Y_BOT_2': 'V2_Y'\n            };\n\n            const matchedKey = pairMap[`${a}:${b}`];\n            if (matchedKey) {\n                SIM.completedWires.add(matchedKey);\n                if (practiceWireMeshes[matchedKey]) practiceWireMeshes[matchedKey].visible = true;\n                playContactorClack('CLOSE');\n                updateWiringProgressUI();\n                showToast(`결선 성공: [${a} ↔ ${b}] 연결 완료!`, 'fa-check text-emerald-400');\n            } else {\n                showToast(`오결선 경고: [${a}] 단자와 [${b}] 단자는 표준 Y-Δ 주회로 결선 쌍이 아닙니다!`, 'fa-xmark text-rose-400');\n                document.getElementById('wire-guide-text').textContent = `오결선 방지됨: [${a} ↔ ${b}]. 올바른 상 순서(U1-W2, V1-U2, W1-V2)를 확인하세요.`;\n            }\n        }\n\n        function updateWiringProgressUI() {\n            const count = SIM.completedWires.size;\n            document.getElementById('wire-progress-badge').textContent = `결선 ${count} / ${SIM.totalRequiredWires} 완료`;\n            if (count === SIM.totalRequiredWires) {\n                document.getElementById('wire-guide-text').textContent = '모든 Y-Δ 결선이 완료되었습니다! PB-START를 눌러 시운전하세요.';\n            }\n        }\n\n        /***********************************************************************\n         * 7. SYNCHRONIZE 2D SVG SCHEMATIC & HUD INDICATORS\n         ***********************************************************************/\n        function updateUIAndSchematic() {\n            // State Pill\n            const badge = document.getElementById('state-badge');\n            const dot = document.getElementById('state-dot');\n            const text = document.getElementById('state-text');\n\n            const stateStyles = {\n                'OFF':        { bg: 'bg-slate-800 text-slate-400 border-slate-700', dot: 'bg-slate-500', label: '차단기 OFF (전원차단)' },\n                'READY':      { bg: 'bg-emerald-950/80 text-emerald-300 border-emerald-500/50', dot: 'bg-emerald-400', label: '정지 / 기동 대기 (GL)' },\n                'STAR':       { bg: 'bg-amber-950/90 text-amber-300 border-amber-500/60', dot: 'bg-amber-400 animate-ping', label: 'Y (스타) 감압 기동중 (220V)' },\n                'OPEN_TRANS': { bg: 'bg-sky-950/90 text-sky-300 border-sky-500/60', dot: 'bg-sky-400', label: 'Y → Δ 절체중 (인터록 보호)' },\n                'DELTA':      { bg: 'bg-rose-950/90 text-rose-300 border-rose-500/60', dot: 'bg-rose-500 animate-pulse', label: 'Δ (델타) 정격 운전중 (380V)' },\n                'TRIP':       { bg: 'bg-orange-950/95 text-orange-300 border-orange-500', dot: 'bg-orange-500 animate-ping', label: 'EOCR 과전류 트립 (비상정지)' }\n            };\n            const st = stateStyles[SIM.state] || stateStyles['READY'];\n            badge.className = `px-2.5 py-1 rounded-md text-xs font-bold mono border flex items-center gap-1.5 ${st.bg}`;\n            dot.className = `w-2 h-2 rounded-full ${st.dot}`;\n            text.textContent = st.label;\n\n            // MCCB Footer Button\n            const mccbBtn = document.getElementById('btn-mccb');\n            const mccbTxt = document.getElementById('btn-mccb-text');\n            if (SIM.mccbOn) {\n                mccbBtn.className = 'hud-btn px-3 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs flex items-center gap-2 shadow-lg';\n                mccbTxt.textContent = 'MCCB 전원 ON (투입됨)';\n            } else {\n                mccbBtn.className = 'hud-btn px-3 py-2 rounded-xl bg-slate-700 hover:bg-slate-600 text-slate-200 font-bold text-xs flex items-center gap-2 shadow';\n                mccbTxt.textContent = 'MCCB 전원 OFF (차단됨)';\n            }\n\n            // Contactor Matrix Cards\n            const setCard = (id, active, activeText, color) => {\n                const el = document.getElementById(id);\n                if (active) {\n                    el.className = `p-1.5 rounded-lg bg-${color}-500/20 border border-${color}-500/60`;\n                    el.children[1].className = `text-xs font-bold mono text-${color}-300 mt-0.5`;\n                    el.children[1].textContent = activeText;\n                } else {\n                    el.className = 'p-1.5 rounded-lg bg-slate-900 border border-slate-800';\n                    el.children[1].className = 'text-xs font-bold mono text-slate-500 mt-0.5';\n                    el.children[1].textContent = 'OFF';\n                }\n            };\n            setCard('ind-mcm', SIM.mcM, 'ON (여자)', 'emerald');\n            setCard('ind-mcy', SIM.mcY, 'ON (Y단락)', 'amber');\n            setCard('ind-mcd', SIM.mcD, 'ON (Δ운전)', 'rose');\n            setCard('ind-timer', SIM.timerEnergized, SIM.mcD ? '한시동작' : '계시중', 'sky');\n\n            // Pilot Lamps on Footer HUD\n            const setLamp = (id, on, activeClass, offClass) => {\n                document.getElementById(id).className = `w-3.5 h-3.5 rounded-full border inline-block ${on ? activeClass : offClass}`;\n            };\n            setLamp('lamp-gl', SIM.mccbOn && !SIM.mcM && !SIM.eocrTripped, 'bg-emerald-400 border-emerald-200 shadow-[0_0_8px_#34d399]', 'bg-emerald-950 border-emerald-700');\n            setLamp('lamp-yl', SIM.mcY, 'bg-amber-400 border-amber-200 shadow-[0_0_8px_#fbbf24]', 'bg-amber-950 border-amber-700');\n            setLamp('lamp-rl', SIM.mcD, 'bg-rose-500 border-rose-200 shadow-[0_0_8px_#f43f5e]', 'bg-rose-950 border-rose-700');\n            setLamp('lamp-ol', SIM.eocrTripped, 'bg-orange-500 border-orange-200 shadow-[0_0_10px_#f97316] animate-pulse', 'bg-orange-950 border-orange-700');\n\n            // ================= 2D SVG SEQUENCE DIAGRAM SYNCHRONIZATION =================\n            // 1. MCCB blades\n            ['svg-mccb-1', 'svg-mccb-2', 'svg-mccb-3'].forEach((id, idx) => {\n                const x = 25 + idx * 20;\n                const el = document.getElementById(id);\n                el.setAttribute('x2', SIM.mccbOn ? x : x - 6);\n                el.setAttribute('stroke', SIM.mccbOn ? '#ef4444' : '#94a3b8');\n            });\n\n            // 2. Power wires highlighting\n            const setClass = (id, cls, cond) => {\n                const el = document.getElementById(id);\n                if (!el) return;\n                if (cond) el.classList.add(cls);\n                else el.classList.remove(cls);\n            };\n\n            setClass('svg-wire-mccb-out', 'wire-active', SIM.mccbOn);\n            setClass('svg-wire-u1v1w1', 'wire-power-d', SIM.mcM);\n            setClass('svg-wire-w2u2v2', SIM.mcD ? 'wire-power-d' : 'wire-power-y', SIM.mcY || SIM.mcD);\n            setClass('svg-wire-delta-loop', 'wire-power-d', SIM.mcD);\n            setClass('svg-wire-star-bridge', 'wire-power-y', SIM.mcY);\n\n            // 3. Control circuit contacts & coils\n            setClass('svg-ctrl-bus-r', 'wire-active', SIM.mccbOn);\n            document.getElementById('svg-eocr-nc').setAttribute('x2', SIM.eocrTripped ? '228' : '240');\n            document.getElementById('svg-mcm-hold').setAttribute('x2', SIM.mcM ? '275' : '267');\n\n            // Timer T-b (8-5) & T-a (8-6)\n            const timerDone = SIM.timerElapsed >= SIM.timerTarget;\n            document.getElementById('svg-contact-tb').setAttribute('x2', timerDone ? '304' : '314');\n            document.getElementById('svg-contact-ta').setAttribute('x2', timerDone ? '350' : '340');\n\n            // Interlock NC contacts MC-D(b) & MC-Y(b)\n            document.getElementById('svg-interlock-mcd').setAttribute('x2', SIM.mcD ? '304' : '314');\n            document.getElementById('svg-interlock-mcy').setAttribute('x2', SIM.mcY ? '340' : '350');\n\n            // Coils\n            setClass('svg-coil-mcm', 'coil-active-m', SIM.mcM);\n            setClass('svg-coil-t', 'coil-active-m', SIM.timerEnergized);\n            setClass('svg-coil-mcy', 'coil-active-y', SIM.mcY);\n            setClass('svg-coil-mcd', 'coil-active-d', SIM.mcD);\n            setClass('svg-box-mcm', 'coil-active-m', SIM.mcM);\n            setClass('svg-box-mcy', 'coil-active-y', SIM.mcY);\n            setClass('svg-box-mcd', 'coil-active-d', SIM.mcD);\n        }\n\n        /***********************************************************************\n         * 8. PHYSICS & ELECTRICAL SIMULATION STEP + OSCILLOSCOPE RENDERING\n         ***********************************************************************/\n        const chartCanvas = document.getElementById('telemetry-chart');\n        const chartCtx = chartCanvas.getContext('2d');\n\n        function stepSimulationPhysics(dt) {\n            // 1. Timer T & Open-Transition Y -> Delta Switchover Sequence\n            if (SIM.state === 'STAR') {\n                SIM.timerElapsed += dt;\n                if (SIM.timerElapsed >= SIM.timerTarget) {\n                    // Enter brief 50ms open-transition arc-clearing window before pulling in MC-D\n                    SIM.state = 'OPEN_TRANS';\n                    SIM.mcY = false;\n                    SIM.openTransitionTimer = 0.05;\n                    playContactorClack('OPEN');\n                    updateUIAndSchematic();\n                }\n            } else if (SIM.state === 'OPEN_TRANS') {\n                SIM.openTransitionTimer -= dt;\n                if (SIM.openTransitionTimer <= 0) {\n                    SIM.state = 'DELTA';\n                    SIM.mcD = true;\n                    SIM.deltaSwitchSpike = 85.0; // Realistic transient current spike on Y->Delta switch\n                    playContactorClack('CLOSE');\n                    showToast('🔄 타이머(T) 한시 동작 완료! MC-Y 개방 후 인터록을 거쳐 MC-D(델타 380V 전전압 운전)가 투입되었습니다.', 'fa-bolt text-rose-400');\n                    updateUIAndSchematic();\n                }\n            }\n\n            // 2. Calculate Phase Voltage, Motor Torque, Slip, RPM & Line Current\n            const slip = Math.max(0.015, (SIM.syncRpm - SIM.rpm) / SIM.syncRpm);\n\n            if (SIM.state === 'STAR') {\n                // In Star: V_phase = 380 / sqrt(3) = 220V. Starting current & torque are 1/3 of DOL!\n                SIM.phaseVoltage = 220.0;\n                const starInrush = (SIM.dolLockCurrent / 3.0) * Math.pow(slip, 0.55) + 19.0;\n                SIM.lineCurrent = starInrush + (SIM.loadTorque * 0.14);\n                // Available Star torque is ~ 1/3 of DOL breakdown torque\n                const availableStarTorque = 68.0 * (1.15 - slip * 0.35);\n                SIM.motorTorque = availableStarTorque;\n\n                const netAccel = availableStarTorque - (SIM.loadTorque * 0.55);\n                SIM.rpm = Math.min(1740, Math.max(0, SIM.rpm + netAccel * 11.5 * dt));\n\n            } else if (SIM.state === 'OPEN_TRANS') {\n                // Brief open transition during contactor changeover\n                SIM.phaseVoltage = 0.0;\n                SIM.lineCurrent = 0.0;\n                SIM.motorTorque = 0.0;\n                SIM.rpm = Math.max(0, SIM.rpm - 80 * dt);\n\n            } else if (SIM.state === 'DELTA') {\n                // In Delta: V_phase = V_line = 380V. Full torque & rated speed\n                SIM.phaseVoltage = 380.0;\n                SIM.deltaSwitchSpike = Math.max(0, SIM.deltaSwitchSpike - 240 * dt);\n                const steadyCurrent = 22.0 + (SIM.loadTorque / 100.0) * 38.0 + (slip * 160.0);\n                SIM.lineCurrent = steadyCurrent + SIM.deltaSwitchSpike;\n                SIM.motorTorque = Math.min(220, SIM.loadTorque + (1765 - SIM.rpm) * 0.8);\n\n                const targetDeltaRpm = 1785 - (SIM.loadTorque * 0.45);\n                SIM.rpm += (targetDeltaRpm - SIM.rpm) * 4.5 * dt;\n\n            } else {\n                // Motor de-energized (coasting down)\n                SIM.phaseVoltage = 0.0;\n                SIM.lineCurrent = 0.0;\n                SIM.motorTorque = 0.0;\n                SIM.rpm = Math.max(0, SIM.rpm - (260 + SIM.loadTorque * 2.2) * dt);\n            }\n\n            // 3. EOCR Overload Thermal Accumulation Check (Trips if Line Current > 62A sustained)\n            if (SIM.lineCurrent > 64.0 && SIM.state === 'DELTA') {\n                SIM.thermalAccumulator += ((SIM.lineCurrent - 60.0) / 25.0) * dt;\n                if (SIM.thermalAccumulator > 2.8) {\n                    triggerEOCRTripTest();\n                }\n            } else {\n                SIM.thermalAccumulator = Math.max(0, SIM.thermalAccumulator - 0.5 * dt);\n            }\n\n            // 4. Update Digital Multi-Meter DOM Readouts\n            document.getElementById('val-current').textContent = SIM.lineCurrent.toFixed(1);\n            document.getElementById('val-voltage').textContent = SIM.phaseVoltage.toFixed(0);\n            document.getElementById('val-rpm').textContent = Math.round(SIM.rpm);\n            document.getElementById('val-torque').textContent = SIM.motorTorque.toFixed(1);\n            document.getElementById('transition-timer- readout').textContent =\n                `T: ${Math.min(SIM.timerElapsed, SIM.timerTarget).toFixed(2)}s / ${SIM.timerTarget.toFixed(2)}s`;\n\n            const vMode = document.getElementById('kpi-voltage-mode');\n            if (SIM.state === 'STAR') vMode.textContent = 'Y결선 (380/√3)';\n            else if (SIM.state === 'DELTA') vMode.textContent = 'Δ결선 (전전압)';\n            else vMode.textContent = '대기 (0V)';\n\n            // 5. Push sample to Oscilloscope & Draw\n            SIM.history.push({\n                iL: SIM.lineCurrent,\n                rpm: SIM.rpm,\n                vp: SIM.phaseVoltage\n            });\n            if (SIM.history.length > 160) SIM.history.shift();\n            drawOscilloscope();\n            updateMotorAcoustics();\n        }\n\n        function drawOscilloscope() {\n            const w = chartCanvas.width;\n            const h = chartCanvas.height;\n            chartCtx.clearRect(0, 0, w, h);\n\n            // Subtle Grid\n            chartCtx.strokeStyle = 'rgba(51, 65, 85, 0.35)';\n            chartCtx.lineWidth = 1;\n            for (let y = 20; y < h; y += 25) {\n                chartCtx.beginPath();\n                chartCtx.moveTo(0, y);\n                chartCtx.lineTo(w, y);\n                chartCtx.stroke();\n            }\n\n            // EOCR 62A Threshold Reference Dashed Line\n            const tripY = h - (62 / 180) * (h - 14) - 6;\n            chartCtx.strokeStyle = 'rgba(244, 63, 94, 0.45)';\n            chartCtx.setLineDash([4, 4]);\n            chartCtx.beginPath();\n            chartCtx.moveTo(0, tripY);\n            chartCtx.lineTo(w, tripY);\n            chartCtx.stroke();\n            chartCtx.setLineDash([]);\n\n            const plotLine = (key, maxVal, color) => {\n                chartCtx.strokeStyle = color;\n                chartCtx.lineWidth = 2;\n                chartCtx.beginPath();\n                SIM.history.forEach((pt, idx) => {\n                    const x = (idx / (SIM.history.length - 1)) * w;\n                    const norm = Math.min(1, pt[key] / maxVal);\n                    const y = h - norm * (h - 14) - 6;\n                    if (idx === 0) chartCtx.moveTo(x, y);\n                    else chartCtx.lineTo(x, y);\n                });\n                chartCtx.stroke();\n            };\n\n            plotLine('vp', 420, '#38bdf8');   // Phase Voltage (220V -> 380V step)\n            plotLine('rpm', 1900, '#10b981'); // Motor Speed RPM\n            plotLine('iL', 180, '#f59e0b');   // Line Current A\n        }\n\n        /***********************************************************************\n         * 9. UPDATE 3D HARDWARE ANIMATIONS & FLOATING LABELS\n         ***********************************************************************/\n        function update3DHardwareVisuals(dt, elapsed) {\n            // 1. Smooth Camera Orbit Interpolation\n            camCtrl.theta += (camCtrl.desiredTheta - camCtrl.theta) * 0.12;\n            camCtrl.phi += (camCtrl.desiredPhi - camCtrl.phi) * 0.12;\n            camCtrl.radius += (camCtrl.desiredRadius - camCtrl.radius) * 0.12;\n            camCtrl.target.lerp(camCtrl.desiredTarget, 0.12);\n\n            camera.position.x = camCtrl.target.x + camCtrl.radius * Math.sin(camCtrl.phi) * Math.sin(camCtrl.theta);\n            camera.position.y = camCtrl.target.y + camCtrl.radius * Math.cos(camCtrl.phi);\n            camera.position.z = camCtrl.target.z + camCtrl.radius * Math.sin(camCtrl.phi) * Math.cos(camCtrl.theta);\n            camera.lookAt(camCtrl.target);\n\n            // 2. MCCB Lever Angle\n            if (meshes.mccbLever) {\n                const targetRotX = SIM.mccbOn ? -0.42 : 0.45;\n                meshes.mccbLever.rotation.x += (targetRotX - meshes.mccbLever.rotation.x) * 0.2;\n            }\n\n            // 3. Magnetic Contactor Plungers (Pull-in physically when energized!)\n            const updatePlunger = (mesh, energized) => {\n                if (!mesh) return;\n                const targetZ = energized ? 1.80 : 1.96;\n                mesh.position.z += (targetZ - mesh.position.z) * 0.25;\n            };\n            updatePlunger(meshes.plungerM, SIM.mcM);\n            updatePlunger(meshes.plungerD, SIM.mcD);\n            updatePlunger(meshes.plungerY, SIM.mcY);\n\n            // 4. Mechanical Interlock Rocker Arm Tilt\n            if (meshes.interlockArm) {\n                const targetTilt = SIM.mcY ? 0.25 : SIM.mcD ? -0.25 : 0;\n                meshes.interlockArm.rotation.z += (targetTilt - meshes.interlockArm.rotation.z) * 0.2;\n            }\n\n            // 5. Timer Dial Pointer & LEDs\n            if (meshes.timerPointer) {\n                const norm = (SIM.timerTarget / 10.0);\n                meshes.timerPointer.rotation.z = (0.75 - norm * 1.5) * Math.PI * 0.7;\n            }\n            if (meshes.timerLedPwr) {\n                meshes.timerLedPwr.material.emissiveIntensity = SIM.timerEnergized ? 1.2 : 0;\n            }\n            if (meshes.timerLedOut) {\n                meshes.timerLedOut.material.emissiveIntensity = SIM.mcD ? 1.4 : (SIM.state === 'STAR' ? (Math.sin(elapsed * 12) > 0 ? 0.9 : 0.1) : 0);\n            }\n\n            // 6. EOCR LEDs\n            if (meshes.eocrLedRun) {\n                meshes.eocrLedRun.material.emissiveIntensity = SIM.mccbOn && !SIM.eocrTripped ? 1.0 : 0.05;\n            }\n            if (meshes.eocrLedTrip) {\n                meshes.eocrLedTrip.material.emissiveIntensity = SIM.eocrTripped ? (Math.sin(elapsed * 14) > 0 ? 1.6 : 0.2) : 0;\n            }\n\n            // 7. Pushbutton Spring Return & Pilot Lamps\n            if (SIM.pbStartPressed > 0) SIM.pbStartPressed = Math.max(0, SIM.pbStartPressed - dt);\n            if (SIM.pbStopPressed > 0) SIM.pbStopPressed = Math.max(0, SIM.pbStopPressed - dt);\n            if (meshes.pbStartCap) meshes.pbStartCap.position.z = SIM.pbStartPressed > 0 ? 1.03 : 1.12;\n            if (meshes.pbStopCap) meshes.pbStopCap.position.z = SIM.pbStopPressed > 0 ? 1.03 : 1.12;\n\n            if (meshes.lampGL) meshes.lampGL.material.emissiveIntensity = (SIM.mccbOn && !SIM.mcM && !SIM.eocrTripped) ? 1.25 : 0.06;\n            if (meshes.lampYL) meshes.lampYL.material.emissiveIntensity = SIM.mcY ? 1.35 : 0.06;\n            if (meshes.lampRL) meshes.lampRL.material.emissiveIntensity = SIM.mcD ? 1.35 : 0.06;\n            if (meshes.lampOL) meshes.lampOL.material.emissiveIntensity = SIM.eocrTripped ? (Math.sin(elapsed * 12) > 0 ? 1.5 : 0.1) : 0.06;\n\n            // 8. 3-Phase Induction Motor Shaft Rotation & 6-Terminal Winding Excitation Glow\n            if (meshes.motorShaftGroup && SIM.rpm > 0.5) {\n                const radPerSec = (SIM.rpm / 60) * Math.PI * 2 * 0.25;\n                meshes.motorShaftGroup.rotation.x += radPerSec * dt;\n            }\n            meshes.windingBarsU1V1W1.forEach(bar => {\n                if (SIM.state === 'STAR') {\n                    bar.material.emissive.setHex(0xeab308);\n                    bar.material.emissiveIntensity = 0.75;\n                } else if (SIM.state === 'DELTA') {\n                    bar.material.emissive.setHex(0xef4444);\n                    bar.material.emissiveIntensity = 1.25;\n                } else {\n                    bar.material.emissiveIntensity = 0;\n                }\n            });\n            if (meshes.starShortingBridge) {\n                meshes.starShortingBridge.material.emissiveIntensity = SIM.mcY ? 1.2 : 0.1;\n            }\n\n            // 9. Animated 3D Current Particles along Active Cables\n            currentParticles.forEach(p => {\n                let active = false;\n                if (p.wireKey && !SIM.completedWires.has(p.wireKey)) {\n                    active = false;\n                } else if (p.groupType === 'FEEDER') {\n                    active = SIM.mccbOn && (SIM.mcM || SIM.mcD);\n                } else if (p.groupType === 'U1V1W1') {\n                    active = SIM.mcM;\n                } else if (p.groupType === 'STAR') {\n                    active = SIM.mcM && SIM.mcY;\n                } else if (p.groupType === 'DELTA') {\n                    active = SIM.mcM && SIM.mcD;\n                }\n\n                p.mesh.visible = active;\n                if (active) {\n                    const speed = SIM.state === 'STAR' ? 0.55 : 0.95;\n                    p.t = (p.t + dt * speed) % 1.0;\n                    const pos = p.curve.getPointAt(p.t);\n                    p.mesh.position.copy(pos);\n                }\n            });\n\n            // 10. Project 3D Floating Component Tags\n            labelAnchors.forEach(item => {\n                if (!SIM.show3DLabels) {\n                    item.el.style.opacity = '0';\n                    return;\n                }\n                const v = item.pos.clone().project(camera);\n                if (v.z > 1) {\n                    item.el.style.opacity = '0';\n                    return;\n                }\n                const x = (v.x * 0.5 + 0.5) * window.innerWidth;\n                const y = (-(v.y * 0.5) + 0.5) * window.innerHeight;\n                item.el.style.transform = `translate(-50%, -100%) translate(${x}px, ${y}px)`;\n                item.el.style.opacity = '1';\n            });\n        }\n\n        /***********************************************************************\n         * 10. CAMERA PRESETS, RAYCASTING & VIEWPORT CONTROLS\n         ***********************************************************************/\n        function setCameraPreset(preset) {\n            if (preset === 'OVERVIEW') {\n                camCtrl.desiredTheta = 0.08;\n                camCtrl.desiredPhi = 1.20;\n                camCtrl.desiredRadius = 19.5;\n                camCtrl.desiredTarget.set(1.5, 0.2, 0);\n            } else if (preset === 'CONTACTORS') {\n                camCtrl.desiredTheta = 0.05;\n                camCtrl.desiredPhi = 1.24;\n                camCtrl.desiredRadius = 11.5;\n                camCtrl.desiredTarget.set(-0.8, -1.0, 0.8);\n            } else if (preset === 'MOTOR_TERM') {\n                camCtrl.desiredTheta = -0.25;\n                camCtrl.desiredPhi = 1.05;\n                camCtrl.desiredRadius = 9.2;\n                camCtrl.desiredTarget.set(9.3, -0.3, 0.5);\n            } else if (preset === 'CONTROL_BOX') {\n                camCtrl.desiredTheta = 0.02;\n                camCtrl.desiredPhi = 1.22;\n                camCtrl.desiredRadius = 11.8;\n                camCtrl.desiredTarget.set(-0.5, 3.6, 0.6);\n            }\n        }\n\n        function toggle3DLabels() {\n            SIM.show3DLabels = false;\n        }\n\n        function toggleAudio() {\n            SIM.audioEnabled = !SIM.audioEnabled;\n            const icon = document.getElementById('sound-icon');\n            const btn = document.getElementById('btn-toggle-sound');\n            if (SIM.audioEnabled) {\n                icon.className = 'fa-solid fa-volume-high';\n                btn.classList.replace('text-slate-500', 'text-emerald-400');\n            } else {\n                icon.className = 'fa-solid fa-volume-xmark';\n                btn.classList.replace('text-emerald-400', 'text-slate-500');\n                updateMotorAcoustics();\n            }\n        }\n\n        let leftPanelOpen = false;\n        let rightPanelOpen = false;\n        function toggleLeftPanel() {\n            leftPanelOpen = !leftPanelOpen;\n            const el = document.getElementById('left-panel');\n            if (leftPanelOpen) el.classList.replace('hidden', 'flex');\n            else el.classList.replace('flex', 'hidden');\n        }\n        function toggleRightPanel() {\n            rightPanelOpen = !rightPanelOpen;\n            const el = document.getElementById('right-panel');\n            if (rightPanelOpen) el.classList.remove('hidden');\n            else el.classList.add('hidden');\n        }\n\n        function onPointerDown(e) {\n            camCtrl.isDown = true;\n            camCtrl.button = e.button;\n            camCtrl.lastX = e.clientX;\n            camCtrl.lastY = e.clientY;\n            camCtrl.dragMoved = false;\n            initAudioIfNeeded();\n        }\n\n        function onPointerMove(e) {\n            const dx = e.clientX - camCtrl.lastX;\n            const dy = e.clientY - camCtrl.lastY;\n\n            if (camCtrl.isDown) {\n                if (Math.abs(dx) > 3 || Math.abs(dy) > 3) camCtrl.dragMoved = true;\n                if (camCtrl.button === 0) {\n                    camCtrl.desiredTheta -= dx * 0.0065;\n                    camCtrl.desiredPhi = Math.max(0.35, Math.min(1.65, camCtrl.desiredPhi - dy * 0.0065));\n                } else if (camCtrl.button === 2) {\n                    camCtrl.desiredTarget.x -= dx * 0.022;\n                    camCtrl.desiredTarget.y += dy * 0.022;\n                }\n                camCtrl.lastX = e.clientX;\n                camCtrl.lastY = e.clientY;\n                return;\n            }\n\n            // Hover Raycast Cursor Change Only (No rectangular tooltip box blocking the 3D view)\n            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;\n            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;\n            raycaster.setFromCamera(mouse, camera);\n            const hits = raycaster.intersectObjects(interactables, false);\n            renderer.domElement.style.cursor = hits.length > 0 ? 'pointer' : 'grab';\n        }\n\n        function onPointerUp(e) {\n            if (!camCtrl.dragMoved && camCtrl.button === 0) {\n                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;\n                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;\n                raycaster.setFromCamera(mouse, camera);\n                const hits = raycaster.intersectObjects(interactables, false);\n                if (hits.length > 0 && hits[0].object.userData.onClick) {\n                    hits[0].object.userData.onClick();\n                }\n            }\n            camCtrl.isDown = false;\n        }\n\n        function onMouseWheel(e) {\n            e.preventDefault();\n            camCtrl.desiredRadius = Math.max(6.5, Math.min(38.0, camCtrl.desiredRadius + e.deltaY * 0.012));\n        }\n\n        function onWindowResize() {\n            camera.aspect = window.innerWidth / window.innerHeight;\n            camera.updateProjectionMatrix();\n            renderer.setSize(window.innerWidth, window.innerHeight);\n        }\n\n        /***********************************************************************\n         * 11. MAIN ANIMATION LOOP (Started on window.onload)\n         ***********************************************************************/\n        let lastTime = performance.now();\n        let totalElapsed = 0;\n\n        function animate() {\n            requestAnimationFrame(animate);\n            const now = performance.now();\n            const dt = Math.min(0.05, (now - lastTime) / 1000);\n            lastTime = now;\n            totalElapsed += dt;\n\n            stepSimulationPhysics(dt);\n            update3DHardwareVisuals(dt, totalElapsed);\n            renderer.render(scene, camera);\n        }\n\n        window.onload = function () {\n            initThreeScene();\n            updateUIAndSchematic();\n            animate();\n        };\n    <\/script>\n<\/body>\n<\/html>"};
  var view=document.getElementById('view'),fr=null;
  function openView(k){
    closeView();
    fr=document.createElement('iframe');
    fr.setAttribute('allow','accelerometer; gyroscope; magnetometer; fullscreen');
    fr.srcdoc=PAGES[k];
    view.appendChild(fr);view.style.display='block';
  }
  function closeView(){
    if(fr){fr.remove();fr=null}
    view.style.display='none';
  }
  document.querySelectorAll('.navlink').forEach(function(b){b.addEventListener('click',function(){openView(b.dataset.view)})});
  document.getElementById('backBtn').addEventListener('click',closeView);
  addEventListener('keydown',function(e){if(e.key==='Escape')closeView()});
})();
</script>
