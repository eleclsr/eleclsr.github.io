<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ECU 자동 생산·검사 라인 — 3D 시뮬레이션</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<style>
  :root{
    --bg:#0e1116;
    --panel-bg: rgba(17,20,26,0.86);
    --panel-bg-soft: rgba(17,20,26,0.6);
    --panel-border:#2a3038;
    --text:#e7ebf1;
    --text-dim:#8b96a5;
    --accent:#ffb300;
    --blue:#5b9bff;
    --green:#35c47f;
    --purple:#b48af0;
    --red:#ff5f6d;
    --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
    --sans: 'Space Grotesk', system-ui, -apple-system, sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    box-sizing: border-box;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0e1116; --panel-bg: rgba(17,20,26,0.86); --text:#e7ebf1;
    }
  }
  :root[data-theme="dark"]{ --bg:#0e1116; --panel-bg: rgba(17,20,26,0.86); --text:#e7ebf1; }
  html,body{ height:100%; margin:0; background:var(--bg); overflow:hidden; }
  *{ box-sizing:border-box; }
  body{ font-family: var(--sans); color:var(--text); }
  #app{ position:fixed; inset:0; }
  canvas{ display:block; touch-action:none; }

  #loading{
    position:fixed; inset:0; background:var(--bg); z-index:50;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; transition:opacity .5s ease;
  }
  #loading .spin{
    width:42px; height:42px; border-radius:50%;
    border:3px solid #2a3038; border-top-color:var(--accent);
    animation:spin 0.9s linear infinite;
  }
  #loading .msg{ color:var(--text-dim); font-size:13px; letter-spacing:.02em; }
  @keyframes spin{ to{ transform:rotate(360deg);} }

  /* Top bar */
  #topbar{
    position:fixed; top:0; left:0; right:0; z-index:20;
    padding: calc(12px + env(safe-area-inset-top,0px)) 18px 12px;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    background:linear-gradient(to bottom, rgba(10,12,16,0.85), rgba(10,12,16,0));
    pointer-events:none;
  }
  #topbar .title-block{ pointer-events:auto; }
  #topbar h1{ font-size:16px; font-weight:600; margin:0; letter-spacing:.01em; }
  #topbar .sub{ font-size:11.5px; color:var(--text-dim); margin-top:2px; }
  #controls{ display:flex; gap:8px; pointer-events:auto; }
  .btn{
    background:var(--panel-bg); border:1px solid var(--panel-border); color:var(--text);
    font-family:var(--sans); font-size:12.5px; padding:8px 12px; border-radius:8px;
    cursor:pointer; display:flex; align-items:center; gap:6px; backdrop-filter: blur(6px);
    transition: border-color .15s, background .15s;
  }
  .navlinks{ display:flex; gap:8px; pointer-events:auto; flex-wrap:wrap; }
  .navlink{ background:var(--panel-bg); border:1px solid var(--accent); color:var(--text); cursor:pointer;
    font-family:var(--sans); font-size:13px; font-weight:600; padding:8px 14px; border-radius:8px;
    display:flex; align-items:center; gap:6px; backdrop-filter:blur(6px); transition:background .15s,color .15s; }
  .navlink:hover{ background:var(--accent); color:#111; }
  #view{ position:fixed; inset:0; z-index:100; background:#0e1116; display:none; }
  #view iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; }
  #backBtn{ position:absolute; z-index:2; left:50%; transform:translateX(-50%); top:calc(8px + env(safe-area-inset-top,0px));
    background:rgba(17,20,26,.92); color:#e7ebf1; border:1px solid var(--accent); border-radius:999px;
    font-family:var(--sans); font-size:13px; font-weight:700; padding:8px 16px; cursor:pointer; }
  #backBtn:hover{ background:var(--accent); color:#111; }
  .btn:hover{ border-color:var(--accent); }
  .btn.active{ border-color:var(--accent); color:var(--accent); }
  .btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  /* Left process panel */
  #processPanel{
    position:fixed; top:76px; left:14px; width:236px; max-height:min(58vh, 480px);
    background:var(--panel-bg); border:1px solid var(--panel-border); border-radius:12px;
    padding:10px; z-index:15; backdrop-filter: blur(8px); overflow-y:auto;
  }
  #processPanel h2{ font-size:11px; text-transform:none; color:var(--text-dim); margin:2px 6px 8px; font-weight:500; }
  .proc-item{
    display:flex; align-items:center; gap:10px; padding:8px 8px; border-radius:8px;
    cursor:pointer; border:1px solid transparent; margin-bottom:2px;
  }
  .proc-item:hover{ background:rgba(255,255,255,0.04); }
  .proc-item.active{ border-color:var(--accent); background:rgba(255,179,0,0.08); }
  .proc-num{
    width:22px; height:22px; border-radius:50%; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--mono); font-size:11px; font-weight:700; color:#0e1116;
  }
  .proc-name{ font-size:12.5px; line-height:1.3; }
  .dot-blue{ background:var(--blue); } .dot-green{ background:var(--green); }
  .dot-purple{ background:var(--purple); }

  /* Legend */
  #legend{
    position:fixed; left:14px; bottom:14px; z-index:15;
    background:var(--panel-bg); border:1px solid var(--panel-border); border-radius:10px;
    padding:9px 12px; display:flex; gap:12px; flex-wrap:wrap; backdrop-filter: blur(8px);
  }
  .legend-item{ display:flex; align-items:center; gap:6px; font-size:11px; color:var(--text-dim); }
  .swatch{ width:9px; height:9px; border-radius:3px; }

  /* HMI panel */
  #hmi{
    position:fixed; right:14px; bottom:14px; z-index:15; width:250px;
    background:var(--panel-bg); border:1px solid var(--panel-border); border-radius:12px;
    padding:12px 14px; backdrop-filter: blur(8px);
  }
  #hmi .hmi-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  #hmi .hmi-title{ font-size:11.5px; color:var(--text-dim); }
  #hmi .live{ display:flex; align-items:center; gap:5px; font-size:10px; color:var(--green); font-family:var(--mono); }
  #hmi .live .pip{ width:6px; height:6px; border-radius:50%; background:var(--green); animation:pulse 1.4s infinite; }
  @keyframes pulse{ 0%,100%{ opacity:1;} 50%{ opacity:.25;} }
  .hmi-grid{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  .hmi-cell{ background:rgba(255,255,255,0.03); border:1px solid var(--panel-border); border-radius:8px; padding:8px 6px; text-align:center; }
  .hmi-num{ font-family:var(--mono); font-size:18px; font-weight:700; }
  .hmi-label{ font-size:9.5px; color:var(--text-dim); margin-top:3px; }
  #hmi .rate{ margin-top:8px; font-size:10.5px; color:var(--text-dim); display:flex; justify-content:space-between; font-family:var(--mono); }

  /* Station labels (DOM, projected) */
  .station-label{
    position:fixed; transform:translate(-50%,-100%); z-index:8; pointer-events:none;
    display:flex; align-items:center; gap:6px; font-size:11px; white-space:nowrap;
    background:rgba(14,17,22,0.72); border:1px solid var(--panel-border); border-radius:7px;
    padding:3px 8px 3px 5px; backdrop-filter: blur(3px);
  }
  .station-label .num{
    font-family:var(--mono); font-size:9.5px; width:16px; height:16px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; color:#0e1116; font-weight:700;
  }

  /* Bottom info bar */
  #infoBar{
    position:fixed; left:50%; bottom:14px; transform:translateX(-50%) translateY(120%);
    max-width:min(640px, 82vw); z-index:16; background:var(--panel-bg); border:1px solid var(--panel-border);
    border-radius:12px; padding:12px 16px; backdrop-filter: blur(8px); transition:transform .35s ease;
    display:flex; gap:12px; align-items:flex-start;
  }
  #infoBar.show{ transform:translateX(-50%) translateY(0); }
  #infoBar .ib-badge{
    font-family:var(--mono); font-size:12px; font-weight:700; color:#0e1116;
    width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex:0 0 auto;
  }
  #infoBar .ib-name{ font-size:13px; font-weight:600; margin-bottom:2px; }
  #infoBar .ib-desc{ font-size:12px; color:var(--text-dim); line-height:1.5; }
  #infoBar .ib-close{ margin-left:auto; background:none; border:none; color:var(--text-dim); cursor:pointer; font-size:16px; line-height:1; padding:2px; }

  @media (max-width: 760px){
    #processPanel{ display:none; }
    #hmi{ width:auto; left:14px; right:14px; }
    .hmi-grid{ grid-template-columns:repeat(3,1fr); }
    #topbar h1{ font-size:14px; }
    #topbar .sub{ display:none; }
    .btn span.label{ display:none; }
  }
</style>
</head>
<body>

<div id="loading">
  <div class="spin"></div>
  <div class="msg" id="loadMsg">설비 초기화 중...</div>
</div>

<div id="topbar">
  <div class="title-block">
    <h1>PLC 기반 ECU 자동 생산·검사 라인</h1>
    <div class="sub">자동차 전장품(ECU) 조립·검사 공정 3D 시뮬레이션</div>
  </div>
  <nav class="navlinks">
    <button class="navlink" data-view="motor">⚙ 모터 3상태</button>
    <button class="navlink" data-view="interlock">🔒 인터록</button>
    <a class="navlink" href="./selfmaintain_html.html">⚡ 자기 유지 회로</a>

    <button class="btn" id="btnRotate" title="자동 회전">↻ <span class="label">자동회전</span></button>
    <button class="btn" id="btnReset" title="시점 초기화">⤢ <span class="label">시점 초기화</span></button>
  </div>

<div id="processPanel">
  <h2>공정 순서 (클릭하여 이동)</h2>
  <div id="procList"></div>
</div>

<div id="legend">
  <div class="legend-item"><span class="swatch dot-blue"></span>자재/공급 공정</div>
  <div class="legend-item"><span class="swatch dot-green"></span>조립/구동 공정</div>
  <div class="legend-item"><span class="swatch dot-purple"></span>검사 공정</div>
  <div class="legend-item"><span class="swatch" style="background:var(--red)"></span>불량품</div>
</div>

  <div class="hmi-head">
    <div class="hmi-title">생산라인 모니터링 · HMI</div>
    <div class="live"><span class="pip"></span>LIVE</div>
  </div>
  <div class="hmi-grid">
    <div class="hmi-cell"><div class="hmi-num" id="numTotal" style="color:var(--text)">0</div><div class="hmi-label">생산 수량</div></div>
    <div class="hmi-cell"><div class="hmi-num" id="numGood" style="color:var(--green)">0</div><div class="hmi-label">양품 수량</div></div>
    <div class="hmi-cell"><div class="hmi-num" id="numBad" style="color:var(--red)">0</div><div class="hmi-label">불량 수량</div></div>
  </div>
  <div class="rate"><span>양품률</span><span id="numRate">100.0%</span></div>
</div>

  <div>
    <div class="ib-name" id="ibName">공정명</div>
    <div class="ib-desc" id="ibDesc">설명</div>
  </div>
  <button class="ib-close" id="ibClose">✕</button>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ---------------------------------------------------------------
   설정값 / 색상
--------------------------------------------------------------- */
const COLOR = {
  blue: 0x5b9bff, green: 0x35c47f, purple: 0xb48af0, red: 0xff5f6d,
  accent: 0xffb300, steel: 0x8b93a0, steelDark: 0x4b525c, dark: 0x21252c,
  pcb: 0x1f6f4a, gold: 0xd9b25b, cream: 0xd8cdb8, floor: 0x1b1f26
};

const STATIONS = [
  { id:1, x:-24, z:0, name:'원자재 투입', color:'blue', desc:'커넥터, PCB, 하우징 등 원자재를 자동으로 라인에 투입합니다.' },
  { id:2, x:-18, z:0, name:'부품 공급 / 정렬', color:'blue', desc:'진동볼 피더가 소형 부품의 방향을 정렬해 순서대로 공급합니다.' },
  { id:3, x:-12, z:0, name:'PCB / 하우징 투입', color:'blue', desc:'컨베이어 이송으로 PCB와 하우징을 조립 라인 위에 투입합니다.' },
  { id:4, x:-6,  z:0, name:'부품 자동 조립', color:'green', desc:'로봇 암과 실린더가 부품을 픽앤플레이스 방식으로 자동 조립합니다.' },
  { id:5, x:0,   z:0, name:'체결 / 압입', color:'green', desc:'스크류 체결기와 압입기로 조립된 부품을 견고하게 고정합니다.' },
  { id:6, x:6,   z:0, name:'전기적 검사', color:'purple', desc:'테스터로 전압·저항 등 전기적 특성을 측정해 불량을 판별합니다.' },
  { id:7, x:12,  z:0, name:'외관 검사', color:'purple', desc:'비전 카메라로 스크래치·조립 불량 등 외관 상태를 검사합니다.' },
  { id:8, x:18,  z:0, name:'양품 / 불량 분류', color:'green', desc:'검사 결과에 따라 분류 컨베이어가 양품과 불량품을 자동으로 분리합니다.' },
  { id:9, x:24,  z:0, name:'완제품 배출', color:'green', desc:'양품을 포장 박스에 담아 완제품으로 배출합니다.' },
];
const COLOR_HEX = { blue:'#5b9bff', green:'#35c47f', purple:'#b48af0' };
const LINE_Y = 1.05;          // 컨베이어 상판 높이
const SPAWN_X = -30;
const SORT_X = 18;
const PACK_X = 24;
const SPEED = 3.6;

/* ---------------------------------------------------------------
   기본 씬 셋업
--------------------------------------------------------------- */
const app = document.getElementById('app');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x11151b);
scene.fog = new THREE.Fog(0x11151b, 46, 130);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 400);
const DEFAULT_CAM_POS = new THREE.Vector3(6, 24, 46);
const DEFAULT_TARGET = new THREE.Vector3(0, 3, 0);
camera.position.copy(DEFAULT_CAM_POS);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
if ('outputColorSpace' in renderer) renderer.outputColorSpace = THREE.SRGBColorSpace;
app.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(DEFAULT_TARGET);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 8;
controls.maxDistance = 90;
controls.maxPolarAngle = Math.PI * 0.49;
controls.update();

/* ---------------------------------------------------------------
   조명
--------------------------------------------------------------- */
scene.add(new THREE.HemisphereLight(0xcfe0ff, 0x14161a, 0.75));

const sun = new THREE.DirectionalLight(0xfff3dd, 1.15);
sun.position.set(-20, 40, 22);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -50; sun.shadow.camera.right = 50;
sun.shadow.camera.top = 40; sun.shadow.camera.bottom = -40;
sun.shadow.camera.far = 120;
sun.shadow.bias = -0.0015;
scene.add(sun);

const fillLight = new THREE.DirectionalLight(0x8fb3ff, 0.25);
fillLight.position.set(20, 15, -20);
scene.add(fillLight);

// 천장 조명 (공정 라인 위)
const ceilingLights = [];
[-20, -4, 12, 26].forEach(x=>{
  const pl = new THREE.PointLight(0xfff0d0, 30, 34, 2);
  pl.position.set(x, 13, 0);
  scene.add(pl);
  ceilingLights.push(pl);
  const fixGeo = new THREE.CylinderGeometry(1.1, 1.1, 0.25, 20);
  const fixMat = new THREE.MeshStandardMaterial({ color:0xf5f2e8, emissive:0xfff2c8, emissiveIntensity:0.9, roughness:0.5 });
  const fix = new THREE.Mesh(fixGeo, fixMat);
  fix.position.set(x, 12.85, 0);
  scene.add(fix);
});

/* ---------------------------------------------------------------
   텍스처 유틸 (캔버스 절차적 생성)
--------------------------------------------------------------- */
function stripeTexture({w=64,h=64, base='#2b2f36', stripe='#20232a', angle=true}={}){
  const c = document.createElement('canvas'); c.width=w; c.height=h;
  const ctx = c.getContext('2d');
  ctx.fillStyle = base; ctx.fillRect(0,0,w,h);
  ctx.strokeStyle = stripe; ctx.lineWidth = w*0.16;
  for(let i=-h;i<w+h;i+=w*0.22){
    ctx.beginPath();
    if(angle){ ctx.moveTo(i,h); ctx.lineTo(i+h,0); } else { ctx.moveTo(i,0); ctx.lineTo(i,h); }
    ctx.stroke();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  return tex;
}
function hazardTexture(){
  const c = document.createElement('canvas'); c.width=64; c.height=16;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#151719'; ctx.fillRect(0,0,64,16);
  ctx.fillStyle = '#ffb300';
  ctx.save(); ctx.translate(0,0);
  for(let i=-16;i<80;i+=16){
    ctx.beginPath();
    ctx.moveTo(i,16); ctx.lineTo(i+8,0); ctx.lineTo(i+16,0); ctx.lineTo(i+8,16);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
  return tex;
}
function floorTexture(){
  const c = document.createElement('canvas'); c.width=256; c.height=256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#1a1e24'; ctx.fillRect(0,0,256,256);
  ctx.strokeStyle = 'rgba(255,255,255,0.045)'; ctx.lineWidth = 2;
  for(let i=0;i<=256;i+=32){ ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,256); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(256,i); ctx.stroke(); }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(24, 12);
  return tex;
}
const beltTex = stripeTexture({ base:'#2c3038', stripe:'#20242b' });
beltTex.repeat.set(1, 6);

function makeCanvasScreen(w, h, drawFn){
  const c = document.createElement('canvas'); c.width=w; c.height=h;
  const ctx = c.getContext('2d');
  drawFn(ctx, w, h);
  const tex = new THREE.CanvasTexture(c);
  return { canvas:c, ctx, tex };
}

/* ---------------------------------------------------------------
   바닥 / 라인 베이스
--------------------------------------------------------------- */
const floorMat = new THREE.MeshStandardMaterial({ map: floorTexture(), roughness:0.92, metalness:0.05 });
const floor = new THREE.Mesh(new THREE.PlaneGeometry(160, 80), floorMat);
floor.rotation.x = -Math.PI/2;
floor.receiveShadow = true;
scene.add(floor);

// 안전선(해저드 스트라이프) - 라인 양옆
const hazMat = new THREE.MeshBasicMaterial({ map: hazardTexture() });
[ -3.6, 3.6 ].forEach(z=>{
  const tex = hazardTexture(); tex.repeat.set(30,1);
  const m = new THREE.MeshBasicMaterial({ map: tex });
  const strip = new THREE.Mesh(new THREE.PlaneGeometry(62, 0.4), m);
  strip.rotation.x = -Math.PI/2; strip.position.set(0, 0.01, z);
  scene.add(strip);
});

/* ---------------------------------------------------------------
   컨베이어 라인 (전체 관통)
--------------------------------------------------------------- */
const conveyorGroup = new THREE.Group();
scene.add(conveyorGroup);

function buildConveyor(xStart, xEnd, z=0, width=2.4){
  const len = xEnd - xStart;
  const cx = (xStart+xEnd)/2;
  const grp = new THREE.Group();
  // 프레임
  const frameMat = new THREE.MeshStandardMaterial({ color: COLOR.steelDark, metalness:0.6, roughness:0.45 });
  const frame = new THREE.Mesh(new THREE.BoxGeometry(len, 0.5, width), frameMat);
  frame.position.set(cx, LINE_Y-0.35, z);
  frame.castShadow = true; frame.receiveShadow = true;
  grp.add(frame);
  // 벨트 상판
  const beltMat = new THREE.MeshStandardMaterial({ map: beltTex.clone(), color: 0xffffff, roughness:0.8, metalness:0.15 });
  beltMat.map.repeat.set(len/2.2, 1);
  const belt = new THREE.Mesh(new THREE.BoxGeometry(len, 0.08, width-0.15), beltMat);
  belt.position.set(cx, LINE_Y, z);
  belt.receiveShadow = true;
  grp.add(belt);
  grp.userData.beltMat = beltMat;
  // 사이드 레일
  const railMat = new THREE.MeshStandardMaterial({ color: COLOR.steel, metalness:0.7, roughness:0.35 });
  [width/2-0.05, -width/2+0.05].forEach(zz=>{
    const rail = new THREE.Mesh(new THREE.BoxGeometry(len, 0.14, 0.08), railMat);
    rail.position.set(cx, LINE_Y+0.11, z+zz);
    grp.add(rail);
  });
  // 롤러 (일정 간격)
  const rollerMat = new THREE.MeshStandardMaterial({ color: 0x2a2d33, metalness:0.8, roughness:0.3 });
  const rollers = [];
  for(let x=xStart+1; x<=xEnd-1; x+=1.6){
    const roller = new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.16,width-0.2,14), rollerMat);
    roller.rotation.x = Math.PI/2;
    roller.position.set(x, LINE_Y-0.42, z);
    grp.add(roller);
    rollers.push(roller);
  }
  grp.userData.rollers = rollers;
  // 다리
  const legMat = new THREE.MeshStandardMaterial({ color: COLOR.dark, metalness:0.5, roughness:0.55 });
  for(let x=xStart+1.2; x<=xEnd-1.2; x+=6){
    [width/2-0.15, -width/2+0.15].forEach(zz=>{
      const leg = new THREE.Mesh(new THREE.BoxGeometry(0.18, LINE_Y-0.42, 0.18), legMat);
      leg.position.set(x, (LINE_Y-0.42)/2, z+zz);
      leg.castShadow = true;
      grp.add(leg);
    });
  }
  return grp;
}

const mainConveyor = buildConveyor(SPAWN_X-2, PACK_X+6, 0);
conveyorGroup.add(mainConveyor);

// 불량 분류용 측면 컨베이어 (station8 옆, -z 방향)

// --- Station 6: 전기적 검사 (테스터 + 프로브 + 스크린) ---
function buildStation6(x){
  const g = new THREE.Group();
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0x2b2f37, metalness:0.5, roughness:0.4 });
  const body = new THREE.Mesh(new THREE.BoxGeometry(1.1,1.4,0.9), bodyMat);
  body.position.set(0,0.7,-0.9); body.castShadow = true;
  g.add(body);

  const screenData = makeCanvasScreen(128,96,(ctx,w,h)=>{
    ctx.fillStyle = '#08120c'; ctx.fillRect(0,0,w,h);
  });
  const screenMat = new THREE.MeshStandardMaterial({ map: screenData.tex, emissive: 0x113322, emissiveIntensity:0.6, roughness:0.4 });
  const screen = new THREE.Mesh(new THREE.PlaneGeometry(0.7,0.5), screenMat);
  screen.position.set(0,1.05,-0.44);
  g.add(screen);

  const armMat = new THREE.MeshStandardMaterial({ color: COLOR.steel, metalness:0.6, roughness:0.3 });
  const probeArm = new THREE.Mesh(new THREE.BoxGeometry(0.1,0.6,0.1), armMat);
  probeArm.position.set(0,1.55,0);
  g.add(probeArm);
  const probeHead = new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.12,0.14,12), new THREE.MeshStandardMaterial({color:COLOR.purple, metalness:0.4, roughness:0.4}));
  probeHead.position.set(0,1.2,0);
  g.add(probeHead);
  const pinMat = new THREE.MeshStandardMaterial({ color:0xd9b25b, metalness:0.8, roughness:0.25 });
  const pins = [];
  for(let i=0;i<3;i++){
    const pin = new THREE.Mesh(new THREE.CylinderGeometry(0.015,0.015,0.18,6), pinMat);
    pin.position.set(-0.1+i*0.1, 1.05, 0);
    g.add(pin); pins.push(pin);
  }

  g.position.set(x,0,1.0);
  scene.add(g);

  let flick = 0;
  return {
    update(t, dt){
      const s = Math.max(0, Math.sin(t*3.0));
      probeArm.position.y = 1.55 - s*0.32; probeHead.position.y = 1.2-s*0.32;
      pins.forEach(p=>{ p.position.y = 1.05 - s*0.32; });
      flick += dt;
      if(flick > 0.4){
        flick = 0;
        const ctx = screenData.ctx;
        ctx.fillStyle = '#08120c'; ctx.fillRect(0,0,128,96);
        ctx.strokeStyle = '#4be08a'; ctx.lineWidth = 2; ctx.beginPath();
        for(let px=0; px<128; px++){
          const py = 48 + Math.sin(px*0.35 + t*6)*18*Math.exp(-Math.abs(px-64)/70) + (Math.random()-0.5)*4;
          if(px===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
        }
        ctx.stroke();
        screenData.tex.needsUpdate = true;
      }
    }
  };
}

function buildStation9(x){
  const g = new THREE.Group();
  const boxMat = new THREE.MeshStandardMaterial({ color: 0xb98a4e, roughness:0.85 });
  const tapeMat = new THREE.MeshStandardMaterial({ color: 0x6b4a26, roughness:0.7 });
  const stack = [];
  let bx = 1.6;
  for(let row=0; row<2; row++){
    for(let col=0; col<2; col++){
      const box = new THREE.Mesh(new THREE.BoxGeometry(0.6,0.45,0.6), boxMat);
      box.position.set(bx+col*0.05, 0.225+row*0.46, -0.6+col*0.7);

}

function buildControlCabinet(){
  const g = new THREE.Group();
  const cabMat = new THREE.MeshStandardMaterial({ color: 0x2c313a, metalness:0.5, roughness:0.4 });
  const cab = new THREE.Mesh(new THREE.BoxGeometry(1.1,2.0,0.5), cabMat);
  cab.position.y = 1.0; cab.castShadow = true;
  g.add(cab);
  const doorLineMat = new THREE.MeshStandardMaterial({ color: 0x1c1f24, metalness:0.5, roughness:0.5 });
  const line = new THREE.Mesh(new THREE.BoxGeometry(0.02,1.9,0.02), doorLineMat);
  line.position.set(0,1.0,0.26);
  g.add(line);
  const leds = [];
  const ledColors = [0x35c47f, 0xffb300, 0x5b9bff];
  for(let i=0;i<3;i++){
    const led = new THREE.Mesh(new THREE.SphereGeometry(0.035,8,8), new THREE.MeshStandardMaterial({ color: ledColors[i], emissive: ledColors[i], emissiveIntensity:1 }));
    led.position.set(-0.4+i*0.12, 1.75, 0.26);
    g.add(led); leds.push(led);
  }
  const labelData = makeCanvasScreen(96,48,(ctx,w,h)=>{
    ctx.fillStyle = '#e9e6da'; ctx.fillRect(0,0,w,h);
    ctx.fillStyle = '#1c1f24'; ctx.font='bold 16px sans-serif'; ctx.textAlign='center';
    ctx.fillText('PLC', w/2, h/2+6);
  });
  const plate = new THREE.Mesh(new THREE.PlaneGeometry(0.4,0.2), new THREE.MeshStandardMaterial({ map: labelData.tex }));
  plate.position.set(0,1.3,0.26);
  g.add(plate);
  g.position.set(SPAWN_X-1, 0, -3.6);
  scene.add(g);
  return { leds };
}
const plcCabinet = buildControlCabinet();

function buildHMIStand(counts){
  const g = new THREE.Group();
  const poleMat = new THREE.MeshStandardMaterial({ color: 0x2c313a, metalness:0.55, roughness:0.4 });
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.1,1.3,10), poleMat);
  pole.position.y = 0.65;
  g.add(pole);
  const screenData = makeCanvasScreen(256,180, ()=>{});
  function draw(){
    const ctx = screenData.ctx;
    ctx.fillStyle = '#0d1a14'; ctx.fillRect(0,0,256,180);
    ctx.fillStyle = '#8fe6b8'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign='left';
    ctx.fillText('생산라인 모니터링', 12, 24);
    ctx.font = '11px sans-serif'; ctx.fillStyle='#5fb894';
    ctx.fillText(new Date().toLocaleDateString('ko-KR'), 12, 40);
    const rows = [ ['생산 수량', counts.total, '#e8ebef'], ['양품 수량', counts.good, '#35c47f'], ['불량 수량', counts.bad, '#ff5f6d'] ];
    rows.forEach((r,i)=>{
      ctx.fillStyle = '#7d8a95'; ctx.font='11px sans-serif'; ctx.fillText(r[0], 12, 70+i*34);
      ctx.fillStyle = r[2]; ctx.font='bold 22px sans-serif'; ctx.fillText(String(r[1]).padStart(4,'0'), 12, 92+i*34);
    });
    screenData.tex.needsUpdate = true;
  }
  draw();
  const screenMat = new THREE.MeshStandardMaterial({ map: screenData.tex, emissive:0x0d1a14, emissiveIntensity:0.5, roughness:0.4 });
  const screen = new THREE.Mesh(new THREE.PlaneGeometry(0.95,0.68), screenMat);
  screen.position.set(0,1.5,0.03);
  g.add(screen);
  const bezel = new THREE.Mesh(new THREE.BoxGeometry(1.05,0.78,0.05), new THREE.MeshStandardMaterial({color:0x1c1f24, metalness:0.4, roughness:0.5}));
  bezel.position.set(0,1.5,0);
  g.add(bezel);
  const base = new THREE.Mesh(new THREE.CylinderGeometry(0.35,0.4,0.1,20), poleMat);
  base.position.y = 0.05;
  g.add(base);
  g.position.set(SPAWN_X+0.6, 0, -3.4);
  g.rotation.y = 0.5;
  scene.add(g);
  return { draw };
}

  domNumTotal.textContent = counts.total;

/* ---------------------------------------------------------------
   제품 흐름 관리
--------------------------------------------------------------- */
const products = [];
let spawnTimer = 0;
let running = true;

function spawnProduct(){
  const mesh = createProduct();
  mesh.position.set(SPAWN_X, LINE_Y+0.08, 0);
  scene.add(mesh);
  products.push({ mesh, state:'conveying', good:true, sorted:false, boxTime:0 });
}

function updateProducts(dt, elapsed){
  for(let i=products.length-1; i>=0; i--){
    const p = products[i];
    if(p.state === 'conveying'){
      p.mesh.position.x += SPEED*dt;
      p.mesh.rotation.y = Math.sin(elapsed*0.6+i)*0.02;
      if(!p.sorted && p.mesh.position.x >= SORT_X){
        p.sorted = true;
        p.good = Math.random() < 0.9;
        if(!p.good){ p.state = 'diverting'; st8.flashBin(); }
      }
      if(p.state === 'conveying' && p.mesh.position.x >= PACK_X){
        p.state = 'boxing';
        p.boxTime = elapsed;
      }
    } else if(p.state === 'diverting'){
      p.mesh.position.x += SPEED*0.55*dt;
      p.mesh.position.z += (-3.3 - p.mesh.position.z)*0.06;
      p.mesh.rotation.z += dt*2;
      if(p.mesh.position.z < -3.0){
        scene.remove(p.mesh);
        products.splice(i,1);
        counts.total++; counts.bad++;
        refreshHMI();
      }
    } else if(p.state === 'boxing'){
      const t = elapsed - p.boxTime;
      p.mesh.position.x += SPEED*0.35*dt;
      const s = Math.max(0.001, 1 - t/0.7);
      p.mesh.scale.setScalar(s);
      p.mesh.position.y = LINE_Y+0.08 - (1-s)*0.15;
      if(t > 0.7){
        scene.remove(p.mesh);
        products.splice(i,1);
        counts.total++; counts.good++;
        refreshHMI();
      }
    }
  }
}

function updateLabels(){
  const vw = window.innerWidth, vh = window.innerHeight;
  STATIONS.forEach((s,i)=>{
    const v = new THREE.Vector3(s.x, 6.6, 0);

    const el = labelEls[i];
    if(v.z > 1){ el.style.display='none'; return; }
    el.style.display='flex';
    el.style.left = ((v.x*0.5+0.5)*vw) + 'px';

}

/* ---------------------------------------------------------------
   메인 루프
--------------------------------------------------------------- */
const clock = new THREE.Clock();
let elapsed = 0;

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  if(running) elapsed += dt;

  // 컨베이어 벨트 텍스처 이동 + 롤러 회전
  [mainConveyor, rejectConveyor].forEach(c=>{
    if(running){
      c.userData.beltMat.map.offset.y += dt*0.6;
      c.userData.rollers.forEach(r=> r.rotation.z += dt*3);
    }
  });

  if(running){
    spawnTimer += dt;
    if(spawnTimer > 1.8 && products.length < 8){
      spawnTimer = 0;
      spawnProduct();
    }
    updateProducts(dt, elapsed);
  }

  // 스테이션 애니메이션
  st1.update(elapsed);
  st2.update(elapsed);
  st3.update(elapsed);
  st4.update(elapsed);
  st5.update(elapsed);
  st6.update(elapsed, dt);
  const nearVision = products.some(p=> Math.abs(p.mesh.position.x - STATIONS[6].x) < 0.6);
  st7.update(elapsed, dt, nearVision);
  const diverting = products.some(p=> p.state==='diverting');
  st8.update(elapsed, diverting);
  st9.update(elapsed);

  plcCabinet.leds.forEach((led,i)=>{
    led.material.emissiveIntensity = 0.6 + Math.sin(elapsed*3 + i*1.7)*0.4;
  });

  controls.update();
  updateLabels();
  if(camTween){
    camTween.t += dt/camTween.dur;
    const k = Math.min(1, camTween.t);
    const ek = 1 - Math.pow(1-k, 3);
    camera.position.lerpVectors(camTween.from.pos, camTween.to.pos, ek);
    controls.target.lerpVectors(camTween.from.target, camTween.to.target, ek);
    if(k>=1) camTween = null;
  }

  renderer.render(scene, camera);
}

for(let i=0;i<3;i++){

}

" stroke=\"#1e88e5\" stroke-width=\"2\"/>\n              <\/g>\n            <\/svg>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <\!-- ================= RIGHT FLOATING CONSOLE: SKEUOMORPHIC CONTROL STATION & DIAGNOSTICS ================= -->\n    <div id=\"rightCol\" class=\"lg:w-[320px] lg:absolute lg:right-3 lg:top-3 lg:bottom-3 z-20 flex flex-col gap-2.5 overflow-y-auto p-2.5 lg:p-0 max-h-[45vh] lg:max-h-none\">\n\n      <\!-- TWIN OPERATION PANEL -->\n      <div id=\"rightTwinContent\" class=\"flex flex-col gap-2.5\">\n\n        <\!-- Industrial Local Control Box (현장 조작반) -->\n        <div class=\"hmi-card\">\n          <div class=\"hmi-header-strip\">\n            <div class=\"flex items-center gap-2\">\n              <span class=\"rivet\"><\/span>\n              <h2 class=\"text-xs font-extrabold tracking-wide text-slate-200 uppercase\">\n                <i class=\"fa-solid fa-gamepad text-emerald-400 mr-1\"><\/i> 현장 조작반 (LOCAL OP BOX)\n              <\/h2>\n            <\/div>\n            <\!-- Pilot Lamps Indicator Row -->\n            <div class=\"flex items-center gap-2 bg-black/50 px-2 py-1 rounded border border-slate-700\">\n              <div class=\"flex items-center gap-1\" title=\"적색 운전램프 (RL)\">\n                <span id=\"lampRL\" class=\"pilot-lamp pilot-rl-off\"><\/span>\n                <span class=\"text-[9px] font-mono text-slate-400\">RL<\/span>\n              <\/div>\n              <div class=\"flex items-center gap-1\" title=\"녹색 정지램프 (GL)\">\n                <span id=\"lampGL\" class=\"pilot-lamp pilot-gl-on\"><\/span>\n                <span class=\"text-[9px] font-mono text-slate-400\">GL<\/span>\n              <\/div>\n              <div class=\"flex items-center gap-1\" title=\"황색 고장/트립램프 (YL)\">\n                <span id=\"lampYL\" class=\"pilot-lamp pilot-yl-off\"><\/span>\n                <span class=\"text-[9px] font-mono text-slate-400\">YL<\/span>\n              <\/div>\n            <\/div>\n          <\/div>\n\n          <div class=\"p-3.5 space-y-2.5\">\n            <\!-- PB-F Forward Button -->\n            <div class=\"ind-pb-bezel\">\n              <button id=\"bF\" class=\"w-full py-2.5 px-3.5 rounded-lg ind-pb-green text-white font-black text-xs sm:text-sm flex items-center justify-between\">\n                <span class=\"flex items-center gap-2\">\n                  <i class=\"fa-solid fa-rotate-right text-base\"><\/i>\n                  <span>정회전 기동 (PB-F)<\/span>\n                <\/span>\n                <span class=\"text-[10px] font-mono bg-black/40 px-2 py-0.5 rounded border border-white/20\">MC1 ON<\/span>\n              <\/button>\n            <\/div>\n\n            <\!-- PB-R Reverse Button -->\n            <div class=\"ind-pb-bezel\">\n              <button id=\"bR\" class=\"w-full py-2.5 px-3.5 rounded-lg ind-pb-red text-white font-black text-xs sm:text-sm flex items-center justify-between\">\n                <span class=\"flex items-center gap-2\">\n                  <i class=\"fa-solid fa-rotate-left text-base\"><\/i>\n                  <span>역회전 기동 (PB-R)<\/span>\n                <\/span>\n                <span class=\"text-[10px] font-mono bg-black/40 px-2 py-0.5 rounded border border-white/20\">MC2 ON<\/span>\n              <\/button>\n            <\/div>\n\n            <\!-- PB-S Emergency Stop Mushroom Button -->\n            <div class=\"ind-pb-bezel\">\n              <button id=\"bS\" class=\"w-full py-2 px-3.5 rounded-lg ind-pb-estop text-slate-950 font-black text-xs sm:text-sm flex items-center justify-between\">\n                <span class=\"flex items-center gap-2\">\n                  <i class=\"fa-solid fa-circle-stop text-red-700 text-base\"><\/i>\n                  <span>비상정지 / 정지 (PB-S)<\/span>\n                <\/span>\n                <span class=\"text-[10px] font-mono bg-black/25 text-white px-2 py-0.5 rounded\">OFF<\/span>\n              <\/button>\n            <\/div>\n          <\/div>\n        <\/div>\n\n        <\!-- PLC / Relay Status Diagnostic Matrix -->\n        <div class=\"hmi-card\">\n          <div class=\"hmi-header-strip\">\n            <div class=\"flex items-center gap-2\">\n              <span class=\"rivet\"><\/span>\n              <h2 class=\"text-xs font-extrabold tracking-wide text-slate-200 uppercase\">\n                <i class=\"fa-solid fa-server text-sky-400 mr-1\"><\/i> 접점 및 시퀀스 상태 모니터\n              <\/h2>\n            <\/div>\n          <\/div>\n          <div class=\"p-3\">\n            <div class=\"grid grid-cols-2 gap-1.5 text-xs font-mono\">\n              <div class=\"bg-[#080c12] p-2 rounded border border-slate-800\">\n                <span class=\"text-[10px] text-slate-400 block font-sans\">MC1 (정회전 접촉기)<\/span>\n                <span id=\"sM1\" class=\"font-bold text-slate-400\">소자 (OFF)<\/span>\n              <\/div>\n              <div class=\"bg-[#080c12] p-2 rounded border border-slate-800\">\n                <span class=\"text-[10px] text-slate-400 block font-sans\">MC2 (역회전 접촉기)<\/span>\n                <span id=\"sM2\" class=\"font-bold text-slate-400\">소자 (OFF)<\/span>\n              <\/div>\n              <div class=\"bg-[#080c12] p-2 rounded border border-slate-800\">\n                <span class=\"text-[10px] text-slate-400 block font-sans\">상호 인터록 (b접점)<\/span>\n                <span id=\"sIlkState\" class=\"font-bold text-emerald-400\">양쪽 닫힘(NC)<\/span>\n              <\/div>\n              <div class=\"bg-[#080c12] p-2 rounded border border-slate-800\">\n                <span class=\"text-[10px] text-slate-400 block font-sans\">배선용 차단기(MCCB)<\/span>\n                <span id=\"sBrk\" class=\"font-bold text-emerald-400\">정상 투입(ON)<\/span>\n              <\/div>\n              <div class=\"col-span-2 bg-[#080c12] p-2 rounded border border-slate-800 flex items-center justify-between\">\n                <span class=\"text-[11px] text-slate-400 font-sans\">유도전동기 회전상태:<\/span>\n                <span id=\"sMot\" class=\"font-bold text-slate-400 text-xs\">정지 (0 RPM)<\/span>\n              <\/div>\n            <\/div>\n\n            <div id=\"msg\" role=\"status\" aria-live=\"polite\" class=\"mt-2.5 p-2.5 rounded bg-[#05080c] border-l-4 border-sky-500 text-xs text-slate-300 leading-relaxed min-h-[52px]\">\n              현장 조작반 또는 3D 캐비닛 도어의 푸시버튼을 눌러 정·역회전 및 인터록 동작을 확인하세요.\n            <\/div>\n          <\/div>\n        <\/div>\n\n        <\!-- Emergency Short-Circuit Alert Box -->\n        <div id=\"alertBox\" class=\"hmi-card border-2 border-red-500 bg-red-950/90 hidden\">\n          <div class=\"p-3.5\">\n            <div class=\"font-black text-sm text-red-300 flex items-center gap-1.5 mb-1\">\n              <i class=\"fa-solid fa-bolt-lightning text-yellow-400 animate-bounce\"><\/i> ⚠ R-T 상간 단락(Short-Circuit) 폭발!\n            <\/div>\n            <p class=\"text-xs text-red-100 leading-relaxed\">\n              인터록(b접점)이 누락된 상태에서 MC1과 MC2가 동시에 투입되어 <b>전원 R상과 T상이 직결 단락<\/b>되었고, 대전류 아크가 발생하며 MCCB 차단기가 즉시 트립(TRIP)되었습니다!\n            <\/p>\n            <div class=\"mt-2 p-2 rounded bg-black/50 text-[11px] text-amber-300 font-mono\">\n              복구절차: 주전원 차단 → 상대 MC b접점(5-11번) 직렬 결선 → 절연저항 측정 후 [차단기 복귀] 클릭\n            <\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <\!-- WIRING MODE RIGHT CONTENT (결선 목록 & 결선 검사) -->\n      <div id=\"rightWireContent\" class=\"hidden flex-col gap-2.5\">\n        <div class=\"hmi-card\">\n          <div class=\"hmi-header-strip\">\n            <div class=\"flex items-center gap-2\">\n              <span class=\"rivet\"><\/span>\n              <h2 class=\"text-xs font-extrabold text-sky-400\">포설 전선 리스트 (<span id=\"wireCountUI\">0<\/span>/23)<\/h2>\n            <\/div>\n            <span class=\"text-[11px] text-slate-400 font-mono\">검사: <b id=\"wireAttemptUI\" class=\"text-white\">0<\/b>회<\/span>\n          <\/div>\n          <div class=\"p-3\">\n            <div class=\"flex gap-1.5 mb-2.5\">\n              <button id=\"btnWireUndo\" class=\"flex-1 py-1.5 rounded bg-slate-800 hover:bg-slate-700 border border-slate-600 text-xs font-bold\">\n                <i class=\"fa-solid fa-rotate-left mr-1\"><\/i>되돌리기\n              <\/button>\n              <button id=\"btnWireClear\" class=\"flex-1 py-1.5 rounded bg-red-950/70 hover:bg-red-900 border border-red-700/60 text-xs font-bold text-red-200\">\n                <i class=\"fa-solid fa-trash-can mr-1\"><\/i>전체 철거\n              <\/button>\n            <\/div>\n            <ul id=\"wireListUI\" class=\"max-h-48 overflow-y-auto space-y-1 text-xs pr-1\"><\/ul>\n\n            <button id=\"btnCheckWiring\" class=\"w-full mt-3 py-3 rounded-lg bg-gradient-to-r from-blue-600 to-sky-500 hover:opacity-95 text-white font-black text-sm shadow-lg shadow-blue-600/30 transition\">\n              <i class=\"fa-solid fa-clipboard-check mr-1.5\"><\/i>벨테스터 도통 & 결선 검사\n            <\/button>\n\n            <div id=\"wireInspectResult\" class=\"mt-2.5 p-2.5 rounded bg-[#05080c] border border-slate-800 text-xs text-slate-300 leading-relaxed max-h-48 overflow-y-auto\">\n              3D 단자 나사를 클릭해 전선을 연결한 뒤 [결선 검사]를 누르세요. (전선 우클릭 시 개별 삭제)\n            <\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <div class=\"hmi-card p-2.5 text-[11px] text-slate-400 flex items-center gap-2\">\n        <i class=\"fa-solid fa-helmet-safety text-amber-400 text-sm\"><\/i>\n        <span>실제 전기 작업 시에는 반드시 LOTO(잠금·표지) 및 검전기로 무전압을 확인 후 작업하십시오.<\/span>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <\!-- ================= MODAL 1: THEORY MANUAL & CRAFTSMAN ELECTRICAL PINOUT GUIDE ================= -->\n  <div id=\"modalTheory\" class=\"fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-3 sm:p-6 hidden\">\n    <div class=\"hmi-card w-full max-w-4xl max-h-[90vh] flex flex-col border-amber-500/60 overflow-hidden\">\n      <div class=\"hmi-header-strip py-3 px-4\">\n        <div class=\"flex items-center gap-2.5\">\n          <i class=\"fa-solid fa-book-open-reader text-amber-400 text-lg\"><\/i>\n          <div>\n            <h3 class=\"font-bold text-base text-white\">전기기능사 실기 대비 · 정·역회전 인터록 이론설명서 및 12핀 핀맵<\/h3>\n            <p class=\"text-[11px] text-slate-400\">3상 회전자계 원리 · R↔T 상교체 · 상대 b접점 인터록 · LS Metasol MC/EOCR 표준 핀 번호<\/p>\n          <\/div>\n        <\/div>\n        <button id=\"btnCloseTheory\" class=\"w-8 h-8 rounded bg-slate-800 hover:bg-slate-700 text-white\">\n          <i class=\"fa-solid fa-xmark\"><\/i>\n        <\/button>\n      <\/div>\n\n      <div class=\"p-5 overflow-y-auto space-y-5 text-xs sm:text-sm leading-relaxed\">\n        <div class=\"grid grid-cols-1 md:grid-cols-2 gap-4\">\n          <div class=\"bg-[#0c121b] p-4 rounded-xl border border-slate-700\">\n            <h4 class=\"font-bold text-sky-400 text-sm mb-2 flex items-center gap-1.5\">\n              <i class=\"fa-solid fa-arrows-spin\"><\/i> 1. 3상 유도전동기 회전 원리와 2상 교체(R↔T)\n            <\/h4>\n            <p class=\"text-slate-300\">\n              3상 교류 전원(R·S·T)이 120° 위상차로 고정자 권선에 흐르면 동기속도 $N_s = \\frac{120f}{P}$로 회전하는 <b class=\"text-white\">회전자계<\/b>가 형성됩니다.\n            <\/p>\n            <div class=\"mt-2.5 p-2.5 rounded-lg bg-[#131d2b] border border-sky-500/30 text-xs space-y-1\">\n              <div>✔ <b class=\"text-emerald-400\">정회전(CW) 상순:<\/b> (U, V, W) = <span class=\"font-mono text-white\">R - S - T<\/span><\/div>\n              <div>✔ <b class=\"text-rose-400\">역회전(CCW) 상순 (2상 교체):<\/b> <span class=\"font-mono text-amber-300\">T - S - R<\/span> (R↔T 교차), <span class=\"font-mono\">S-R-T<\/span>, <span class=\"font-mono\">R-T-S<\/span><\/div>\n              <div>❌ <b class=\"text-red-400\">주의 (3상 모두 순환 시):<\/b> <span class=\"font-mono\">S-T-R<\/span> 또는 <span class=\"font-mono\">T-R-S<\/span>는 회전 방향이 바뀌지 않고 <b>정회전<\/b>합니다!<\/div>\n            <\/div>\n          <\/div>\n\n          <div class=\"bg-[#0c121b] p-4 rounded-xl border border-slate-700\">\n            <h4 class=\"font-bold text-rose-400 text-sm mb-2 flex items-center gap-1.5\">\n              <i class=\"fa-solid fa-lock\"><\/i> 2. 상호쇄정(Interlock) 회로 설계 원리\n            <\/h4>\n            <p class=\"text-slate-300\">\n              정회전(MC1)과 역회전(MC2) 주접점이 동시에 닫히면 주회로에서 교차된 <b class=\"text-red-300\">R상과 T상이 직접 충돌하여 단락(Short) 사고<\/b>가 일어납니다.\n            <\/p>\n            <div class=\"mt-2.5 p-2.5 rounded-lg bg-[#261216] border border-red-500/40 text-xs space-y-1\">\n              <div>🔒 <b class=\"text-white\">이중 안전 인터록 구성:<\/b><\/div>\n              <div>• <b>전기적 인터록:<\/b> MC1 코일 전단에 <b>MC2-b접점(5-11번)<\/b> 직렬 연결, MC2 코일 전단에 <b>MC1-b접점(5-11번)<\/b> 직렬 연결<\/div>\n              <div>• <b>기구적 인터록:<\/b> 두 전자접촉기 사이에 기계식 인터록 유닛 장착<\/div>\n            <\/div>\n          <\/div>\n        <\/div>\n\n        <\!-- Pinout Table -->\n        <div class=\"bg-[#0c121b] p-4 rounded-xl border border-amber-500/40\">\n          <h4 class=\"font-bold text-amber-400 text-sm mb-2.5 flex items-center gap-1.5\">\n            <i class=\"fa-solid fa-table\"><\/i> 3. 전기기능사 실기 표준 12핀 기구 핀 번호표 (MC / EOCR)\n          <\/h4>\n          <div class=\"overflow-x-auto\">\n            <table class=\"w-full text-left border-collapse text-xs\">\n              <thead>\n                <tr class=\"bg-slate-800 text-sky-300 border-b border-slate-600\">\n                  <th class=\"p-2\">기구 명칭<\/th>\n                  <th class=\"p-2\">주회로 1차(입력)<\/th>\n                  <th class=\"p-2\">주회로 2차(출력)<\/th>\n                  <th class=\"p-2\">전원 코일(A1·A2)<\/th>\n                  <th class=\"p-2\">자기유지 (a접점)<\/th>\n                  <th class=\"p-2\">인터록/트립 (b접점)<\/th>\n                <\/tr>\n              <\/thead>\n              <tbody class=\"divide-y divide-slate-800 font-mono\">\n                <tr>\n                  <td class=\"p-2 font-bold text-white\">MC1 / MC2 (12핀)<\/td>\n                  <td class=\"p-2 text-emerald-400\">1, 2, 3 (또는 1,3,5)<\/td>\n                  <td class=\"p-2 text-emerald-400\">7, 8, 9 (또는 2,4,6)<\/td>\n                  <td class=\"p-2 text-amber-300\">6번 - 12번<\/td>\n                  <td class=\"p-2 text-sky-300\">4번 - 10번 (NO)<\/td>\n                  <td class=\"p-2 text-rose-400 font-bold\">5번 - 11번 (NC ★인터록)<\/td>\n                <\/tr>\n                <tr>\n                  <td class=\"p-2 font-bold text-white\">EOCR / THR (12핀)<\/td>\n                  <td class=\"p-2 text-emerald-400\">1, 2, 3번 관통<\/td>\n                  <td class=\"p-2 text-emerald-400\">7, 8, 9번<\/td>\n                  <td class=\"p-2 text-amber-300\">6번 - 12번<\/td>\n                  <td class=\"p-2 text-sky-300\">5번 - 11번 (경보)<\/td>\n                  <td class=\"p-2 text-rose-400\">4번 - 10번 (과부하 차단)<\/td>\n                <\/tr>\n              <\/tbody>\n            <\/table>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <\!-- ================= MODAL 2: LARGE INTERACTIVE SCHEMATIC VIEWER ================= -->\n  <div id=\"modalLargeSchematic\" class=\"fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden\">\n    <div class=\"hmi-card w-full max-w-5xl p-4 border-sky-500/60 flex flex-col gap-3\">\n      <div class=\"flex items-center justify-between border-b border-slate-700 pb-2.5\">\n        <h3 class=\"font-bold text-base text-sky-400 flex items-center gap-2\">\n          <i class=\"fa-solid fa-diagram-project\"><\/i> 정·역회전 인터록 주회로 및 제어회로 전체 도면 (실시간 전류 동기화)\n        <\/h3>\n        <button id=\"btnCloseLargeSchematic\" class=\"px-3 py-1 rounded bg-slate-800 hover:bg-slate-700 text-xs font-bold text-white\">닫기<\/button>\n      <\/div>\n      <div id=\"largeSchematicContainer\" class=\"bg-[#05080c] rounded-xl p-3 border border-slate-800\"><\/div>\n      <div class=\"flex justify-between items-center text-xs text-slate-400\">\n        <span>• 흐르는 점선은 실시간 <b>전류(Current Flow)<\/b> 경로이며, 접점 상태가 3D 수배전반과 1:1 연동됩니다.<\/span>\n        <div class=\"flex gap-2\">\n          <button onclick=\"press('fwd')\" class=\"px-3 py-1.5 rounded bg-emerald-700 text-white font-bold\">정회전 기동 (PB-F)<\/button>\n          <button onclick=\"press('rev')\" class=\"px-3 py-1.5 rounded bg-red-700 text-white font-bold\">역회전 기동 (PB-R)<\/button>\n          <button onclick=\"press('stop')\" class=\"px-3 py-1.5 rounded bg-amber-600 text-slate-950 font-bold\">정지 (PB-S)<\/button>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <\!-- ================= CORE APPLICATION & ULTRA-REALISTIC 3D DIGITAL TWIN SCRIPT ================= -->\n  <script>\n    const $ = s => document.querySelector(s);\n    const viewContainer = $('#viewContainer');\n    const COL = { R: 0xe53935, S: 0xf5f5f5, T: 0x1e88e5, C: 0xfacc15 };\n    const KEYS = ['R', 'S', 'T'];\n\n    /* ==========================================================================\n       1. WEB AUDIO SYNTHESIZER (Contactor Clack, Arc Blast)\n       ========================================================================== */\n    class SoundFX {\n      constructor() { this.ctx = null; }\n      init() {\n        if (!this.ctx) {\n          const AC = window.AudioContext || window.webkitAudioContext;\n          if (AC) this.ctx = new AC();\n        }\n        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();\n      }\n      clack() {\n        try {\n          this.init();\n          if (!this.ctx) return;\n          const osc = this.ctx.createOscillator();\n          const g = this.ctx.createGain();\n          osc.type = 'triangle';\n          osc.frequency.setValueAtTime(190, this.ctx.currentTime);\n          osc.frequency.exponentialRampToValueAtTime(42, this.ctx.currentTime + 0.065);\n          g.gain.setValueAtTime(0.4, this.ctx.currentTime);\n          g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.075);\n          osc.connect(g); g.connect(this.ctx.destination);\n          osc.start(); osc.stop(this.ctx.currentTime + 0.075);\n        } catch(e) {}\n      }\n      arcBlast() {\n        try {\n          this.init();\n          if (!this.ctx) return;\n          const len = this.ctx.sampleRate * 0.55;\n          const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);\n          const data = buf.getChannelData(0);\n          for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (len * 0.35));\n          const src = this.ctx.createBufferSource();\n          src.buffer = buf;\n          const g = this.ctx.createGain();\n          g.gain.setValueAtTime(0.9, this.ctx.currentTime);\n          g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.55);\n          src.connect(g); g.connect(this.ctx.destination);\n          src.start();\n        } catch(e) {}\n      }\n    }\n    const sfx = new SoundFX();\n\n    /* ==========================================================================\n       2. THREE.JS SCENE, INDUSTRIAL LIGHTING & PROCEDURAL METAL TEXTURES\n       ========================================================================== */\n    const scene = new THREE.Scene();\n    scene.background = new THREE.Color(0x0a0f16);\n    scene.fog = new THREE.FogExp2(0x0a0f16, 0.012);\n\n    const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);\n    camera.position.set(0, -0.4, 21.5);\n\n    const cameraL = new THREE.PerspectiveCamera(45, 1, 0.1, 100);\n    const cameraR = new THREE.PerspectiveCamera(45, 1, 0.1, 100);\n\n    const renderer = new THREE.WebGLRenderer({ antialias: true });\n    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));\n    renderer.shadowMap.enabled = true;\n    renderer.shadowMap.type = THREE.PCFSoftShadowMap;\n    renderer.xr.enabled = true;\n    viewContainer.appendChild(renderer.domElement);\n    const cv = renderer.domElement;\n\n    const controls = new THREE.OrbitControls(camera, cv);\n    controls.target.set(0.5, -0.8, 0);\n    controls.minDistance = 7;\n    controls.maxDistance = 36;\n    controls.autoRotateSpeed = 1.4;\n    controls.enableDamping = true;\n    controls.update();\n\n    // Studio & Industrial Enclosure Lighting\n    scene.add(new THREE.HemisphereLight(0xdbeafe, 0x1e293b, 0.65));\n    const keyLight = new THREE.DirectionalLight(0xffffff, 0.95);\n    keyLight.position.set(7, 12, 15);\n    keyLight.castShadow = true;\n    scene.add(keyLight);\n\n    const rimLight = new THREE.DirectionalLight(0x38bdf8, 0.35);\n    rimLight.position.set(-10, -5, 8);\n    scene.add(rimLight);\n\n    const flash = new THREE.PointLight(0xffea79, 0, 18);\n    flash.position.set(0, -0.5, 2.8);\n    scene.add(flash);\n\n    const rootTwin = new THREE.Group();\n    scene.add(rootTwin);\n\n    const boardWire = new THREE.Group();\n    boardWire.visible = false;\n    scene.add(boardWire);\n\n    // Industrial Floor Grid\n    const grid = new THREE.GridHelper(40, 40, 0x26354a, 0x131c29);\n    grid.position.y = -6.7;\n    scene.add(grid);\n\n    // Procedural Brushed Galvanized Steel Texture (아연도금 속판 질감)\n    function createBrushedMetalTex() {\n      const c = document.createElement('canvas');\n      c.width = 256; c.height = 256;\n      const g = c.getContext('2d');\n      g.fillStyle = '#9aa3ad';\n      g.fillRect(0, 0, 256, 256);\n      for (let i = 0; i < 900; i++) {\n        g.fillStyle = i % 2 === 0 ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.05)';\n        g.fillRect(0, Math.random() * 256, 256, 1);\n      }\n      const tex = new THREE.CanvasTexture(c);\n      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;\n      tex.repeat.set(3, 3);\n      return tex;\n    }\n    const steelTex = createBrushedMetalTex();\n\n    // High-contrast Nameplate / Label Generator\n    function label(t, sx, sy, px, col, bg, bd) {\n      const c = document.createElement('canvas');\n      c.width = 420;\n      c.height = Math.round(420 * sy / sx);\n      const g = c.getContext('2d');\n      if (bg) {\n        g.fillStyle = bg;\n        g.fillRect(0, 0, c.width, c.height);\n      }\n      if (bd) {\n        g.strokeStyle = bd;\n        g.lineWidth = 8;\n        g.strokeRect(4, 4, c.width - 8, c.height - 8);\n      }\n      g.font = 'bold ' + px + 'px \"Noto Sans KR\",\"Malgun Gothic\",sans-serif';\n      g.textAlign = 'center';\n      g.textBaseline = 'middle';\n      g.fillStyle = col || '#fff';\n      g.fillText(t, c.width / 2, c.height / 2);\n      const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthTest: false }));\n      s.scale.set(sx, sy, 1);\n      s.renderOrder = 10;\n      return s;\n    }\n\n    const std = (c, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: 0.45, metalness: 0.2 }, o));\n    function box(x, y, z, w, h, d, c, par, o) {\n      const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), std(c, o));\n      m.position.set(x, y, z);\n      m.castShadow = true;\n      m.receiveShadow = true;\n      (par || rootTwin).add(m);\n      return m;\n    }\n\n    // Realistic Philips Screw Head Helper\n    function addScrew(x, y, z, r, par, ringColor) {\n      const g = new THREE.Group();\n      g.position.set(x, y, z);\n      if (ringColor !== undefined) {\n        const ring = new THREE.Mesh(\n          new THREE.CylinderGeometry(r * 1.35, r * 1.35, 0.06, 16).rotateX(Math.PI / 2),\n          std(ringColor, { roughness: 0.3 })\n        );\n        ring.position.z = -0.03;\n        g.add(ring);\n      }\n      const head = new THREE.Mesh(\n        new THREE.CylinderGeometry(r, r, 0.12, 16).rotateX(Math.PI / 2),\n        std(0xd4d8de, { metalness: 0.85, roughness: 0.2 })\n      );\n      g.add(head);\n      // Cross slot\n      const s1 = new THREE.Mesh(new THREE.BoxGeometry(r * 1.3, 0.03, 0.03), std(0x222222));\n      const s2 = new THREE.Mesh(new THREE.BoxGeometry(0.03, r * 1.3, 0.03), std(0x222222));\n      s1.position.z = s2.position.z = 0.065;\n      g.add(s1, s2);\n      (par || rootTwin).add(g);\n      return head;\n    }\n\n    /* ==========================================================================\n       3. BUILD REALISTIC 3D INDUSTRIAL ENCLOSURE & COMPONENTS (rootTwin)\n       ========================================================================== */\n    // 1) Outer Powder-Coated Steel Enclosure Cabinet (RAL 7035) & Galvanized Inner Plate\n    box(0, 0.45, -0.28, 9.4, 8.5, 0.2, 0x3b4452, rootTwin, { metalness: 0.5, roughness: 0.5 }); // Outer Cabinet Back\n    const backPlate = new THREE.Mesh(\n      new THREE.BoxGeometry(8.5, 7.8, 0.14),\n      new THREE.MeshStandardMaterial({ color: 0xb0b8c2, map: steelTex, metalness: 0.65, roughness: 0.38 })\n    );\n    backPlate.position.set(0, 0.45, -0.1);\n    backPlate.receiveShadow = true;\n    rootTwin.add(backPlate);\n\n    // 2) Slotted PVC Wiring Ducts (배선 덕트 - 상/하/좌/우 슬롯 디테일)\n    function createSlottedDuct(x, y, w, h, isVertical) {\n      const ductGrp = new THREE.Group();\n      box(x, y, 0.24, w, h, 0.55, 0x64707d, ductGrp, { roughness: 0.6 });\n      // Top cover ridge\n      box(x, y, 0.53, w * 0.98, h * 0.98, 0.04, 0x778492, ductGrp);\n      const count = isVertical ? Math.floor(h / 0.35) : Math.floor(w / 0.35);\n      for (let i = -count / 2; i <= count / 2; i++) {\n        if (isVertical) {\n          box(x, y + i * 0.32, 0.28, w + 0.04, 0.09, 0.35, 0x262d36, ductGrp);\n        } else {\n          box(x + i * 0.32, y, 0.28, 0.09, h + 0.04, 0.35, 0x262d36, ductGrp);\n        }\n      }\n      rootTwin.add(ductGrp);\n    }\n    createSlottedDuct(0, 4.4, 8.8, 0.38, false);\n    createSlottedDuct(0, -3.5, 8.8, 0.38, false);\n    createSlottedDuct(-4.35, 0.45, 0.38, 8.1, true);\n    createSlottedDuct(4.35, 0.45, 0.38, 8.1, true);\n\n    // 3) Aluminum DIN Rails (알루미늄 딘레일 3단)\n    [3.75, 0.8, -1.35, -2.7].forEach(ry => {\n      box(0, ry, -0.01, 7.6, 0.42, 0.08, 0xcbd5e1, rootTwin, { metalness: 0.85, roughness: 0.25 });\n      box(0, ry, 0.02, 7.6, 0.24, 0.05, 0x64748b, rootTwin, { metalness: 0.8, roughness: 0.3 });\n    });\n\n    // 4) Realistic LS Metasol MCCB (3상 배선용 차단기 ABN53c 스타일)\n    const mccbGrp = new THREE.Group();\n    rootTwin.add(mccbGrp);\n    box(0, 3.75, 0.28, 2.5, 1.15, 0.56, 0x1e2229, mccbGrp, { roughness: 0.4 }); // Charcoal body\n    box(0, 3.75, 0.58, 2.2, 0.65, 0.08, 0x2c333f, mccbGrp); // Escutcheon faceplate\n    // Phase barriers (상간 절연 격벽)\n    [-0.28, 0.28].forEach(bx => box(bx, 4.35, 0.28, 0.05, 0.25, 0.5, 0x15181e, mccbGrp));\n    // Toggle Handle Base & Lever\n    box(0, 3.75, 0.64, 0.55, 0.45, 0.1, 0x111317, mccbGrp);\n    const mccbHandle = box(0, 3.82, 0.74, 0.42, 0.22, 0.24, 0x22c55e, mccbGrp, { roughness: 0.3 });\n    // Yellow Trip Test Button\n    box(0.65, 3.62, 0.63, 0.14, 0.14, 0.08, 0xfacc15, mccbGrp);\n    // R, S, T load screws\n    [-0.5, 0, 0.5].forEach((dx, k) => addScrew(dx, 3.3, 0.55, 0.12, mccbGrp, COL[KEYS[k]]));\n    const lq = label('MCCB 3P 30A', 2.0, 0.36, 30, '#f8fafc', '#0f172a', '#38bdf8');\n    lq.position.set(-2.2, 3.75, 0.65);\n    rootTwin.add(lq);\n\n    // 5) Realistic LS Metasol Magnetic Contactors (MC1 & MC2 + Side Aux Contact Blocks)\n    const MX = 2.1, lamps = {}, plungers = {}, bContactBars = {};\n    function mc(id, x, title, tagCode) {\n      const g = new THREE.Group();\n      rootTwin.add(g);\n\n      // Main Contactor Lower Housing\n      box(x, 0.8, 0.25, 1.9, 2.25, 0.52, 0x1f2631, g, { roughness: 0.42 });\n      // Upper Arc Chute Tower (Metasol signature stepped top)\n      box(x, 0.8, 0.58, 1.55, 1.35, 0.24, 0x2b3544, g, { roughness: 0.38 });\n      // White Identification Tag Plate\n      box(x - 0.48, 1.25, 0.72, 0.42, 0.22, 0.03, 0xf8fafc, g);\n\n      // Center Plunger Window & Moving Indicator Core (흡착 시 물리적으로 들어감)\n      box(x, 0.8, 0.71, 0.52, 0.42, 0.04, 0x0f1319, g);\n      const plg = box(x, 0.8, 0.74, 0.36, 0.28, 0.08, 0xea580c, g, { roughness: 0.3 });\n      plungers[id] = plg;\n\n      // Side-Mounted Auxiliary Contact Unit (1a1b 보조접점 블록)\n      const sideX = id === 'm1' ? x + 1.08 : x - 1.08;\n      box(sideX, 0.8, 0.28, 0.32, 1.65, 0.46, 0x334155, g);\n      // Physical b-Contact Bridge Bar (Transparent window effect)\n      const bBar
