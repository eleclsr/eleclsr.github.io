<style>

html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden;font-family:system-ui,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}

#opt{margin-top:6px}#opt label{display:block;cursor:pointer}

#note{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);background:var(--pn);padding:6px 12px;border-radius:8px;font-size:13px;display:none}
#act{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;gap:10px}
#act button{border:0;color:#fff;font-weight:700;font-size:16px;padding:14px 20px;border-radius:12px;min-width:84px;touch-action:none;user-select:none}
#pad{position:absolute;left:10px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:none;grid-template-columns:repeat(3,48px);gap:4px}
#pad button{height:48px;border:0;border-radius:10px;background:var(--pn);color:var(--fg);font-size:20px;touch-action:none}
@media (pointer:coarse){#pad{display:grid}#act{bottom:calc(80px + env(safe-area-inset-bottom,0px));left:auto;right:10px;transform:none;flex-direction:column}#note{bottom:auto;top:90px}}
#tools{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));right:8px;display:flex;gap:6px}
#tools button{border:0;border-radius:8px;padding:8px 10px;background:var(--pn);color:var(--fg);font-size:13px}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .35s}

<script>

// ---------- state ----------

const R1={seq:0,th:0,rot:0};
const btns=[],lamps=[],ROOMS=[{ox:0,n:'전기제어 실습실 · 3상 유도전동기 정·역회전 제어'},{ox:-40,n:'3상 유도전동기 실습 공간'},{ox:40,n:'자기유지 기동 정지 회로 실습 공간'}];

function room(ox){const g=new T.Group();g.position.x=ox;scene.add(g);
 const fc=document.createElement('canvas');fc.width=fc.height=128;const x=fc.getContext('2d');x.fillStyle='#c4cacf';x.fillRect(0,0,128,128);x.strokeStyle='#8e969c';x.lineWidth=3;x.strokeRect(0,0,128,128);
 const ft=new T.CanvasTexture(fc);ft.wrapS=ft.wrapT=T.RepeatWrapping;ft.repeat.set(7,6);

 if(aux){B(g,.2,.3,.1,M(0xff9800),aux*.55,0,.1);L(g,'b',.12,.12,aux*.55,0,.16,'#000')}

// ---------- MAIN ROOM ----------
const g0=room(0);door(g0,-1,'◀ 3상 유도전동기 실습 공간');door(g0,1,'자기유지 기동 정지 회로 실습 공간 ▶');
L(g0,'3상 유도전동기 정·역회전 제어 실습실',4.6,.45,4.6,3.3,-4.97,'#fff','#37474f');
table(g0,0,4.6);
const P=new T.Group();P.position.set(0,1.0,-4.35);g0.add(P);B(P,4.6,2.6,.08,M(0xdfe3e6,{metalness:.3}),0,1.3,0);
L(P,'3상 유도전동기 정·역회전 주회로  (R·S·T → MC → U·V·W)',3.9,.18,0,2.5,.05,'#fff','#37474f');
B(P,.6,.5,.12,M(0x222a31),0,2.05,.06);L(P,'MCCB',.4,.12,0,2.2,.13,'#fff');
const PC=[0xe53935,0xf5c518,0x1e88e5],PN=['R','S','T'];
const mk=()=>PC.map(c=>M(c,{emissive:c,emissiveIntensity:.15})),mTop=mk(),mF=mk(),mR=mk();

function lower(grp,cx,map,mats,rev){for(let i=0;i<3;i++){const sx=cx-.25+.25*i,tx=-.3+.3*map[i],ly=.36+.07*(rev?2-i:i),z=.19+.02*i;wire(grp,[[sx,.62,z],[sx,ly,z],[tx,ly,z],[tx,.24,z]],mats[i])}}
const gF=new T.Group(),gR=new T.Group();P.add(gF,gR);lower(gF,-1.2,[0,1,2],mF,false);

B(P,1,.2,.1,M(0xbdc3c8),0,.16,.08);['U','V','W'].forEach((n,i)=>{C(P,.04,.07,brass,-.3+.3*i,.16,.14,'z');L(P,n,.14,.12,-.3+.3*i,.03,.13,'#222')});

const mot=motor(g0,4.6,-3.4,1.1);L(g0,'3상 유도전동기 (축 방향에서 본 회전)',2.2,.2,4.6,2.0,-3.4,'#fff','#37474f');
const bb=B(g0,1.8,.18,.55,M(0xb8bec4),0,1.03,-3.1);
pb(g0,-.6,1.18,-3.12,0x16a34a,'fwd','정회전');pb(g0,0,1.18,-3.12,0xeab308,'rev','역회전');pb(g0,.6,1.18,-3.12,0xdc2626,'stop','정지');
lamp(g0,-.6,1.17,-3.38,0x00ff55,()=>S.mcF);lamp(g0,0,1.17,-3.38,0xffcc00,()=>S.mcR);lamp(g0,.6,1.17,-3.38,0xff2020,()=>S.trip||(S.mcF&&S.mcR&&!S.swap));
// short-circuit effects
const spN=80,spP=new Float32Array(spN*3).fill(-99),spV=new Float32Array(spN*3);
const sp=new T.Points(new T.BufferGeometry().setAttribute('position',new T.BufferAttribute(spP,3)),new T.PointsMaterial({color:0xffc233,size:.07}));sp.frustumCulled=false;P.add(sp);
const fl=new T.PointLight(0xff3030,0,5);fl.position.set(.5,.5,.9);P.add(fl);
function sparks(dt,on){for(let i=0;i<spN;i++){const j=i*3;if(!on){spP[j+1]=-99;continue}

// ladder drawing
function rung(g,W,y,c){const on='#5cff7a',off='#4d5f6b';

const lad0=CP(g0,3.2,1.75,-4.8,2.3,-4.96,1024,560,(g,W,H)=>{rails(g,W,H,'제어회로 (b접점 전기적 인터록)');const live=!S.trip;

 g.font='bold 22px sans-serif';g.textAlign='center';g.fillStyle=S.noIL?'#ff6b6b':'#9be7b0';g.fillText(S.noIL?'⚠ 인터록 b접점 누락 — 두 MC가 동시에 투입될 수 있음':'상대 MC의 b접점이 직렬 → 동시 투입 방지',W/2,H-24)});
// ---------- LEFT ROOM: induction motor ----------
const g1=room(-40);door(g1,1,'전기제어 실습실(메인) ▶');
