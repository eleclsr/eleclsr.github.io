or: [] };\n    let showFlowParticles = true;\n\n    function makeCurve(pts, z) {\n      return new THREE.CatmullRomCurve3(pts.map(p => new THREE.Vector3(p[0], p[1], z)));\n    }\n\n    function buildWires(swapOK) {\n      while (wireGrp.children.length) wireGrp.remove(wireGrp.children[0]);\n      activeFlowPaths = { fwd: [], rev: [], motor: [] };\n\n      const src = [-0.5, 0, 0.5], blk = [-0.8, 0, 0.8];\n      [-MX, MX].forEach((cx, ci) => KEYS.forEach((p, k) => {\n        const x = cx + src[k], z = 0.62 + k * 0.07 + ci * 0.03;\n        const cIn = makeCurve([[src[k], 3.3], [(src[k] + x) / 2, 2.7], [x, 1.95], [x, 1.72]], z);\n        wireGrp.add(new THREE.Mesh(new THREE.TubeGeometry(cIn, 32, 0.062, 10), std(COL[p], { roughness: 0.35 })));\n\n        const tk = (ci === 1 && swapOK) ? 2 - k : k; // MC2 R·T 상교체\n        const cOut = makeCurve([[x, -0.12], [x, -0.8], [(x + blk[tk]) / 2, -1.65], [blk[tk], -2.7]], z);\n        wireGrp.add(new THREE.Mesh(new THREE.TubeGeometry(cOut, 32, 0.062, 10), std(COL[p], { roughness: 0.35 })));\n\n        if (ci === 0) activeFlowPaths.fwd.push({ curve: cIn, col: COL[p] }, { curve: cOut, col: COL[p] });\n        else activeFlowPaths.rev.push({ curve: cIn, col: COL[p] }, { curve: cOut, col: COL[p] });\n      }));\n\n      KEYS.forEach((p, k) => {\n        const x = [-0.8, 0, 0.8][k];\n        const cMot = makeCurve([[x, -2.7], [x * 0.8, -3.3], [x * 0.4, -3.75], [x * 0.2, -3.95]], 0.8 + k * 0.03);\n        wireGrp.add(new THREE.Mesh(new THREE.TubeGeometry(cMot, 32, 0.065, 10), std(COL[p], { roughness: 0.35 })));\n        activeFlowPaths.motor.push({ curve: cMot, col: COL[p] });\n      });\n    }\n\n    const FLOW_SPHERES = [];\n    for (let i = 0; i < 27; i++) {\n      const m = new THREE.Mesh(\n        new THREE.SphereGeometry(0.125, 12, 12),\n        new THREE.MeshBasicMaterial({ color: 0xffffff })\n      );\n      m.visible = false;\n      flowParticleGrp.add(m);\n      FLOW_SPHERES.push({ mesh: m, offset: (i % 3) / 3, pathIdx: Math.floor(i / 3) });\n    }\n\n    /* ---------- 단락 아크 스파크 파티클 ---------- */\n    const N = 180, sGeo = new THREE.BufferGeometry(), sPos = new Float32Array(N * 3), sVel = new Float32Array(N * 3), sLife = new Float32Array(N);\n    sGeo.setAttribute('position', new THREE.BufferAttribute(sPos, 3));\n    const sparks = new THREE.Points(sGeo, new THREE.PointsMaterial({ color: 0xfde047, size: 0.26, transparent: true, opacity: 0 }));\n    rootTwin.add(sparks);\n    let sparkT = 0;\n    function emit(i) {\n      sPos.set([0, -0.5, 0.95], i * 3);\n      const a = Math.random() * 6.28, s = 2.8 + Math.random() * 6.0;\n      sVel.set([Math.cos(a) * s, Math.random() * 6.0, Math.sin(a) * s * 0.65], i * 3);\n      sLife[i] = 0.3 + Math.random() * 0.7;\n    }\n\n    /* ==========================================================================\n       4. BUILD 1단계 주회로 직접 결선 실습 3D 보드 (boardWire - Industrial Upgrade)\n       ========================================================================== */\n    const terms = {}, tpos = {}, tmeshes = [];\n    function bLabel(t, sx, sy, px, col, bg) {\n      const c = document.createElement('canvas'); c.width = 320; c.height = Math.round(320 * sy / sx);\n      const g = c.getContext('2d');\n      if (bg) { g.fillStyle = bg; g.fillRect(0, 0, c.width, c.height); }\n      g.font = 'bold ' + px + 'px \"Noto Sans KR\",sans-serif';\n      g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = col || '#f8fafc'; g.fillText(t, c.width / 2, c.height / 2);\n      const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthTest: false }));\n      s.scale.set(sx, sy, 1); s.renderOrder = 10; return s;\n    }\n    function bBox(cx, cy, w, h, col, title, px) {\n      const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.45), std(col, { roughness: 0.45 }));\n      m.position.set(cx, cy, 0.15); boardWire.add(m);\n      if (title) { const l = bLabel(title, w * 0.92, 0.48, px || 32, '#fff', 'rgba(15,23,42,0.85)'); l.position.set(cx, cy, 0.45); boardWire.add(l); }\n    }\n    function term(id, x, y, ph, name, num, dy) {\n      const mat = new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 0.75, roughness: 0.25, emissive: 0x000000 });\n      const g = new THREE.CylinderGeometry(0.22, 0.22, 0.18, 18); g.rotateX(Math.PI / 2);\n      const m = new THREE.Mesh(g, mat); m.position.set(x, y, 0.44); m.userData.id = id; boardWire.add(m);\n      const r = new THREE.Mesh(new THREE.TorusGeometry(0.26, 0.042, 10, 24), new THREE.MeshBasicMaterial({ color: COL[ph] }));\n      r.position.set(x, y, 0.39); boardWire.add(r);\n      if (num) { const l = bLabel(num, 0.5, 0.26, 38, '#fde047'); l.position.set(x, y + dy, 0.45); boardWire.add(l); }\n      terms[id] = { m, mat, name, ph }; tpos[id] = new THREE.Vector3(x, y, 0.44); tmeshes.push(m);\n    }\n    function dev3(prefix, dname, cx, cy, w, h, col, title) {\n      bBox(cx, cy, w, h, col, title);\n      [-0.8, 0, 0.8].forEach((dx, k) => {\n        term(prefix + '-' + (2 * k + 1), cx + dx, cy + h * 0.32, KEYS[k], dname + ' ' + (2 * k + 1) + '번(주회로 입력)', String(2 * k + 1), -0.35);\n        term(prefix + '-' + (2 * k + 2), cx + dx, cy - h * 0.32, KEYS[k], dname + ' ' + (2 * k + 2) + '번(주회로 출력)', String(2 * k + 2), 0.35);\n      });\n    }\n\n    // MC 옆면에 부착되는 인터록 b접점(5·11번) 및 코일(A1:6번·A2:12번) 보조블록 생성 함수\n    function addMCControlBlock(prefix, dname, sideX, cy) {\n      bBox(sideX, cy, 1.55, 2.2, 0x334155, dname + ' 인터록·코일', 24);\n      // 상단: b접점 5번(입력), 11번(출력) - 황색 제어선(C)\n      term(prefix + '-b1', sideX - 0.38, cy + 0.65, 'C', dname + ' b접점 5번(인터록 입력)', 'b5', -0.33);\n      term(prefix + '-b2', sideX + 0.38, cy + 0.65, 'C', dname + ' b접점 11번(인터록 출력)', 'b11', -0.33);\n      // 하단: 코일 A1(6번), A2(12번)\n      term(prefix + '-A1', sideX - 0.38, cy - 0.68, 'C', dname + ' 코일 6번(A1 전원)', 'A1(6)', 0.33);\n      term(prefix + '-A2', sideX + 0.38, cy - 0.68, 'T', dname + ' 코일 12번(A2 공통)', 'A2(12)', 0.33);\n    }\n\n    // Galvanized Workbench Plate for Wiring Mode (확장된 폭으로 제어회로 스위치 및 인터록 단자 수용)\n    const wireBackPlate = new THREE.Mesh(new THREE.BoxGeometry(14.8, 11.4, 0.2), new THREE.MeshStandardMaterial({ color: 0x9aa3ad, map: steelTex, metalness: 0.6, roughness: 0.4 }));\n    wireBackPlate.position.set(0, -0.2, -0.05);\n    boardWire.add(wireBackPlate);\n\n    bBox(0, 4.45, 3.2, 1.0, 0x1e2229, 'MCCB 전원 (R·S·T)', 30);\n    KEYS.forEach((p, k) => term('P-' + p, [-0.8, 0, 0.8][k], 3.6, p, '전원 ' + p + '상', p, -0.35));\n\n    // 주회로 접촉기 & 열동계전기\n    dev3('MCF', 'MC-F', -3.0, 2.0, 2.6, 2.2, 0x1f2937, 'MC-F (정회전)');\n    dev3('MCR', 'MC-R', 3.0, 2.0, 2.6, 2.2, 0x1f2937, 'MC-R (역회전)');\n\n    // MC-F / MC-R 측면 보조접점(b접점 5-11) 및 코일(A1-A2) 단자 블록 배치\n    addMCControlBlock('MCF', 'MC-F', -5.25, 2.0);\n    addMCControlBlock('MCR', 'MC-R', 5.25, 2.0);\n\n    // 제어회로 기동 버튼 블록 (PB-F 정회전 / PB-R 역회전)\n    bBox(-5.25, -0.85, 2.2, 1.5, 0x14532d, 'PB-F (정회전 버튼)', 26);\n    term('PBF-1', -5.7, -0.85, 'C', 'PB-F 입력(제어R)', 'IN', -0.35);\n    term('PBF-2', -4.8, -0.85, 'C', 'PB-F 출력(기동신호)', 'OUT', -0.35);\n\n    bBox(5.25, -0.85, 2.2, 1.5, 0x7f1d1d, 'PB-R (역회전 버튼)', 26);\n    term('PBR-1', 4.8, -0.85, 'C', 'PB-R 입력(제어R)', 'IN', -0.35);\n    term('PBR-2', 5.7, -0.85, 'C', 'PB-R 출력(역회전신호)', 'OUT', -0.35);\n\n    dev3('THR', 'THR', 0, -0.6, 2.7, 1.8, 0x27272a, 'THR (과부하계전기)');\n    bBox(0, -2.55, 2.7, 0.9, 0x111318);\n    ['U', 'V', 'W'].forEach((u, k) => term('M-' + u, [-0.8, 0, 0.8][k], -2.55, KEYS[k], '모터 ' + u + ' 단자', u, -0.35));\n\n    const wMotor = new THREE.Mesh(new THREE.CylinderGeometry(1.1, 1.1, 3.2, 32).rotateZ(Math.PI / 2), std(0x25384e, { metalness: 0.6, roughness: 0.35 }));\n    wMotor.position.set(0, -4.3, 0.15); boardWire.add(wMotor);\n    const wMl = bLabel('3상 유도전동기 (U·V·W)', 3.2, 0.5, 32, '#fff', 'rgba(15,23,42,0.85)'); wMl.position.set(0, -4.3, 1.3); boardWire.add(wMl);\n\n    // 1단계 결선 전용 3D 전선 그룹 (되돌리기/전체철거 시 잔상 없이 즉시 제거되도록 분리)\n    const userWireGrp = new THREE.Group();\n    boardWire.add(userWireGrp);\n\n    // 1단계 결선 데이터 및 그래프 검사 로직 (주회로 15선 + 제어회로 인터록 8선 = 총 23선)\n    const userWires = [];\n    let selTerm = null, hoverTerm = null, wireStartTime = null, wireAttempts = 0;\n    const nm = id => terms[id].name;\n\n    const GROUPS = [\n      ['[주회로] 전원 → MC-F 입력', [['P-R', 'MCF-1'], ['P-S', 'MCF-3'], ['P-T', 'MCF-5']]],\n      ['[주회로] MC-F 출력 → THR 입력', [['MCF-2', 'THR-1'], ['MCF-4', 'THR-3'], ['MCF-6', 'THR-5']]],\n      ['[주회로] 전원 → MC-R 입력', [['P-R', 'MCR-1'], ['P-S', 'MCR-3'], ['P-T', 'MCR-5']]],\n      ['[주회로] MC-R 출력 → THR (R·T 교체)', [['MCR-2', 'THR-5'], ['MCR-4', 'THR-3'], ['MCR-6', 'THR-1']]],\n      ['[주회로] THR 출력 → 모터 U·V·W', [['THR-2', 'M-U'], ['THR-4', 'M-V'], ['THR-6', 'M-W']]],\n      ['[제어] 전원(R/T) → 기동버튼·코일A2', [['P-R', 'PBF-1'], ['P-R', 'PBR-1'], ['P-T', 'MCF-A2'], ['P-T', 'MCR-A2']]],\n      ['[인터록] PB-F → MC-R(b접점) → MC-F코일', [['PBF-2', 'MCR-b1'], ['MCR-b2', 'MCF-A1']]],\n      ['[인터록] PB-R → MC-F(b접점) → MC-R코일', [['PBR-2', 'MCF-b1'], ['MCF-b2', 'MCR-A1']]]\n    ];\n    const pairKey = (a, b) => [a, b].sort().join('|');\n    const requiredPairs = new Set(GROUPS.flatMap(g => g[1].map(p => pairKey(...p))));\n    const TOTAL_REQUIRED_WIRES = requiredPairs.size;\n\n    function clearUserWireMeshes() {\n      while (userWireGrp.children.length > 0) {\n        const child = userWireGrp.children[0];\n        if (child.geometry) child.geometry.dispose();\n        if (child.material) {\n          if (Array.isArray(child.material)) child.material.forEach(m => m.dispose());\n          else child.material.dispose();\n        }\n        userWireGrp.remove(child);\n      }\n    }\n\n    function rebuildUserWires() {\n      clearUserWireMeshes();\n      userWires.forEach((w, k) => {\n        const A = tpos[w.a], B = tpos[w.b], M = A.clone().add(B).multiplyScalar(0.5);\n        M.z = 0.8 + 0.08 * (k % 10);\n        const c = new THREE.CatmullRomCurve3([A.clone(), A.clone().setZ(0.65), M, B.clone().setZ(0.65), B.clone()]);\n        const m = new THREE.Mesh(\n          new THREE.TubeGeometry(c, 40, 0.055, 10),\n          std(w.color, { roughness: 0.35, emissive: w.color, emissiveIntensity: 0.1 })\n        );\n        m.userData.wire = w;\n        m.userData.wireIndex = k;\n        w.mesh = m;\n        userWireGrp.add(m);\n\n        // 양 끝단 압착 단자 절연 슬리브(Boot)도 userWireGrp 내부에 추가하여 철거 시 함께 삭제\n        [A, B].forEach(pos => {\n          const boot = new THREE.Mesh(\n            new THREE.CylinderGeometry(0.085, 0.085, 0.14, 12).rotateX(Math.PI / 2),\n            std(w.color, { roughness: 0.3 })\n          );\n          boot.position.set(pos.x, pos.y, pos.z + 0.08);\n          boot.userData.wire = w;\n          boot.userData.wireIndex = k;\n          userWireGrp.add(boot);\n        });\n      });\n      updateWireModeUI();\n    }\n\n    function refreshTermsEmissive() {\n      const used = new Set(); userWires.forEach(w => { used.add(w.a); used.add(w.b); });\n      for (const id in terms) {\n        terms[id].mat.emissive.setHex(id === selTerm ? 0xfacc15 : id === hoverTerm ? 0x38bdf8 : used.has(id) ? 0x10b981 : 0);\n      }\n    }\n\n    function updateWireModeUI() {\n      let totalDone = 0;\n      $('#wireChecklistUI').innerHTML = GROUPS.map(([t, pairs]) => {\n        const n = pairs.filter(([a, b]) => userWires.some(w => pairKey(w.a, w.b) === pairKey(a, b))).length;\n        totalDone += n;\n        const ok = n === pairs.length;\n        return `<li class=\"flex items-center justify-between p-1.5 rounded bg-[#080c12] border ${ok ? 'border-emerald-500/60 text-emerald-400' : 'border-slate-800 text-slate-400'}\">\n          <span>${ok ? '✓ ' : '○ '}${t}<\/span>\n          <span class=\"font-mono font-bold\">${n}/${pairs.length}<\/span>\n        <\/li>`;\n      }).join('');\n      $('#wireCheckSummary').textContent = `${totalDone} / ${TOTAL_REQUIRED_WIRES} 완료`;\n      $('#wireCountUI').textContent = userWires.length;\n      $('#wireListUI').innerHTML = userWires.length ? userWires.map((w, i) => `\n        <li class=\"flex items-center gap-2 p-1.5 rounded bg-[#080c12] border border-slate-800\">\n          <span class=\"w-2.5 h-2.5 rounded-full shrink-0\" style=\"background:#${w.color.toString(16).padStart(6, '0')}\"><\/span>\n          <span class=\"truncate flex-1\">${nm(w.a)} → ${nm(w.b)}<\/span>\n          <button type=\"button\" data-i=\"${i}\" class=\"text-red-400 hover:text-red-200 px-1.5 font-bold cursor-pointer\" title=\"이 전선 철거\">×<\/button>\n        <\/li>`).join('') : '<li class=\"text-center text-slate-500 py-3\">포설된 전선이 없습니다.<\/li>';\n      refreshTermsEmissive();\n    }\n\n    $('#wireListUI').addEventListener('click', e => {\n      const btn = e.target.closest('button[data-i]');\n      if (!btn) return;\n      const i = Number(btn.dataset.i);\n      if (!Number.isNaN(i) && userWires[i]) {\n        const removed = userWires.splice(i, 1)[0];\n        selTerm = null;\n        rebuildUserWires();\n        sfx.clack();\n        $('#wireInspectResult').innerHTML = `<span class=\"text-amber-400\">전선 철거:<\/span> ${nm(removed.a)} ↔ ${nm(removed.b)} 연결을 삭제했습니다.`;\n      }\n    });\n\n    function clickTerm(id) {\n      sfx.clack();\n      if (!selTerm) {\n        selTerm = id;\n        refreshTermsEmissive();\n        $('#wireInspectResult').innerHTML = `시작 단자: <b class=\"text-amber-300\">${nm(id)}<\/b> → 연결할 상대 단자를 클릭하세요. (같은 단자 재클릭 시 취소)`;\n        return;\n      }\n      if (selTerm === id) {\n        selTerm = null;\n        refreshTermsEmissive();\n        $('#wireInspectResult').textContent = '단자 선택을 취소했습니다.';\n        return;\n      }\n      const a = selTerm;\n      selTerm = null;\n      if (userWires.some(w => (w.a === a && w.b === id) || (w.a === id && w.b === a))) {\n        refreshTermsEmissive();\n        $('#wireInspectResult').innerHTML = '<span class=\"text-red-400 font-bold\">이미 연결된 단자 구간입니다.<\/span>';\n        return;\n      }\n      if (!wireStartTime) wireStartTime = Date.now();\n      userWires.push({ a, b: id, color: COL[terms[a].ph] });\n      rebuildUserWires();\n      $('#wireInspectResult').innerHTML = `<span class=\"text-emerald-400 font-bold\">결선 완료:<\/span> ${nm(a)} → ${nm(id)}`;\n    }\n\n    function graph(active) {\n      const g = {}, add = (a, b) => { (g[a] = g[a] || []).push(b); (g[b] = g[b] || []).push(a); };\n      userWires.forEach(w => add(w.a, w.b));\n      ['THR', active].forEach(p => [[1, 2], [3, 4], [5, 6]].forEach(([i, o]) => add(p + '-' + i, p + '-' + o)));\n      return g;\n    }\n    function reach(g, s) {\n      const seen = new Set([s]), q = [s];\n      while (q.length) {\n        const n = q.pop();\n        (g[n] || []).forEach(m => { if (!seen.has(m)) { seen.add(m); q.push(m); } });\n      }\n      return seen;\n    }\n    function analyze(active) {\n      const g = graph(active), r = { R: reach(g, 'P-R'), S: reach(g, 'P-S'), T: reach(g, 'P-T') }, out = { short: [], map: {} };\n      if (r.R.has('P-S')) out.short.push('R-S');\n      if (r.R.has('P-T')) out.short.push('R-T');\n      if (r.S.has('P-T')) out.short.push('S-T');\n      ['U', 'V', 'W'].forEach(u => out.map[u] = KEYS.filter(p => r[p].has('M-' + u)));\n      return out;\n    }\n    function kind(map) {\n      const v = ['U', 'V', 'W'].map(u => map[u]);\n      if (v.some(x => x.length === 0)) return { k: 'none' };\n      if (v.some(x => x.length > 1) || new Set(v.map(x => x[0])).size < 3) return { k: 'multi' };\n      const s = v.map(x => x[0]), idx = s.map(p => 'RST'.indexOf(p));\n      let inv = 0;\n      for (let i = 0; i < 3; i++) for (let j = i + 1; j < 3; j++) if (idx[i] > idx[j]) inv++;\n      if (inv === 0) return { k: 'identity', s };\n      if (inv === 2) return { k: 'cycle', s };\n      return { k: 'swap', s, pair: KEYS.filter((p, i) => s[i] !== p) };\n    }\n    const fmt = s => 'U=' + s[0] + ', V=' + s[1] + ', W=' + s[2];\n\n    function checkUserWiring() {\n      wireAttempts++;\n      $('#wireAttemptUI').textContent = wireAttempts;\n      if (!userWires.length) {\n        $('#wireInspectResult').innerHTML = '<b class=\"text-red-400\">포설된 전선이 없습니다.<\/b> 단자를 클릭해 결선하세요.';\n        return;\n      }\n      const errs = [], oks = [];\n      const actualPairs = new Set(userWires.map(w => pairKey(w.a, w.b)));\n      const missing = [...requiredPairs].filter(p => !actualPairs.has(p));\n      const extra = [...actualPairs].filter(p => !requiredPairs.has(p));\n\n      // 제어회로 인터록(상대 b접점 경유 여부) 정밀 진단\n      const gBase = {};\n      const addEdge = (a, b) => { (gBase[a] = gBase[a] || []).push(b); (gBase[b] = gBase[b] || []).push(a); };\n      userWires.forEach(w => addEdge(w.a, w.b));\n\n      // 정회전 코일(MCF-A1)이 상대 MCR-b(b1-b2) 접점을 반드시 거치는지 검사\n      const gWithMCRb = JSON.parse(JSON.stringify(gBase));\n      (gWithMCRb['MCR-b1'] = gWithMCRb['MCR-b1'] || []).push('MCR-b2');\n      (gWithMCRb['MCR-b2'] = gWithMCRb['MCR-b2'] || []).push('MCR-b1');\n      const reachFwdClosed = reach(gWithMCRb, 'PBF-2').has('MCF-A1');\n      const reachFwdOpen = reach(gBase, 'PBF-2').has('MCF-A1'); // b접점 개방 시 차단되어야 정상\n\n      if (reachFwdClosed && !reachFwdOpen) {\n        oks.push('정회전 인터록: PB-F → MC-R b접점(5·11번) → MC-F 코일(A1) 정상');\n      } else if (reachFwdOpen) {\n        errs.push('정회전 인터록 누락: <b class=\"text-red-400\">MC-R의 b접점(5·11번)을 거치지 않고<\/b> MC-F 코일(A1)로 직결되었습니다! (동시 투입 시 단락 위험)');\n      } else {\n        errs.push('정회전 제어회로 미결선: PB-F(OUT) → MC-R(b5·b11) → MC-F(A1) 경로가 완성되지 않았습니다.');\n      }\n\n      // 역회전 코일(MCR-A1)이 상대 MCF-b(b1-b2) 접점을 반드시 거치는지 검사\n      const gWithMCFb = JSON.parse(JSON.stringify(gBase));\n      (gWithMCFb['MCF-b1'] = gWithMCFb['MCF-b1'] || []).push('MCF-b2');\n      (gWithMCFb['MCF-b2'] = gWithMCFb['MCF-b2'] || []).push('MCF-b1');\n      const reachRevClosed = reach(gWithMCFb, 'PBR-2').has('MCR-A1');\n      const reachRevOpen = reach(gBase, 'PBR-2').has('MCR-A1');\n\n      if (reachRevClosed && !reachRevOpen) {\n        oks.push('역회전 인터록: PB-R → MC-F b접점(5·11번) → MC-R 코일(A1) 정상');\n      } else if (reachRevOpen) {\n        errs.push('역회전 인터록 누락: <b class=\"text-red-400\">MC-F의 b접점(5·11번)을 거치지 않고<\/b> MC-R 코일(A1)로 직결되었습니다! (동시 투입 시 단락 위험)');\n      } else {\n        errs.push('역회전 제어회로 미결선: PB-R(OUT) → MC-F(b5·b11) → MC-R(A1) 경로가 완성되지 않았습니다.');\n      }\n\n      if (missing.length) errs.push(`필수 단자 연결 ${missing.length}개가 누락되었습니다.`);\n      if (extra.length) errs.push(`기준 도면에 없는 오결선 ${extra.length}개가 있습니다.`);\n\n      const F = analyze('MCF'), B = analyze('MCR');\n      const inspectBranch = (a, dir) => {\n        if (a.short.length) { errs.push(`${dir}: 투입 시 <b class=\"text-red-400\">${a.short.join(', ')} 상간 단락<\/b> 발생!`); return null; }\n        const k = kind(a.map);\n        if (k.k === 'none') { const miss = ['U', 'V', 'W'].filter(u => !a.map[u].length).join('·'); errs.push(`${dir}: 모터 <b>${miss}<\/b> 상 미도달`); return null; }\n        if (k.k === 'multi') { errs.push(`${dir}: 한 모터 단자에 중복 상 연결됨`); return null; }\n        return k;\n      };\n      const kf = inspectBranch(F, '정회전(MC-F)');\n      if (kf) {\n        if (kf.k === 'identity') oks.push('주회로 정회전(MC-F): U-V-W = R-S-T 정상');\n        else errs.push(`정회전(MC-F): 상순 불일치 (${fmt(kf.s)})`);\n      }\n      const kb = inspectBranch(B, '역회전(MC-R)');\n      if (kb) {\n        if (kb.k === 'identity') errs.push('역회전(MC-R): <b class=\"text-red-400\">주회로 상 교체 누락<\/b> (정회전과 동일 방향 회전)');\n        else if (kb.k === 'cycle') errs.push(`역회전(MC-R): 3상 순환(${fmt(kb.s)}) 연결됨 — 2상(R·T)만 교체해야 합니다.`);\n        else {\n          oks.push(`주회로 역회전(MC-R): ${fmt(kb.s)} → 두 상(${kb.pair.join('·')}) 교체 완료`);\n          if (kb.pair.join('') !== 'RT') errs.push(`역회전: 시험 기준은 R·T 교체입니다 (현재 ${kb.pair.join('·')}).`);\n        }\n      }\n\n      if (!errs.length) {\n        done[1] = true;\n        S.interlock = true;\n        S.swapOK = true;\n        $('#swI').checked = false;\n        $('#swP').checked = false;\n        config();\n        toast('주회로 및 b접점 인터록 결선 완벽 통과! 3D 운전·고장 탭에서 동작을 테스트하세요.', true);\n        $('#wireInspectResult').innerHTML = `<div class=\"text-emerald-400 font-bold mb-1\">✔ 주회로 + 인터록 결선 완벽 통과! (${wireAttempts}회 시도)<\/div><ul class=\"list-disc pl-4 space-y-0.5 text-slate-200\">${oks.map(o => `<li>${o}<\/li>`).join('')}<\/ul>`;\n      } else {\n        sfx.arcBlast();\n        $('#wireInspectResult').innerHTML = `<div class=\"text-red-400 font-bold mb-1\">✘ 결선 오류 ${errs.length}건 발견<\/div><ul class=\"list-disc pl-4 space-y-0.5 text-red-200\">${errs.map(e => `<li>${e}<\/li>`).join('')}${oks.map(o => `<li class=\"text-emerald-300\">✔ ${o}<\/li>`).join('')}<\/ul>`;\n      }\n    }\n\n    /* ==========================================================================\n       5. SIMULATION STATE, SEQUENCER & SCHEMATIC SYNCHRONIZATION\n       ========================================================================== */\n    const S = {\n      viewMode: 'twin',\n      fwd: false,\n      rev: false,\n      tripped: false,\n      interlock: true,\n      swapOK: true\n    };\n    const done = [false, false, false, false, false, false];\n    const STEPS = [\n      '1단계 주회로 직접 결선 및 검사 통과',\n      '전원 투입 후 정회전(MC1) 기동 확인',\n      '정지 후 역회전(MC2) 상교체 회전 확인',\n      '인터록(b접점) 동시 투입 방지 동작 확인',\n      '오류 체험 (인터록 누락 단락폭발 · 상교체 누락)'\n    ];\n    const HINTS = [\n      '상단 [1단계 결선실습] 탭에서 주회로를 결선하고 검사를 통과하세요.',\n      '우측 조작반의 초록색 [정회전 기동(PB-F)]을 누르세요.',\n      '[정지(PB-S)]를 누른 뒤 [역회전 기동(PB-R)]을 누르세요.',\n      '정회전 운전 중에 즉시 [역회전 기동]을 눌러 b접점 차단을 확인하세요.',\n      '좌측 [고장 모의] 체크박스를 켜고 운전 중 반대 방향 버튼을 눌러 보세요.'\n    ];\n\n    let ilkFlash = 0, omega = 0, flowTime = 0, inrushTimer = 0;\n\n    function log(t, k) {\n      const m = $('#msg');\n      m.textContent = t;\n      m.className = 'mt-2.5 p-2.5 rounded bg-[#05080c] border-l-4 text-xs leading-relaxed min-h-[52px] ' +\n        (k === 'err' ? 'border-red-500 text-red-300 font-bold' : k === 'ok' ? 'border-emerald-500 text-emerald-300' : 'border-sky-500 text-slate-300');\n    }\n\n    function dirNow() {\n      return (S.rev && !S.fwd) ? (S.swapOK ? -1 : 1) : 1;\n    }\n\n    let toastT;\n    function toast(t, ok) {\n      const e = $('#toastBanner');\n      e.textContent = t;\n      e.className = `fixed left-1/2 top-16 -translate-x-1/2 z-50 max-w-[92vw] w-[540px] px-4 py-2.5 rounded-lg border text-xs sm:text-sm font-bold shadow-2xl ${ok ? 'bg-emerald-950/95 border-emerald-400 text-emerald-200' : 'bg-red-950/95 border-red-500 text-red-200'}`;\n      e.classList.remove('hidden');\n      clearTimeout(toastT);\n      toastT = setTimeout(() => e.classList.add('hidden'), 5000);\n    }\n\n    function renderSteps() {\n      const cur = done.findIndex((d, i) => i > 0 && !d);\n      const completedCount = done.slice(1).filter(Boolean).length;\n      $('#stepCountBadge').textContent = `${completedCount} / 5 완료`;\n      $('#stepsListUI').innerHTML = STEPS.map((t, i) => {\n        const n = i + 1;\n        const isDone = done[n];\n        const isCur = n === cur;\n        return `<li class=\"flex items-start gap-2.5 p-2 rounded-lg border ${isDone ? 'bg-emerald-950/30 border-emerald-600/40 text-emerald-300' : isCur ? 'bg-sky-950/40 border-sky-500/60 text-white' : 'bg-[#080c12] border-slate-800/80 text-slate-400'}\">\n          <span class=\"w-5 h-5 rounded-full text-[11px] font-mono font-bold flex items-center justify-center shrink-0 mt-0.5 ${isDone ? 'bg-emerald-500 text-slate-950' : isCur ? 'bg-sky-400 text-slate-950' : 'border border-slate-600 text-slate-400'}\">${isDone ? '✓' : n}<\/span>\n          <div class=\"flex-1\">\n            <div class=\"font-bold leading-snug\">${t}<\/div>\n            ${isCur ? `<div class=\"text-[11px] text-sky-300 mt-0.5\">${HINTS[i]}<\/div>` : ''}\n          <\/div>\n        <\/li>`;\n      }).join('');\n    }\n\n    function syncSchematicSVG() {\n      const run = (S.fwd || S.rev) && !S.tripped;\n      const d = dirNow();\n\n      $('#svgMCCB').setAttribute('stroke', S.tripped ? '#ef4444' : '#10b981');\n      $('#svgMCCBTxt').textContent = S.tripped ? 'MCCB (단락 TRIP!)' : 'MCCB (정상 ON)';\n      $('#svgMCCBTxt').setAttribute('fill', S.tripped ? '#fca5a5' : '#e2e8f0'  const h = rc.intersectObjects(tmeshes, false);\n        const id = h.length ? h[0].object.userData.id : null;\n        if (id !== hoverTerm) { hoverTerm = id; refreshTermsEmissive(); cv.style.cursor = id ? 'pointer' : 'default'; }\n        if (id) {\n          tipEl.classList.remove('hidden');\n          tipEl.textContent = nm(id);\n          tipEl.style.left = (e.clientX + 14) + 'px';\n          tipEl.style.top = (e.clientY + 14) + 'px';\n        } else {\n          tipEl.classList.add('hidden');\n        }\n      }\n    });\n\n    /* ==========================================================================\n       8. MOBILE VR (WebXR + Stereoscopic Cardboard Split-Screen)\n       ========================================================================== */\n    let xrSession = null;\n    let stereoVRActive = false;\n\n    function toggleStereoVR(forceState) {\n      stereoVRActive = forceState !== undefined ? forceState : !stereoVRActive;\n      $('#vrStereoOverlay').classList.toggle('active', stereoVRActive);\n      $('#leftCol').classList.toggle('hidden', stereoVRActive);\n      $('#rightCol').classList.toggle('hidden', stereoVRActive);\n      $('#vrBtnLabel').textContent = stereoVRActive ? 'VR 종료' : '모바일 VR';\n      if (!stereoVRActive) {\n        renderer.setScissorTest(false);\n        resize();\n      } else {\n        toast('모바일 VR 양안 분할 모드가 활성화되었습니다. 화면을 터치하면 기동/정지가 전환됩니다.', true);\n      }\n    }\n\n    $('#btnExitStereoVR').onclick = () => toggleStereoVR(false);\n\n    $('#btnStartVR').onclick = async () => {\n      if (xrSession) { xrSession.end(); return; }\n      if (stereoVRActive) { toggleStereoVR(false); return; }\n\n      if (navigator.xr && navigator.xr.isSessionSupported) {\n        try {\n          const supported = await navigator.xr.isSessionSupported('immersive-vr');\n          if (supported) {\n            const s = await navigator.xr.requestSession('immersive-vr', { optionalFeatures: ['local-floor'] });\n            xrSession = s;\n uildUserWires();\n      checkUserWiring();\n    };\n    $('#btnSwapErrorWire').onclick = () => {\n      userWires.length = 0;\n      selTerm = null;\n      GROUPS.forEach((g, idx) => {\n        if (idx === 3) {\n          [['MCR-2', 'THR-1'], ['MCR-4', 'THR-3'], ['MCR-6', 'THR-5']].forEach(([a, b]) => userWires.push({ a, b, color: COL[terms[a].ph] }));\n        } else {\n          g[1].forEach(([a, b]) => userWires.push({ a, b, color: COL[terms[a].ph] }));\n        }\n      });\n      rebuildUserWires();\n      checkUserWiring();\n    };\n\n    for (let i = 0; i < 2; i++) {\n      const c = renderer.xr.getController(i);\n      c.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3(0, 0, -6)]), new THREE.LineBasicMaterial({ color: 0x38bdf8 })));\n      c.addEventListener('selectstart', () => {\n        const m = new THREE.Matrix4().extractRotation(c.matrixWorld);\n        rc.ray.origin.setFromMatrixPosition(c.matrixWorld);\n        rc.ray.direction.set(0, 0, -1).applyMatrix4(m);\n        if (S.viewMode === 'twin') {\n          const h = rc.intersectObjects(acts, false);\n          if (h.length) { pulseBtn(h[0].object); press(h[0].object.userData.action); }\n        } else {\n          const h = rc.intersectObjects(tmeshes, false);\n          if (h.length) clickTerm(h[0].object.userData.id);\n        }\n      });\n      scene.add(c);\n    }\n\n    /* ==========================================================================\n       9. UI CONTROLS, TELEMETRY METERS & ANIMATION LOOP\n       ========================================================================== */\n    const openLargeSchem = () => {\n      $('#largeSchematicContainer').innerHTML = $('#miniSchematicWrap').innerHTML;\n      $('#modalLargeSchematic').classList.remove('hidden');\n    };\n    $('#btnExpandSchematicModal').onclick = openLargeSchem;\n    $('#btnExpandSchematicInner').onclick = openLargeSchem;\n    $('#btnCloseLargeSchematic').onclick = () => $('#modalLargeSchematic').classList.add('hidden');\n\n    $('#btnOpenTheory').onclick = () => $('#modalTheory').classList.remove('hidden');\n    $('#btnCloseTheory').onclick = () => $('#modalTheory').classList.add('hidden');\n\n    $('#btnToggleFlowParticles').onclick = () => {\n      showFlowParticles = !showFlowParticles;\n      $('#btnToggleFlowParticles').innerHTML = `<i class=\"fa-solid fa-bolt\"><\/i> 전류펄스: ${showFlowParticles ? 'ON' : 'OFF'}`;\n      if (!showFlowParticles) FLOW_SPHERES.forEach(s => s.mesh.visible = false);\n    };\n\n    $('#btnAutoSpinCam').onclick = () => {\n      controls.autoRotate = !controls.autoRotate;\n      $('#btnAutoSpinCam').innerHTML = `<i class=\"fa-solid fa-rotate\"><\/i> ${controls.autoRotate ? '회전중지' : '자동회전'}`;\n    };\n\n    setInterval(() => {\n      if (wireStartTime && S.viewMode === 'wire') {\n        const sec = Math.floor((Date.now() - wireStartTime) / 1000);\n        $('#wireTimerUI').textContent = String(Math.floor(sec / 60)).padStart(2, '0') + ':' + String(sec % 60).padStart(2, '0');\n      }\n    }, 500);\n\n    function resize() {\n      if (renderer.xr.isPresenting) return;\n      const w = viewContainer.clientWidth, h = viewContainer.clientHeight;\n      renderer.setSize(w, h, false);\n      camera.aspect = w / h;\n      camera.updateProjectionMatrix();\n    }\n    new ResizeObserver(() => requestAnimationFrame(resize)).observe(viewContainer);\n    resize();\n\n    const clock = new THREE.Clock();\n    renderer.setAnimationLoop(() => {\n      const dt = Math.min(clock.getDelta(), 0.05);\n      const run = (S.fwd || S.rev) && !S.tripped;\n\n      // 1. Motor Rotor Inertia & Live SCADA Telemetry Update\n      omega += ((run ? dirNow() * 7.2 : 0) - omega) * Math.min(1, dt * (S.tripped ? 8 : 3.2));\n      rotor.rotation.z -= omega * dt;\n\n      if (inrushTimer > 0) inrushTimer = Math.max(0, inrushTimer - dt);\n      const liveRPM = Math.round((omega / 7.2) * 1760);\n      $('#meterRPM').textContent = `${liveRPM} RPM`;\n      if (S.tripped) {\n        $('#meterVolt').textContent = '0V (TRIP)';\n        $('#meterVolt').className = 'font-mono text-xs font-extrabold text-red-500';\n        $('#meterAmp').textContent = 'FAULT!';\n        $('#meterAmp').className = 'font-mono text-xs font-extrabold text-red-500';\n      } else {\n        $('#meterVolt').textContent = '380V';\n        $('#meterVolt').className = 'font-mono text-xs font-extrabold text-amber-400';\n        const amp = !run ? 0.0 : inrushTimer > 0 ? (24.5 * (inrushTimer / 0.6) + 4.8).toFixed(1) : (4.8 + Math.sin(clock.elapsedTime * 5) * 0.1).toFixed(1);\n        $('#meterAmp').textContent = `${amp} A`;\n        $('#meterAmp').className = `font-mono text-xs font-extrabold ${inrushTimer > 0 ? 'text-amber-400' : 'text-emerald-400'}`;\n      }\n\n      // 2. 3D Current Flow Particles along Power Cables\n      if (showFlowParticles && run && S.viewMode === 'twin') {\n        flowTime = (flowTime + dt * 0.9) % 1;\n        const activeBranch = S.fwd ? activeFlowPaths.fwd : activeFlowPaths.rev;\n        const allActive = activeBranch.concat(activeFlowPaths.motor);\n\n        FLOW_SPHERES.forEach(sp => {\n          const pathObj = allActive[sp.pathIdx];\n          if (pathObj && pathObj.curve) {\n            sp.mesh.visible = true;\n            sp.mesh.material.color.setHex(pathObj.col);\n            const t = (flowTime + sp.offset) % 1;\n            pathObj.curve.getPointAt(t, sp.mesh.position);\n          } else {\n            sp.mesh.visible = false;\n          }\n        });\n      } else {\n        FLOW_SPHERES.forEach(sp => sp.mesh.visible = false);\n      }\n\n      // 3. Interlock Box Flash on Block\n      if (ilkFlash > 0) {\n        ilkFlash -= dt;\n        const on = Math.floor(ilkFlash * 7) % 2 === 0;\n        ilkBox.material.emissive.setHex(on ? 0xef4444 : 0);\n        ilkBox.material.emissiveIntensity = 0.95;\n        if (ilkFlash <= 0) ilkBox.material.emissive.setHex(0);\n      }\n\n      // 4. Short-Circuit Sparks Physics\n      if (sparkT > 0) {\n        sparkT -= dt;\n        for (let i = 0; i < N; i++) {\n          sLife[i] -= dt;\n          if (sLife[i] <= 0) {\n            if (sparkT > 0.8) emit(i);\n            else sPos[i * 3 + 1] = -99;\n            continue;\n          }\n          sVel[i * 3 + 1] -= 9.8 * dt;\n          for (let k = 0; k < 3; k++) sPos[i * 3 + k] += sVel[i * 3 + k] * dt;\n        }\n        sGeo.attributes.position.needsUpdate = true;\n        sparks.material.opacity = Math.min(1, sparkT);\n        flash.intensity = sparkT > 0.8 ? Math.random() * 6 : 0;\n      } else {\n        sparks.material.opacity = 0;\n        flash.intensity = 0;\n      }\n\n      if (!renderer.xr.isPresenting) controls.update();\n\n      if (stereoVRActive && !renderer.xr.isPresenting) {\n        const w = viewContainer.clientWidth, h = viewContainer.clientHeight;\n        const halfW = Math.floor(w / 2);\n        renderer.setScissorTest(true);\n\n        cameraL.copy(camera);\n        cameraL.aspect = halfW / h;\n        cameraL.updateProjectionMatrix();\n        cameraL.translateX(-0.08);\n        renderer.setViewport(0, 0, halfW, h);\n        renderer.setScissor(0, 0, halfW, h);\n        renderer.render(scene, cameraL);\n\n        cameraR.copy(camera);\n        cameraR.aspect = halfW / h;\n        cameraR.updateProjectionMatrix();\n        cameraR.translateX(0.08);\n        renderer.setViewport(halfW, 0, w - halfW, h);\n        renderer.setScissor(halfW, 0, w - halfW, h);\n        renderer.render(scene, cameraR);\n      } else {\n        renderer.render(scene, camera);\n      }\n    });\n\n    config();\n  <\/script>\n<\/body>\n<\/html>",yd:"<!DOCTYPE html>\n<html lang=\"ko\" class=\"dark\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>3D 산업용 전동기 기동반 시뮬레이터 (Y-Δ & 단권변압기)<\/title>\n    <\!-- Tailwind CSS -->\n    <script src=\"https://cdn.tailwindcss.com\"><\/script>\n    <\!-- Three.js r128 -->\n    <script src=\"https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js\"><\/script>\n    <\!-- Tone.js for Industrial Relay & Motor Acoustics -->\n    <script src=\"https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js\"><\/script>\n    <\!-- FontAwesome Icons -->\n    <link rel=\"stylesheet\" href=\"https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css\">\n    <style>\n        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Pretendard:wght@400;500;600;700&display=swap');\n\n        * {\n            box-sizing: border-box;\n            user-select: none;\n        }\n        body {\n            margin: 0;\n            padding: 0;\n            overflow: hidden;\n            background-color: #070b12;\n            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;\n            color: #e2e8f0;\n        }\n        .mono {\n            font-family: 'JetBrains Mono', monospace;\n        }\n        #canvas-container {\n            position: absolute;\n            inset: 0;\n            width: 100vw;\n            height: 100vh;\n            z-index: 1;\n        }\n        /* Ultra-slim Top Bar */\n        .slim-bar {\n            background: rgba(7, 11, 18, 0.92);\n            border-bottom: 1px solid rgba(51, 65, 85, 0.7);\n        }\n        .hud-btn {\n            transition: all 0.12s ease;\n        }\n        .hud-btn:active {\n            transform: scale(0.95);\n        }\n        /* Custom Scrollbar */\n        ::-webkit-scrollbar {\n            width: 5px;\n            height: 5px;\n        }\n        ::-webkit-scrollbar-track {\n            background: #0f172a;\n        }\n        ::-webkit-scrollbar-thumb {\n            background: #334155;\n            border-radius: 3px;\n        }\n        ::-webkit-scrollbar-thumb:hover {\n            background: #475569;\n        }\n        /* Sequence active wire glow */\n        .wire-active {\n            stroke: #f59e0b !important;\n            stroke-width: 2.6px !important;\n            filter: drop-shadow(0 0 4px rgba(245, 158, 11, 0.85));\n        }\n        .wire-power-y {\n            stroke: #eab308 !important;\n            stroke-width: 2.8px !important;\n            filter: drop-shadow(0 0 5px rgba(234, 179, 8, 0.85));\n        }\n        .wire-power-d {\n            stroke: #ef4444 !important;\n            stroke-width: 2.8px !important;\n            filter: drop-shadow(0 0 5px rgba(239, 68, 68, 0.9));\n        }\n        .coil-active-y {\n            fill: rgba(234, 179, 8, 0.28) !important;\n            stroke: #eab308 !important;\n        }\n        .coil-active-d {\n            fill: rgba(239, 68, 68, 0.28) !important;\n            stroke: #ef4444 !important;\n        }\n        .coil-active-m {\n            fill: rgba(16, 185, 129, 0.28) !important;\n            stroke: #10b981 !important;\n        }\n        input[type=range] {\n            accent-color: #f59e0b;\n        }\n    <\/style>\n<\/head>\n<body class=\"relative w-screen h-screen overflow-hidden\">\n\n    <\!-- 3D Viewport Container (100% Unobstructed Fullscreen) -->\n    <div id=\"canvas-container\"><\/div>\n\n    <\!-- SINGLE ULTRA-SLIM 40px TOP BAR (No floating rectangular boxes covering the 3D scene) -->\n    <header class=\"fixed top-0 left-0 right-0 h-10 z-30 slim-bar px-3 flex items-center justify-between gap-2 overflow-x-auto no-scrollbar\">\n        <\!-- Left: Title & Live Compact Status + Direct Controls -->\n        <div class=\"flex items-center gap-2 shrink-0\">\n            <div class=\"flex items-center gap-1.5 pr-2 border-r border-slate-800\">\n                <i class=\"fa-solid fa-industry text-amber-400 text-xs\"><\/i>\n                <span class=\"text-xs font-bold text-white whitespace-nowrap\">Y-Δ 3D 기동반<\/span>\n                <div id=\"state-badge\" class=\"px-1.5 py-0.5 rounded text-[10px] font-bold mono bg-emerald-950/80 text-emerald-300 border border-emerald-500/40 flex items-center gap-1\">\n                    <span id=\"state-dot\" class=\"w-1.5 h-1.5 rounded-full bg-emerald-400\"><\/span>\n                    <span id=\"state-text\">READY<\/span>\n                <\/div>\n            <\/div>\n\n            <\!-- Hardware Direct Controls -->\n            <button id=\"btn-mccb\" onclick=\"toggleMCCB()\" class=\"hud-btn px-2 py-1 rounded bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-[11px] flex items-center gap-1 whitespace-nowrap\">\n                <i class=\"fa-solid fa-power-off text-[10px]\"><\/i>\n                <span id=\"btn-mccb-text\">MCCB ON<\/span>\n            <\/button>\n            <button onclick=\"pressStartButton()\" class=\"hud-btn px-2.5 py-1 rounded bg-emerald-500/20 hover:bg-emerald-500/35 border border-emerald-500 text-emerald-300 font-bold text-[11px] flex items-center gap-1 whitespace-nowrap\">\n                <span class=\"w-2 h-2 rounded-full bg-emerald-400\"><\/span>START\n            <\/button>\n            <button onclick=\"pressStopButton()\" class=\"hud-btn px-2.5 py-1 rounded bg-rose-500/20 hover:bg-rose-500/35 border border-rose-500 text-rose-300 font-bold text-[11px] flex items-center gap-1 whitespace-nowrap\">\n                <span class=\"w-2 h-2 rounded-full bg-rose-500\"><\/span>STOP\n            <\/button>\n            <button onclick=\"triggerEOCRTripTest()\" class=\"hud-btn px-2 py-1 rounded bg-rose-500/15 hover:bg-rose-500/30 border border-rose-500/40 text-rose-300 text-[11px] font-semibold whitespace-nowrap\" title=\"EOCR 과부하 트립 시험\">\n                EOCR 트립\n            <\/button>\n            <button onclick=\"resetEOCR()\" class=\"hud-btn px-2 py-1 rounded bg-sky-500/15 hover:bg-sky-500/30 border border-sky-500/40 text-sky-300 text-[11px] font-semibold whitespace-nowrap\" title=\"EOCR 트립 리셋\">\n                리셋\n            <\/button>\n\n            <\!-- Compact Timer T Slider -->\n            <div class=\"hidden md:flex items-center gap-1.5 pl-2 border-l <line x1=\"240\" y1=\"35\" x2=\"240\" y2=\"60\" stroke=\"#475569\" stroke-width=\"1.6\"/>\n                <g class=\"cursor-pointer\" onclick=\"pressStopButton()\">\n                    <line id=\"svg-ctrl-after-eocr\" x1=\"240\" y1=\"82\" x2=\"240\" y2=\"108\" stroke=\"#475569\" stroke-width=\"1.6\"/>\n                    <line id=\"svg-pb-stop\" x1=\"236\" y1=\"108\" x2=\"236\" y2=\"130\" stroke=\"#ef4444\" stroke-width=\"2.2\"/>\n                <\/g>\n                <g class=\"cursor-pointer\" onclick=\"pressStartButton()\">\n                    <line x1=\"240\" y1=\"130\" x2=\"240\" y2=\"155\" stroke=\"#475569\" stroke-width=\"1.6\"/>\n                    <line id=\"svg-pb-start\" x1=\"240\" y1=\"155\" x2=\"230\" y2=\"177\" stroke=\"#10b981\" stroke-width=\"2\"/>\n                <\/g>\n                <line id=\"svg-mcm-hold\" x1=\"275\" y1=\"155\" x2=\"267\" y2=\"177\" stroke=\"#10b981\" stroke-width=\"1.8\"/>\n                <line id=\"svg-branch-mcm\" x1=\"240\" y1=\"180\" x2=\"240\" y2=\"365\" stroke=\"#475569\" stroke-width=\"1.6\"/>\n                <circle id=\"svg-coil-mcm\" cx=\"240\" cy=\"380\" r=\"13\" fill=\"#0f172a\" stroke=\"#10b981\" stroke-width=\"1.6\"/>\n                <line id=\"svg-branch-timer\" x1=\"278\" y1=\"192\" x2=\"278\" y2=\"365\" stroke=\"#475569\" stroke-width=\"1.5\"/>\n                <circle id=\"svg-coil-t\" cx=\"278\" cy=\"380\" r=\"13\" fill=\"#0f172a\" stroke=\"#38bdf8\" stroke-width=\"1.6\"/>\n                <line id=\"svg-contact-tb\" x1=\"314\" y1=\"225\" x2=\"308\" y2=\"250\" stroke=\"#eab308\" stroke-width=\"2\"/>\n                <line id=\"svg-interlock-mcd\" x1=\"314\" y1=\"285\" x2=\"308\" y2=\"310\" stroke=\"#f87171\" stroke-width=\"2\"/>\n                <line id=\"svg-branch-mcy\" x1=\"314\" y1=\"310\" x2=\"314\" y2=\"365\" stroke=\"#475569\" stroke-width=\"1.5\"/>\n                <circle id=\"svg-coil-mcy\" cx=\"314\" cy=\"380\" r=\"13\" fill=\"#0f172a\" stroke=\"#eab308\" stroke-width=\"1.6\"/>\n                <line id=\"svg-contact-ta\" x1=\"350\" y1=\"225\" x2=\"340\" y2=\"248\" stroke=\"#38bdf8\" stroke-width=\"2\"/>\n                <line id=\"svg-interlock-mcy\" x1=\"350\" y1=\"285\" x2=\"344\" y2=\"310\" stroke=\"#eab308\" stroke-width=\"2\"/>\n                <line id=\"svg-branch-mcd\" x1=\"350\" y1=\"310\" x2=\"350\" y2=\"365\" stroke=\"#475569\" stroke-width=\"1.5\"/>\n                <circle id=\"svg-coil-mcd\" cx=\"350\" cy=\"380\" r=\"13\" fill=\"#0f172a\" stroke=\"#ef4444\" stroke-width=\"1.6\"/>\n            <\/svg>\n        <\/div>\n    <\/aside>\n\n    <aside id=\"right-panel\" class=\"hidden fixed top-12 right-3 w-[340px] z-20 bg-slate-950/95 border border-slate-700 rounded-xl p-2.5\">\n        <div class=\"flex items-center justify-between pb-1.5 mb-1.5 border-b border-slate-800\">\n            <span class=\"text-xs font-bold text-white\">실시간 파형 (전류·속도·상전압)<\/span>\n            <button onclick=\"toggleRightPanel()\" class=\"text-slate-400 hover:text-white text-xs\"><i class=\"fa-solid fa-xmark\"><\/i><\/button>\n        <\/div>\n        <canvas id=\"telemetry-chart\" width=\"320\" height=\"110\" class=\"w-full h-[110px] block bg-slate-950 rounded border border-slate-800\"><\/canvas>\n    <\/aside>\n\n    <\!-- Hidden placeholders so no floating boxes or tooltips ever appear on screen -->\n    <div id=\"hover-tooltip\" class=\"hidden\">\n        <span id=\"tooltip-title\"><\/span><span id=\"tooltip-badge\"><\/span><div id=\"tooltip-desc\"><\/div>\n    <\/div>\n    <div id=\"toast-banner\" class=\"hidden\"><i id=\"toast-icon\"><\/i><span id=\"toast-text\"><\/span><\/div>\n    <div id=\"labels-container\" class=\"hidden\"><\/div>\n\n    <\!-- MAIN APPLICATION & 3D SIMULATOR SCRIPT -->\n    <script>\n        /***********************************************************************\n         * 1. SYSTEM STATE & ELECTRICAL ENGINEERING MODEL (380V 3Φ 30kW 4-Pole)\n         ***********************************************************************/\n        const SIM = {\n            workMode: 'SIM',        // 'SIM' or 'WIRE'\n            mccbOn: true,           // Molded Case Circuit Breaker ON by default so user can press Start right away\n            eocrTripped: false,     // EOCR 95-96 NC open, 97-98 NO closed\n            state: 'READY',         // 'OFF', 'READY', 'STAR', 'OPEN_TRANS', 'DELTA', 'TRIP'\n            mcM: false,             // Main Contactor (U1, V1, W1)\n            mcY: false,             // Star Contactor (Shorts W2, U2, V2)\n            mcD: false,             // Delta Contactor (Loops U1-W2, V1-U2, W1-V2)\n            timerEnergized: false,\n            timerElapsed: 0.0,\n            timerTarget: 4.0,       // Default 4.0 sec Y -> Delta transition\n            openTransitionTimer: 0, // 45ms arc-clearing deadtime between MC-Y drop and MC-D pull-in\n            pbStartPressed: 0,      // Visual animation timer\n            pbStopPressed: 0,\n\n            // Motor Physics & Electrical Telemetry\n            rpm: 0,\n            syncRpm: 1800,\n            ratedCurrent: 58.0,     // 30kW @ 380V ~ 58A rated\n            dolLockCurrent: 348.0,  // 6x rated inrush if DOL\n            lineCurrent: 0.0,\n            phaseVoltage: 0.0,      // 220V in Star, 380V in Delta\n            motorTorque: 0.0,       // % of rated torque\n            loadTorque: 50.0,       // User adjustable load %\n            thermalAccumulator: 0.0,// EOCR I^2*t thermal model\n            deltaSwitchSpike: 0.0,  // Transient current spike on Y -> Delta switchover\n\n            // UI & Audio toggles\n            show3DLabels: false,\n            audioEnabled: true,\n            audioInitialized: false,\n\n            // Interactive 3D Wiring Practice state\n            selectedTerminal: null,\n            completedWires: new Set([\n                'U1', 'V1', 'W1', 'W2_D', 'U2_D', 'V2_D', 'W2_Y', 'U2_Y', 'V2_Y'\n            ]),\n            totalRequiredWires: 9,\n\n            // Telemetry History for Oscilloscope\n            history: []\n        };\n\n        // Pre-fill oscilloscope history\n        for (let i = 0; i < 160; i++) {\n            SIM.history.push({ iL: 0, rpm: 0, vp: 0 });\n        }\n\n        /***********************************************************************\n         * 2. INDUSTRIAL ACOUSTICS (Tone.js Synthesizer for Contactor Clack & Hum)\n         ***********************************************************************/\n        let contactorSynth = null;\n        let motorHumOsc = null;\n        let motorHumGain = null;\n\n        async function initAudioIfNeeded() {\n            if (SIM.audioInitialized || !SIM.audioEnabled || typeof Tone === 'undefined') return;\n            try {\n                await Tone.start();\n                contactorSynth = new Tone.MembraneSynth({\n                    pitchDecay: 0.015,\n                    octaves: 3,\n                    envelope: { attack: 0.001, decay: 0.07, sustain: 0, release: 0.04 }\n                }).toDestination();\n                contactorSynth.volume.value = -6;\n\n                motorHumGain = new Tone.Gain(0).toDestination();\n                motorHumOsc = new Tone.Oscillator(60, \"sawtooth\").connect(motorHumGain);\n                motorHumOsc.start();\n                SIM.audioInitialized = true;\n            } catch (e) {\n                // Ignore audio context restrictions if blocked\n            }\n        }\n\n        function playContactorClack(type = 'CLOSE') {\n            if (!SIM.audioEnabled) return;\n            initAudioIfNeeded();\n            if (!contactorSynth) return;\n            try {\n                if (type === 'CLOSE') {\n                    contactorSynth.triggerAttackRelease(\"C2\", \"32n\");\n                } else if (type === 'OPEN') {\n                    contactorSynth.triggerAttackRelease(\"G2\", \"32n\");\n                } else if (type === 'TRIP') {\n                    contactorSynth.triggerAttackRelease(\"A3\", \"16n\");\n                }\n            } catch (e) {}\n        }\n\n        function updateMotorAcoustics() {\n            if (!SIM.audioInitialized || !motorHumGain || !motorHumOsc) return;\n            if (!SIM.audioEnabled || (SIM.state !== 'STAR' && SIM.state !== 'DELTA')) {\n                motorHumGain.gain.rampTo(0, 0.1);\n                return;\n            }\n            const freq = 55 + (SIM.rpm / 1800) * 65;\n            motorHumOsc.frequency.rampTo(freq, 0.08);\n            const vol = SIM.state === 'STAR' ? 0.025 : 0.045;\n            motorHumGain.gain.rampTo(vol, 0.1);\n        }\n\n        /***********************************************************************\n         * 3. THREE.JS SCENE, CAMERA, ORBIT CONTROLS & LIGHTING\n         ***********************************************************************/\n        let scene, camera, renderer, raycaster, mouse;\n        const interactables = [];\n        const labelAnchors = [];\n        const currentParticles = [];\n        const practiceWireMeshes = {};\n\n        // 3D Dynamic Parts References\n        const meshes = {\n            mccbLever: null,\n            plungerM: null,\n            plungerD: null,\n            plungerY: null,\n            interlockArm: null,\n            timerPointer: null,\n            timerLedPwr: null,\n            timerLedOut: null,\n            eocrLedRun: null,\n            eocrLedTrip: null,\n            pbStartCap: null,\n            pbStopCap: null,\n            lampGL: null,\n            lampYL: null,\n            lampRL: null,\n            lampOL: null,\n            motorShaftGroup: null,\n            windingBarsU1V1W1: [],\n            windingBarsW2U2V2: [],\n            starShortingBridge: null\n        };\n\n        // Custom smooth camera orbit state\n        const camCtrl = {\n            isDown: false,\n            button: 0,\n            lastX: 0,\n            lastY: 0,\n            theta: 0.08,\n            phi: 1.20,\n            radius: 19.5,\n            target: new THREE.Vector3(1.5, 0.2, 0),\n            desiredTheta: 0.08,\n            desiredPhi: 1.20,\n            desiredRadius: 19.5,\n            desiredTarget: new THREE.Vector3(1.5, 0.2, 0),\n            dragMoved: false\n        };\n\n        function initThreeScene() {\n            const container = document.getElementById('canvas-container');\n            scene = new THREE.Scene();\n            scene.background = new THREE.Color(0x070b12);\n            scene.fog = new THREE.FogExp2(0x070b12, 0.014);\n\n            camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 200);\n            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: \"high-performance\" });\n            renderer.setSize(window.innerWidth, window.innerHeight);\n            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));\n            renderer.shadowMap.enabled = true;\n            renderer.shadowMap.type = THREE.PCFSoftShadowMap;\n            container.appendChild(renderer.domElement);\n\n            raycaster = new THREE.Raycaster();\n            mouse = new THREE.Vector2();\n\n            // Industrial Studio Lighting\n            const ambientLight = new THREE.AmbientLight(0xdbeafe, 0.65);\n            scene.add(ambientLight);\n\n            const mainDirLight = new THREE.DirectionalLight(0xffffff, 1.15);\n            mainDirLight.position.set(12, 22, 18);\n            mainDirLight.castShadow = true;\n            mainDirLight.shadow.mapSize.width = 2048;\n            mainDirLight.shadow.mapSize.height = 2048;\n            scene.add(mainDirLight);\n\n            const fillLight = new THREE.DirectionalLight(0x38bdf8, 0.45);\n            fillLight.position.set(-15, 8, 10);\n            scene.add(fillLight);\n\n            const warmAccent = new THREE.PointLight(0xf59e0b, 0.5, 30);\n            warmAccent.position.set(2, 6, 8);\n            scene.add(warmAccent);\n\n            // Semiconductor / Plant Cleanroom Floor Grid\n            const gridHelper = new THREE.GridHelper(60, 60, 0x1e293b, 0x0f172a);\n            gridHelper.position.y = -7.2;\n            scene.add(gridHelper);\n\n            // Build All 3D Hardware Modules\n            buildMCCEnclosureAndRails();\n            buildMCCBModule(-5.5, 3.6, 0);\n            buildEOCRModule(-1.5, 3.6, 0);\n            buildMagneticContactor('MC-M', -5.6, -1.0, 0, 0x10b981, '주 접촉기 (U1·V1·W1 전원공급)');\n            buildMagneticContactor('MC-D', -1.8, -1.0, 0, 0xef4444, '델타 접촉기 (380V Δ 루프 운전)');\n            buildMagneticContactor('MC-Y',  2.0, -1.0, 0, 0xeab308, '스타 접촉기 (W2·U2·V2 중성점 단락)');\n            buildMechanicalInterlockUnit(-0.05, -0.7, 0.85);\n            buildTimerModule(5.0, -1.0, 0);\n            buildOperatorControlStation(4.2, 3.6, 0);\n            buildThreePhaseMotorAnd6TerminalBox(9.6, -2.2, 0);\n            buildPowerBusbarsAnd3DWiring();\n            buildCurrentFlowParticles();\n\n            // Setup Mouse & Touch Event Listeners\n            const dom = renderer.domElement;\n            dom.addEventListener('pointerdown', onPointerDown);\n            dom.addEventListener('pointermove', onPointerMove);\n            dom.addEventListener('pointerup', onPointerUp);\n            dom.addEventListener('wheel', onMouseWheel, { passive: false });\n            dom.addEventListener('contextmenu', e => e.preventDefault());\n            window.addEventListener('resize', onWindowResize);\n        }\n\n        /***********************************************************************\n         * 4. BUILD REALISTIC 3D HARDWARE MODULES\n         ***********************************************************************/\n        // Helper to create crisp procedural canvas textures for industrial faceplates\n        function createLabelTexture(drawFn, width = 256, height = 256) {\n            const canvas = document.createElement('canvas');\n            canvas.width = width;\n            canvas.height = height;\n            const ctx = canvas.getContext('2d');\n            drawFn(ctx, width, height);\n            const tex = new THREE.CanvasTexture(canvas);\n            tex.anisotropy = 4;\n            return tex;\n        }\n\n        function registerInteractable(mesh, info) {\n            mesh.userData = Object.assign(mesh.userData || {}, info);\n            interactables.push(mesh);\n        }\n\n        // Disabled floating rectangular DOM tags so 3D models are never obscured\n        function add3DTag(text, subtext, worldPos, colorClass = '') {\n            return;\n        }\n\n        // 4.1 MCC Steel Backplate, Slotted PVC Wiring Ducts & DIN Rails\n        function buildMCCEnclosureAndRails() {\n            const group = new THREE.Group();\n\n            // Outer MCC Cabinet Housing Frame\n            const cabinetMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.6, metalness: 0.4 });\n            const backPanel = new THREE.Mesh(new THREE.BoxGeometry(15.6, 12.6, 0.4), cabinetMat);\n            backPanel.position.set(-0.6, 0.6, -0.6);\n            backPanel.receiveShadow = true;\n            group.add(backPanel);\n\n            // Galvanized Mounting Plate\n            const plateMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.4, metalness: 0.65 });\n            const innerPlate = new THREE.Mesh(new THREE.BoxGeometry(14.8, 11.8, 0.15), plateMat);\n            innerPlate.position.set(-0.6, 0.6, -0.35);\n            innerPlate.receiveShadow = true;\n            group.add(innerPlate);\n\n            // Slotted PVC Cable Ducts (Horizontal & Vertical)\n            const ductMat = new THREE.MeshStandardMaterial({ color: 0x475569, roughness: 0.5 });\n            const hDuctPositions = [5.6, 1.4, -3.5];\n            hDuctPositions.forEach(y => {\n                const duct = new THREE.Mesh(new THREE.BoxGeometry(14.2, 0.55, 0.75), ductMat);\n                duct.position.set(-0.6, y, 0.05);\n                group.add(duct);\n            });\n\n            // Aluminum 35mm DIN Rails\n            const railMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, roughness: 0.25, metalness: 0.85 });\n            const rail1 = new THREE.Mesh(new THREE.BoxGeometry(13.8, 0.45, 0.18), railMat);\n            rail1.position.set(-0.6, 3.6, -0.2);\n            group.add(rail1);\n\n            const rail2 = new THREE.Mesh(new THREE.BoxGeometry(13.8, 0.45, 0.18), railMat);\n            rail2.position.set(-0.6, -1.0, -0.2);\n            group.add(rail2);\n\n            // Heavy Motor Base Skid on Right\n            const skid = new THREE.Mesh(new THREE.BoxGeometry(6.8, 0.7, 5.5), cabinetMat);\n            skid.position.set(9.8, -5.3, 0);\n            group.add(skid);\n\n            scene.add(group);\n        }\n\n        // 4.2 MCCB (3-Pole Molded Case Circuit Breaker)\n        function buildMCCBModule(x, y, z) {\n            const g = new THREE.Group();\n            g.position.set(x, y, z);\n\n            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x1e2530, roughness: 0.45 });\n            const body = new THREE.Mesh(new THREE.BoxGeometry(2.6, 3.1, 1.4), bodyMat);\n            body.position.z = 0.5;\n            body.castShadow = true;\n            g.add(body);\n\n            // Faceplate Texture\n            const faceTex = createLabelTexture((ctx, w, h) => {\n                ctx.fillStyle = '#1e2530';\n                ctx.fillRect(0, 0, w, h);\n                ctx.strokeStyle = '#475569';\n                ctx.lineWidth = 4;\n                ctx.strokeRect(8, 8, w - 16, h - 16);\n                ctx.fillStyle = '#f8fafc';\n                ctx.font = 'bold 24px sans-serif';\n                ctx.fillText('MCCB 100AF', 22, 42);\n                ctx.fillStyle = '#38bdf8';\n                ctx.font = 'bold 18px monospace';\n                ctx.fillText('AC 380V 3P 75A', 22, 68);\n                ctx.fillStyle = '#ef4444';\n                ctx.fillText('ON (투입)', 85, 115);\n                ctx.fillStyle = '#10b981';\n                ctx.fillText('OFF (차단)', 80, 215);\n            });\n            const face = new THREE.Mesh(\n                new THREE.PlaneGeometry(2.4, 2.9),\n                new THREE.MeshBasicMaterial({ map: faceTex })\n            );\n            face.position.set(0, 0, 1.21);\n            g.add(face);\n\n            // R-S-T Top & Bottom Screw Terminals\n            const screwMat = new THREE.MeshStandardMaterial({ color: 0xd97706, metalness: 0.85, roughness: 0.2 });\n            [-0.75, 0, 0.75].forEach((tx, idx) => {\n                const topTerm = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 0.25, 16), screwMat);\n                topTerm.rotation.x = Math.PI / 2;\n                topTerm.position.set(tx, 1.35, 0.95);\n                g.add(topTerm);\n\n                const botTerm = topTerm.clone();\n                botTerm.position.set(tx, -1.35, 0.95);\n                g.add(botTerm);\n            });\n\n            // Toggle Lever Handle\n            const leverGroup = new THREE.Group();\n            leverGroup.position.set(0, -0.1, 1.22);\n            const leverMesh = new THREE.Mesh(\n                new THREE.BoxGeometry(0.55, 0.85, 0.45),\n                new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.3 })\n            );\n            leverMesh.position.y = 0.22;\n            leverGroup.add(leverMesh);\n            g.add(leverGroup);\n            meshes.mccbLever = leverGroup;\n\n            registerInteractable(body, {\n                title: 'MCCB (배선용 차단기 3P 75A)',\n                badge: '주전원 개폐',\n                desc: '3상 380V R·S·T 주회로 전원을 투입(ON)하거나 단락/과전류 시 회로를 차단(OFF)합니다.',\n                onClick: () => toggleMCCB()\n            });\n            registerInteractable(leverMesh, body.userData);\n\n            add3DTag('MCCB', '3P 75A 차단기', new THREE.Vector3(x, y + 1.85, z + 1.0), 'border-sky-500/60 text-sky-300');\n            scene.add(g);\n        }\n\n        // 4.3 EOCR (Electronic Over-Current Relay - Digital Type)\n        function buildEOCRModule(x, y, z) {\n            const g = new THREE.Group();\n            g.position.set(x, y, z);\n\n            const body = new THREE.Mesh(\n                new THREE.BoxGeometry(2.5, 2.7, 1.35),\n                new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.4 })\n            );\n            body.position.z = 0.48;\n            body.castShadow = true;\n            g.add(body);\n\n            // 3 Current Transformer (CT) Through-holes at top\n            const holeMat = new THREE.MeshStandardMaterial({ color: 0x090d16 });\n            [-0.7, 0, 0.7].forEach(hx => {\n                const ct = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.6, 16), holeMat);\n                ct.position.set(hx, 1.15, 0.55);\n                g.add(ct);\n            });\n\n            // Faceplate with Digital Display, Knobs (LOAD / D-TIME), TEST & RESET Buttons\n            const faceTex = createLabelTexture((ctx, w, h) => {\n                ctx.fillStyle = '#0f172a';\n                ctx.fillRect(0, 0, w, h);\n                ctx.strokeStyle = '#f59e0b';\n                ctx.lineWidth = 4;\n                ctx.strokeRect(6, 6, w - 12, h - 12);\n                ctx.fillStyle = '#fbbf24';\n                ctx.font = 'bold 22px sans-serif';\n                ctx.fillText('EOCR-SS (과전류계전기)', 16, 36);\n                // LCD Screen Window\n                ctx.fillStyle = '#022c22';\n                ctx.fillRect(20, 48, 130, 52);\n                ctx.fillStyle = '#10b981';\n                ctx.font = 'bold 26px monospace';\n                ctx.fillText('SET 62A', 30, 84);\n                // Labels for terminals 95-96-97-98\n                ctx.fillStyle = '#94a3b8';\n                ctx.font = '16px monospace';\n                ctx.fillText('95-96(NC)  97-98(NO)', 20, 238);\n            });\n            const face = new THREE.Mesh(\n                new THREE.PlaneGeometry(2.35, 2.5),\n                new THREE.MeshBasicMaterial({ map: faceTex })\n            );\n            face.position.set(0, 0, 1.17);\n            g.add(face);\n\n            // Setting Rotary Dials (Current & Time)\n            const dialMat = new THREE.MeshStandardMaterial({ color: 0xfacc15 });\n            const dial1 = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.15, 16), dialMat);\n            dial1.rotation.x = Math.PI / 2;\n            dial1.position.set(-0.6, -0.25, 1.22);\n            g.add(dial1);\n\n            const dial2 = dial1.clone();\n            dial2.position.set(0.0, -0.25, 1.22);\n            g.add(dial2);\n\n            // TEST & RESET Tactile Buttons on EOCR\n            const testBtn = new THREE.Mesh(\n                new THREE.BoxGeometry(0.42, 0.32, 0.18),\n                new THREE.MeshStandardMaterial({ color: 0xef4444 })\n            );\n            testBtn.position.set(0.68, -0.1, 1.22);\n            g.add(testBtn);\n            registerInteractable(testBtn, {\n                title: 'EOCR TEST 버튼 (트립 모의 시험)',\n                badge: '95-96 개방',\n                desc: '과부하 트립을 강제로 발생시켜 95-96(b접점)을 차단하고 전동기를 비상 정지시킵니다.',\n                onClick: () => triggerEOCRTripTest()\n            });\n\n            const resetBtn = new THREE.Mesh(\n                new THREE.BoxGeometry(0.42, 0.32, 0.18),\n                new THREE.MeshStandardMaterial({ color: 0x3b82f6 })\n            );\n            resetBtn.position.set(0.68, -0.52, 1.22);\n            g.add(resetBtn);\n            registerInteractable(resetBtn, {\n                title: 'EOCR RESET 버튼 (트립 복귀)',\n                badge: '정상 복귀',\n                desc: '과부하 트립 상태를 해제하고 EOCR 95-96(b접점)을 정상 복귀시킵니다.',\n                onClick: () => resetEOCR()\n            });\n\n            // Status LEDs (RUN Green, TRIP Red)\n            meshes.eocrLedRun = new THREE.Mesh(\n                new THREE.SphereGeometry(0.09, 12, 12),\n                new THREE.MeshStandardMaterial({ color: 0x10b981, emissive: 0x10b981, emissiveIntensity: 0.8 })\n            );\n            meshes.eocrLedRun.position.set(0.65, 0.45, 1.2);\n            g.add(meshes.eocrLedRun);\n\n            meshes.eocrLedTrip = new THREE.Mesh(\n                new THREE.SphereGeometry(0.09, 12, 12),\n                new THREE.MeshStandardMaterial({ color: 0x450a0a, emissive: 0xef4444, emissiveIntensity: 0 })\n            );\n            meshes.eocrLedTrip.position.set(0.9, 0.45, 1.2);\n            g.add(meshes.eocrLedTrip);\n\n            registerInteractable(body, {\n                title: 'EOCR (전자식 과전류 계전기)',\n                badge: '과부하 보호',\n                desc: '주회로 3상 전류를 감시하여 정격 초과 시 한시 동작으로 95-96(b접점)을 열어 기동반을 차단합니다. 클릭 시 트립/리셋 전환.',\n                onClick: () => SIM.eocrTripped ? resetEOCR() : triggerEOCRTripTest()\n            });\n\n            add3DTag('EOCR', '과전류계전기', new THREE.Vector3(x, y + 1.7, z + 1.0), 'border-amber-500/60 text-amber-300');\n            scene.add(g);\n        }\n\n        // 4.4 Magnetic Contactors (MC-M, MC-D, MC-Y) with Moving Plunger Core & Interactive Terminals\n        function buildMagneticContactor(id, x, y, z, themeHex, roleDesc) {\n            const g = new THREE.Group();\n            g.position.set(x, y, z);\n\n            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.4, metalness: 0.25 });\n            const body = new THREE.Mesh(new THREE.BoxGeometry(2.7, 3.3, 1.55), bodyMat);\n            body.position.z = 0.55;\n            body.castShadow = true;\n            g.add(body);\n\n            // Top Tower / Auxiliary Contact Block Housing\n            const tower = new THREE.Mesh(\n                new THREE.BoxGeometry(1.75, 1.65, 0.65),\n                new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.35 })\n            );\n            tower.position.set(0, 0, 1.55);\n            g.add(tower);\n\n            // Faceplate Label on Contactor\n            const hexStr = '#' + themeHex.toString(16).padStart(6, '0');\n            const faceTex = createLabelTexture((ctx, w, h) => {\n                ctx.fillStyle = '#1e293b';\n                ctx.fillRect(0, 0, w, h);\n                ctx.fillStyle = hexStr;\n                ctx.fillRect(0, 0, w, 52);\n                ctx.fillStyle = '#090d16';\n                ctx.font = 'bold 34px sans-serif';\n                ctx.fillText(id, 72, 38);\n                ctx.fillStyle = '#e2e8f0';\n                ctx.font = 'bold 19px monospace';\n                ctx.fillText('1L1   3L2   5L3', 32, 85);\n                ctx.fillText('2T1   4T2   6T3', 32, 238);\n                ctx.fillStyle = '#94a3b8';\n                ctx.font = '17px sans-serif';\n                ctx.fillText('13NO 14NO 21NC 22NC', 24, 205);\n            });\n            const face = new THREE.Mesh(\n                new THREE.PlaneGeometry(1.7, 1.6),\n                new THREE.MeshBasicMaterial({ map: faceTex })\n            );\n            face.position.set(0, 0, 1.89);\n            g.add(face);\n\n            // Moving Armature Plunger Core (Physically pulls inward along Z when energized!)\n            const plunger = new THREE.Mesh(\n                new THREE.BoxGeometry(0.68, 0.52, 0.32),\n                new THREE.MeshStandardMaterial({ color: themeHex, roughness: 0.25 })\n            );\n            plunger.position.set(0, 0, 1.96);\n            g.add(plunger);\n\n            if (id === 'MC-M') meshes.plungerM = plunger;\n            if (id === 'MC-D') meshes.plungerD = plunger;\n            if (id === 'MC-Y') meshes.plungerY = plunger;\n\n            // Top & Bottom 3-Phase Power Terminals (R/S/T brass screws)\n            const brassMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b, metalness: 0.85, roughness: 0.2 });\n            [-0.75, 0, 0.75].forEach((tx, idx) => {\n                const topScrew = new THREE.Mesh(new THREE.CylinderGeometry(0.19, 0.19, 0.25, 16), brassMat);\n                topScrew.rotation.x = Math.PI / 2;\n                topScrew.position.set(tx, 1.38, 1.08);\n                g.add(topScrew);\n\n                const botScrew = topScrew.clone();\n                botScrew.position.set(tx, -1.38, 1.08);\n                g.add(botScrew);\n\n                // Register bottom terminals for 3D Interactive Wiring Mode\n                const phaseNames = ['R/U', 'S/V', 'T/W'];\n                registerInteractable(botScrew, {\n                    title: `${id} 하부 주단자 (${phaseNames[idx]})`,\n                    badge: '주회로 단자',\n                    desc: `${id} 전자접촉기의 ${idx + 1}상 출력 단자입니다. [3D 결선 실습] 모드에서 전동기 단자와 연결할 수 있습니다.`,\n                    terminalId: `${id}_BOT_${idx}`,\n                    onClick: () => handleTerminalClick(`${id}_BOT_${idx}`)\n                });\n            });\n\n            // If MC-Y (Star Contactor), add the iconic 3-phase Neutral Shorting Copper Busbar at top!\n            if (id === 'MC-Y') {\n                const shortBar = new THREE.Mesh(\n                    new THREE.BoxGeometry(1.85, 0.22, 0.16),\n                    new THREE.MeshStandardMaterial({ color: 0xeab308, metalness: 0.8, roughness: 0.2, emissive: 0xeab308, emissiveIntensity: 0.15 })\n                );\n                shortBar.position.set(0, 1.65, 1.08);\n                g.add(shortBar);\n                meshes.starShortingBridge = shortBar;\n            }\n\n            registerInteractable(body, {\n                title: `${id} 전자접촉기 (Magnetic Contactor)`,\n                badge: roleDesc.split(' ')[0],\n                desc: `${roleDesc}. 코일 여자 시 중앙 플런저가 흡입되며 주접점(a)이 닫히고 인터록 보조접점(b)이 열립니다.`,\n                onClick: () => inspectContactorAction(id)\n            });\n            registerInteractable(tower, body.userData);\n            registerInteractable(plunger, body.userData);\n\n            const badgeColor = id === 'MC-M' ? 'border-emerald-500/60 text-emerald-300' :\n                               id === 'MC-D' ? 'border-rose-500/60 text-rose-300' : 'border-amber-500/60 text-amber-300';\n            add3DTag(id, id === 'MC-M' ? '주 접촉기' : id === 'MC-D' ? 'Δ 운전' : 'Y 기동(단락)', new THREE.Vector3(x, y + 2.0, z + 1.2), badgeColor);\n            scene.add(g);\n        }\n\n        // 4.5 Mechanical & Electrical Interlock Block between MC-D and MC-Y\n        function buildMechanicalInterlockUnit(x, y, z) {\n            const g = new THREE.Group();\n            g.position.set(x, y, z);\n\n            const body = new THREE.Mesh(\n                new THREE.BoxGeometry(1.05, 1.4, 0.8),\n                new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.4 })\n            );\n            g.add(body);\n\n            // Seesaw Mechanical Interlock Rocker Arm\n            const rocker = new THREE.Mesh(\n                new THREE.BoxGeometry(0.85, 0.22, 0.25),\n                new THREE.MeshStandardMaterial({ color: 0xf59e0b, roughness: 0.3 })\n            );\n            rocker.position.set(0, 0, 0.45);\n            g.add(rocker);\n            meshes.interlockArm = rocker;\n\n            registerInteractable(body, {\n                title: '기계적·전기적 인터록 유닛 (MC-D ↔ MC-Y)',\n                badge: '3상 단락방지',\n                desc: '스타(MC-Y)와 델타(MC-D) 접촉기가 동시에 투입되면 3상 전원 단락 사고가 발생하므로, 기계적 레버와 상대 b접점으로 동시 투입을 원천 차단합니다.',\n                onClick: () => testInterlockSafety()\n            });\n\n            add3DTag('INTERLOCK', '동시투입 방지', new THREE.Vector3(x, y - 1.2, z + 0.6), 'border-purple-500/60 text-purple-300');\n            scene.add(g);\n        }\n\n        // 4.6 8-Pin On-Delay Timer Module (한시 동작 순시 복귀 타이머 - T)\n        function buildTimerModule(x, y, z) {\n            const g = new THREE.Group();\n            g.position.set(x, y, z);\n\n            // 8-Pin Octal Socket Base\n            const base = new THREE.Mesh(\n                new THREE.BoxGeometry(1.75, 2.4, 0.7),\n                new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.5 })\n            );\n            base.position.z = 0.25;\n            g.add(base);\n\n            // Timer Relay Body\n            const relayBody = new THREE.Mesh(\n                new THREE.BoxGeometry(1.55, 1.85, 1.25),\n                new THREE.MeshStandardMaterial({ color: 0xdbeafe, roughness: 0.35 })\n            );\n            relayBody.position.z = 1.1;\n            relayBody.castShadow = true;\n            g.add(relayBody);\n\n            // Timer Faceplate with Scale Dial (0 ~ 10 SEC), PWR LED & UP LED\n            const faceTex = createLabelTexture((ctx, w, h) => {\n                ctx.fillStyle = '#1e293b';\n                ctx.fillRect(0, 0, w, h);\n                ctx.strokeStyle = '#38bdf8';\n                ctx.lineWidth = 5;\n                ctx.strokeRect(6, 6, w - 12, h - 12);\n                ctx.fillStyle = '#38bdf8';\n                ctx.font = 'bold 24px sans-serif';\n                ctx.fillText('TIMER (한시T)', 20, 36);\n                ctx.fillStyle = '#94a3b8';\n                ctx.font = 'bold 16px monospace';\n                ctx.fillText('PWR(2-7)   UP(8-6)', 22, 66);\n                // Graduated circular dial arc\n                ctx.strokeStyle = '#f8fafc';\n                ctx.lineWidth = 4;\n                ctx.beginPath();\n                ctx.arc(128, 155, 58, 0.75 * Math.PI, 2.25 * Math.PI);\n                ctx.stroke();\n                ctx.fillStyle = '#facc15';\n                ctx.font = 'bold 18px monospace';\n                ctx.fillText('0s', 50, 215);\n                ctx.fillText('5s', 118, 88);\n                ctx.fillText('10s', 182, 215);\n            });\n            const face = new THREE.Mesh(\n                new THREE.PlaneGeometry(1.48, 1.78),\n                new THREE.MeshBasicMaterial({ map: faceTex })\n            );\n            face.position.set(0, 0, 1.74);\n            g.add(face);\n\n            // Rotary Time Setting Knob & Pointer\n            const knobGroup = new THREE.Group();\n            knobGroup.position.set(0, -0.15, 1.78);\n            const knob = new THREE.Mesh(\n                new THREE.CylinderGeometry(0.32, 0.36, 0.25, 24),\n                new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.3 })\n            );\n            knob.rotation.x = Math.PI / 2;\n            knobGroup.add(knob);\n\n            const pointer = new THREE.Mesh(\n                new THREE.BoxGeometry(0.08, 0.32, 0.28),\n                new THREE.MeshStandardMaterial({ color: 0xf59e0b })\n            );\n            pointer.position.y = 0.14;\n            knobGroup.add(pointer);\n            g.add(knobGroup);\n            meshes.timerPointer = knobGroup;\n\n            // Timer PWR & OUT LEDs\n            meshes.timerLedPwr = new THREE.Mesh(\n                new THREE.SphereGeometry(0.075, 12, 12),\n                new THREE.MeshStandardMaterial({ color: 0x064e3b, emissive: 0x10b981, emissiveIntensity: 0 })\n            );\n            meshes.timerLedPwr.position.set(-0.42, 0.35, 1.76);\n            g.add(meshes.timerLedPwr);\n\n            meshes.timerLedOut = new THREE.Mesh(\n                new THREE.SphereGeometry(0.075, 12, 12),\n                new THREE.MeshStandardMaterial({ color: 0x450a0a, emissive: 0xf59e0b, emissiveIntensity: 0 })\n            );\n            meshes.timerLedOut.position.set(0.42, 0.35, 1.76);\n            g.add(meshes.timerLedOut);\n\n            registerInteractable(relayBody, {\n                title: '한시 타이머 T (8핀 소켓형 On-Delay Timer)',\n                badge: '8-5(b) / 8-6(a)',\n                desc: '기동 후 설정된 시간(기본 4.0초)이 경과하면 한시 b접점(8-5)을 열어 MC-Y를 소자시키고, 한시 a접점(8-6)을 닫아 MC-D(델타 운전)를 여자시킵니다.',\n                onClick: () => {\n                    const nextVal = SIM.timerTarget >= 8.0 ? 2.5 : SIM.timerTarget + 1.5;\n                    document.getElementById('slider-timer').value = nextVal;\n                    updateTimerSetting(nextVal);\n                    showToast(`타이머(T) 설정 시간이 ${nextVal.toFixed(1)}초로 변경되었습니다.`);\n                }\n            });\n            registerInteractable(knob, relayBody.userData);\n\n            add3DTag('TIMER (T)', '한시 8-5b / 8-6a', new THREE.Vector3(x, y + 1.6, z + 1.3), 'border-sky-500/60 text-sky-300');\n            scene.add(g);\n        }\n\n        // 4.7 Local Control Station (PB-START, PB-STOP, Pilot Lamps GL/YL/RL/OL)\n        function buildOperatorControlStation(x, y, z) {\n            const g = new THREE.Group();\n            g.position.set(x, y, z);\n\n            const box = new THREE.Mesh(\n                new THREE.BoxGeometry(3.4, 2.8, 1.15),\n                new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.45 })\n            );\n            box.position.z = 0.4;\n            box.castShadow = true;\n            g.add(box);\n\n            // Pilot Lamps Row at Top: GL (Green), YL (Yellow), RL (Red), OL (Orange)\n            const lampConfigs = [\n                { key: 'lampGL', x: -1.15, color: 0x10b981, label: 'GL(정지)' },\n                { key: 'lampYL', x: -0.38, color: 0xeab308, label: 'YL(Y기동)' },\n                { key: 'lampRL', x:  0.38, color: 0xef4444, label: 'RL(Δ운전)' },\n                { key: 'lampOL', x:  1.15, color: 0xf97316, label: 'OL(과부하)' }\n            ];\n            lampConfigs.forEach(cfg => {\n                const bezel = new THREE.Mesh(\n                    new THREE.CylinderGeometry(0.28, 0.3, 0.16, 20),\n                    new THREE.MeshStandardMaterial({ color: 0x0f172a, metalness: 0.7 })\n                );\n                bezel.rotation.x = Math.PI / 2;\n                bezel.position.set(cfg.x, 0.72, 1.0);\n                g.add(bezel);\n\n                const dome = new THREE.Mesh(\n                    new THREE.SphereGeometry(0.23, 20, 20),\n                    new THREE.MeshStandardMaterial({\n                        color: cfg.color,\n                        emissive: cfg.color,\n                        emissiveIntensity: 0.08,\n                        roughness: 0.2\n                    })\n                );\n                dome.position.set(cfg.x, 0.72, 1.06);\n                g.add(dome);\n                meshes[cfg.key] = dome;\n            });\n\n            // Pushbutton PB-START (Green NO)\n            const startBezel = new THREE.Mesh(\n                new THREE.CylinderGeometry(0.42, 0.46, 0.22, 24),\n                new THREE.MeshStandardMaterial({ color: 0x94a3b8, metalness: 0.8, roughness: 0.2 })\n            );\n            startBezel.rotation.x = Math.PI / 2;\n            startBezel.position.set(-0.75, -0.45, 1.02);\n            g.add(startBezel);\n\n            const startCap = new THREE.Mesh(\n                new THREE.CylinderGeometry(0.32, 0.32, 0.25, 24),\n                new THREE.MeshStandardMaterial({ color: 0x10b981, emissive: 0x10b981, emissiveIntensity: 0.25 })\n            );\n            startCap.rotation.x = Math.PI / 2;\n            startCap.position.set(-0.75, -0.45, 1.12);\n            g.add(startCap);\n            meshes.pbStartCap = startCap;\n\n            registerInteractable(startCap, {\n                title: 'PB-START (기동 푸시버튼 - a접점)',\n                badge: 'Y기동 개시',\n                desc: '누르면 MC-M(주접촉기), 타이머(T), MC-Y(스타 접촉기)가 동시에 여자되어 Y결선(상전압 220V, 기동전류 1/3)으로 기동을 시작합니다.',\n                onClick: () => pressStartButton()\n            });\n\n            // Pushbutton PB-STOP (Red NC)\n            const stopBezel = startBezel.clone();\n            stopBezel.position.set(0.75, -0.45, 1.02);\n            g.add(stopBezel);\n\n            const stopCap = new THREE.Mesh(\n                new THREE.CylinderGeometry(0.32, 0.32, 0.25, 24),\n                new THREE.MeshStandardMaterial({ color: 0xef4444, emissive: 0xef4444, emissiveIntensity: 0.25 })\n            );\n            stopCap.rotation.x = Math.PI / 2;\n            stopCap.position.set(0.75, -0.45, 1.12);\n            g.add(stopCap);\n            meshes.pbStopCap = stopCap;\n\n            registerInteractable(stopCap, {\n                title: 'PB-STOP (정지 푸시버튼 - b접점)',\n                badge: '자기유지 해제',\n                desc: '누르면 제어회로의 자기유지(MC-M a접점)가 해제되어 전동기가 안전하게 정지합니다.',\n                onClick: () => pressStopButton()
